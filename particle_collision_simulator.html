<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Collision & Reaction Rate Simulator</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #1e1e24; 
            color: #fff; 
            margin: 20px; 
        }
        .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 900px; margin: 0 auto; }
        .controls { background: #2a2a35; padding: 20px; border-radius: 8px; flex: 1; min-width: 280px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .simulation { flex: 2; min-width: 320px; }
        canvas { background: #111; border: 2px solid #444; border-radius: 8px; display: block; width: 100%; height: auto; }
        .slider-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .stats { margin-top: 20px; font-family: monospace; background: #0c0c10; padding: 15px; border-radius: 6px; border: 1px solid #333; }
        .stat-line { margin: 6px 0; font-size: 14px; display: flex; justify-content: space-between; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; width: 100%; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0056b3; }
        .color-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <h2>Controls</h2>
            
            <div class="slider-group">
                <label for="tempSlider">Kinetic Energy (Temperature): <span id="tempVal" style="color:#ffcc00">3.0</span></label>
                <input type="range" id="tempSlider" min="0.5" max="8" step="0.1" value="3">
            </div>
            
            <div class="slider-group">
                <label for="eaSlider">Activation Energy Barrier (Eₐ): <span id="eaVal" style="color:#ffcc00">15</span></label>
                <input type="range" id="eaSlider" min="0" max="40" step="1" value="15">
            </div>

            <div class="slider-group">
                <label for="countASlider">Starting Reactant A count: <span id="countAVal" style="color:#ff8080">50</span></label>
                <input type="range" id="countASlider" min="1" max="150" step="1" value="50">
            </div>

            <div class="slider-group">
                <label for="countBSlider">Starting Reactant B count: <span id="countBVal" style="color:#80c1ff">50</span></label>
                <input type="range" id="countBSlider" min="1" max="150" step="1" value="50">
            </div>
            
            <div class="slider-group">
                <label for="containerSlider">Container Size (Pressure/Volume): <span id="containerVal" style="color:#c9a8ff">100</span>%</label>
                <input type="range" id="containerSlider" min="30" max="100" step="1" value="100">
            </div>
            
            <button id="resetBtn">Reset Simulation</button>
            <button id="pauseBtn" style="margin-top:10px; background:#555;">Pause</button>
            <p style="font-size:12px; color:#999; margin-top:8px;">Changing particle counts applies on the next reset. Container size applies live.</p>
            
            <div class="stats">
                <h3>Reaction Matrix</h3>
                <div class="stat-line"><span><span class="color-dot" style="background:#ff4d4d"></span>Reactant A:</span> <span id="countA">50</span></div>
                <div class="stat-line"><span><span class="color-dot" style="background:#3399ff"></span>Reactant B:</span> <span id="countB">50</span></div>
                <div class="stat-line"><span><span class="color-dot" style="background:#2ecc71"></span>Product C:</span> <span id="countC">0</span></div>
                <div class="stat-line" style="border-top: 1px solid #333; padding-top: 8px; margin-top: 8px; font-weight: bold;">
                    <span>Conversion Yield:</span> <span id="progress" style="color:#2ecc71">0%</span>
                </div>
            </div>

            <div class="stats" style="margin-top: 15px;">
                <h3 style="margin-top:0;">Concentration vs. Time</h3>
                <canvas id="graphCanvas" width="280" height="160" style="width:100%; height:auto; background:#111; border:1px solid #333; border-radius:4px;"></canvas>
            </div>
        </div>
        
        <div class="simulation">
            <canvas id="simCanvas" width="550" height="450"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const graphCanvas = document.getElementById('graphCanvas');
        const gctx = graphCanvas.getContext('2d');
        let history = []; // {t, a, b, c}
        let tickCount = 0;
        const maxHistoryPoints = 200;
        
        const tempSlider = document.getElementById('tempSlider');
        const eaSlider = document.getElementById('eaSlider');
        const countASlider = document.getElementById('countASlider');
        const countBSlider = document.getElementById('countBSlider');
        const containerSlider = document.getElementById('containerSlider');
        const resetBtn = document.getElementById('resetBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        
        const tempVal = document.getElementById('tempVal');
        const eaVal = document.getElementById('eaVal');
        const countAVal = document.getElementById('countAVal');
        const countBVal = document.getElementById('countBVal');
        const containerVal = document.getElementById('containerVal');

        let running = true;
        let bounds = { minX: 0, minY: 0, maxX: 0, maxY: 0 };

        function updateBounds() {
            const pct = parseInt(containerSlider.value) / 100;
            const simW = canvas.width * pct;
            const simH = canvas.height * pct;
            bounds.minX = (canvas.width - simW) / 2;
            bounds.minY = (canvas.height - simH) / 2;
            bounds.maxX = bounds.minX + simW;
            bounds.maxY = bounds.minY + simH;
        }
        const countA = document.getElementById('countA');
        const countB = document.getElementById('countB');
        const countC = document.getElementById('countC');
        const progress = document.getElementById('progress');

        let particles = [];
        const radius = 6;
        let initialReactants = 100;

        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'A' (Red), 'B' (Blue), 'C' (Green)
                this.radius = radius;
                this.setRandomVelocity();
            }

            setRandomVelocity() {
                const speed = parseFloat(tempSlider.value);
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x - this.radius < bounds.minX) { this.x = bounds.minX + this.radius; this.vx *= -1; }
                if (this.x + this.radius > bounds.maxX) { this.x = bounds.maxX - this.radius; this.vx *= -1; }
                if (this.y - this.radius < bounds.minY) { this.y = bounds.minY + this.radius; this.vy *= -1; }
                if (this.y + this.radius > bounds.maxY) { this.y = bounds.maxY - this.radius; this.vy *= -1; }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                if (this.type === 'A') ctx.fillStyle = '#ff4d4d';
                else if (this.type === 'B') ctx.fillStyle = '#3399ff';
                else ctx.fillStyle = '#2ecc71';
                ctx.fill();
                ctx.closePath();
            }
        }

        function init() {
            particles = [];
            history = [];
            tickCount = 0;
            updateBounds();
            const numA = parseInt(countASlider.value);
            const numB = parseInt(countBSlider.value);
            initialReactants = numA + numB;

            const pad = 15;
            const spawnW = Math.max(bounds.maxX - bounds.minX - pad * 2, 10);
            const spawnH = Math.max(bounds.maxY - bounds.minY - pad * 2, 10);

            for (let i = 0; i < numA; i++) {
                particles.push(new Particle(bounds.minX + pad + Math.random() * spawnW, bounds.minY + pad + Math.random() * spawnH, 'A'));
            }
            for (let i = 0; i < numB; i++) {
                particles.push(new Particle(bounds.minX + pad + Math.random() * spawnW, bounds.minY + pad + Math.random() * spawnH, 'B'));
            }
            updateLabels();
        }

        function clampToBounds() {
            particles.forEach(p => {
                if (p.x < bounds.minX + p.radius) p.x = bounds.minX + p.radius;
                if (p.x > bounds.maxX - p.radius) p.x = bounds.maxX - p.radius;
                if (p.y < bounds.minY + p.radius) p.y = bounds.minY + p.radius;
                if (p.y > bounds.maxY - p.radius) p.y = bounds.maxY - p.radius;
            });
        }

        function drawContainer() {
            ctx.strokeStyle = '#c9a8ff';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.strokeRect(bounds.minX, bounds.minY, bounds.maxX - bounds.minX, bounds.maxY - bounds.minY);
            ctx.setLineDash([]);
        }

        function handleCollisions() {
            const ea = parseFloat(eaSlider.value);
            
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    let p1 = particles[i];
                    let p2 = particles[j];

                    let dx = p2.x - p1.x;
                    let dy = p2.y - p1.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < p1.radius + p2.radius && distance > 0) {
                        let overlap = (p1.radius + p2.radius) - distance;
                        let nx = dx / distance;
                        let ny = dy / distance;

                        p1.x -= nx * overlap / 2;
                        p1.y -= ny * overlap / 2;
                        p2.x += nx * overlap / 2;
                        p2.y += ny * overlap / 2;

                        let rvx = p2.vx - p1.vx;
                        let rvy = p2.vy - p1.vy;
                        let collisionEnergy = 0.5 * (rvx * rvx + rvy * rvy);

                        if (((p1.type === 'A' && p2.type === 'B') || (p1.type === 'B' && p2.type === 'A')) && collisionEnergy >= ea) {
                            p1.type = 'C';
                            p2.type = 'C';
                        }

                        let kx = p1.vx - p2.vx;
                        let ky = p1.vy - p2.vy;
                        let p = (nx * kx + ny * ky);
                        
                        p1.vx -= p * nx;
                        p1.vy -= p * ny;
                        p2.vx += p * nx;
                        p2.vy += p * ny;
                    }
                }
            }
        }

        function updateLabels() {
            tempVal.textContent = parseFloat(tempSlider.value).toFixed(1);
            eaVal.textContent = eaSlider.value;
            countAVal.textContent = countASlider.value;
            countBVal.textContent = countBSlider.value;
            
            let a = particles.filter(p => p.type === 'A').length;
            let b = particles.filter(p => p.type === 'B').length;
            let c = particles.filter(p => p.type === 'C').length;

            countA.textContent = a;
            countB.textContent = b;
            countC.textContent = c;
            progress.textContent = Math.round((c / initialReactants) * 100) + '%';

            history.push({ t: tickCount, a, b, c });
            if (history.length > maxHistoryPoints) history.shift();
            drawGraph();
        }

        function drawGraph() {
            const w = graphCanvas.width;
            const h = graphCanvas.height;
            gctx.clearRect(0, 0, w, h);

            if (history.length < 2) return;

            const maxCount = Math.max(initialReactants, 10);
            const padding = 4;

            function plot(key, color) {
                gctx.beginPath();
                gctx.strokeStyle = color;
                gctx.lineWidth = 2;
                history.forEach((point, i) => {
                    const x = padding + (i / (maxHistoryPoints - 1)) * (w - padding * 2);
                    const y = h - padding - (point[key] / maxCount) * (h - padding * 2);
                    if (i === 0) gctx.moveTo(x, y);
                    else gctx.lineTo(x, y);
                });
                gctx.stroke();
            }

            plot('a', '#ff4d4d');
            plot('b', '#3399ff');
            plot('c', '#2ecc71');
        }

        tempSlider.addEventListener('input', () => {
            const targetSpeed = parseFloat(tempSlider.value);
            particles.forEach(p => {
                let currentSpeed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                if(currentSpeed === 0) currentSpeed = 0.001; 
                p.vx = (p.vx / currentSpeed) * targetSpeed;
                p.vy = (p.vy / currentSpeed) * targetSpeed;
            });
            updateLabels();
        });

        eaSlider.addEventListener('input', updateLabels);
        countASlider.addEventListener('input', updateLabels);
        countBSlider.addEventListener('input', updateLabels);
        containerSlider.addEventListener('input', () => {
            containerVal.textContent = containerSlider.value;
            updateBounds();
            clampToBounds();
        });
        resetBtn.addEventListener('click', init);
        pauseBtn.addEventListener('click', () => {
            running = !running;
            pauseBtn.textContent = running ? 'Pause' : 'Resume';
            pauseBtn.style.background = running ? '#555' : '#28a745';
        });

        function tick() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawContainer();

            if (running) {
                handleCollisions();
                tickCount++;
                particles.forEach(p => p.update());
                if (Math.random() < 0.15) updateLabels();
            }

            particles.forEach(p => p.draw());

            requestAnimationFrame(tick);
        }

        init();
        tick();
    </script>
</body>
</html>

      if(!found.length){myResult.appendChild(h("div",{className:"alert alert-info"},'No one found matching "'+query+'". Try your surname.'));return;}
      if(found.length>6){myResult.appendChild(h("div",{className:"alert alert-info"},"Multiple matches — be more specific."));return;}

      found.forEach(pupil=>{
        const ne=normEmail(pupil.email);
        const name=((pupil.pref||pupil.forename||"")+" "+(pupil.surname||"")).trim();
        const fd=formData.find(f=>normEmail(f.email)===ne);

        const card=h("div",{className:"card mb-16"});
        const ch=h("div",{className:"card-header",style:{background:"var(--accent-soft)"}});
        ch.appendChild(h("div",null,
          h("div",{style:{fontWeight:700,fontSize:"18px",color:"var(--accent)"}},name),
          h("div",{style:{fontSize:"12px",color:"var(--text2)",marginTop:"3px"}},
            "Year "+displayYg(pupil.yg)+" · "+pupil.house+" house · Tutor: "+(pupil.tutor||"—"))
        ));
        card.appendChild(ch);

        // Per-date timetable
        const tbl=h("table",{style:{width:"100%",fontSize:"13px"}});
        tbl.appendChild(h("thead",null,h("tr",null,
          h("th",{style:{padding:"10px 14px",textAlign:"left",minWidth:"90px"}},"Date"),
          h("th",{style:{padding:"10px 14px",textAlign:"left"}},"Allocated activity"),
          h("th",{style:{padding:"10px 14px",textAlign:"left"}},"Venue"),
        )));
        const tb=h("tbody",null);

        sortedDateIndices().forEach(di=>{ const d=dates[di];
          const actName=getPupilActPub(ne,di);
          const isUnassigned=actName==="__UNASSIGNED__";
          const actObj=actName&&!isUnassigned?findActByName_exact(actName):null;
          const hasSplit=isSplitAct(actObj);
          const col=actName&&!isUnassigned?gc(actName):"var(--text3)";
          const half=d.half||"S1";
          const ht=half.toLowerCase();

          // Detect if allocation is a manual override
          const dateKey=di+"|"+ne;
          const isDateOverride=!!(allocDateOverrides[dateKey]&&allocDateOverrides[dateKey]!=="__UNASSIGNED__");
          const isHalfOverride=!isDateOverride&&!!(Object.keys(allocOverrides[ht]||{}).find(k=>normEmail(k)===ne));
          const isOverride=isDateOverride||isHalfOverride;

          // Sub-group
          const subGroup=actName&&!isUnassigned&&savedSubGroups[actName]?
            (()=>{const sg=savedSubGroups[actName];const grps=(sg[ht]||[]);const g=grps.find(g2=>g2.pupils&&g2.pupils.some(p2=>normEmail(p2.email)===ne));return g?g.name:null;})():null;

          // Choices for this half
          const c1=half==="S1"?(fd?fd.s1c1||"":""):(fd?fd.s2c1||"":"");
          const c2=half==="S1"?(fd?fd.s1c2||"":""):(fd?fd.s2c2||"":"");
          const c3=half==="S1"?(fd?fd.s1c3||"":""):(fd?fd.s2c3||"":"");

          const tr2=h("tr",{style:{borderBottom:"1px solid var(--border)",background:di%2===0?"var(--surface2)":"var(--surface)"}});

          // Date
          tr2.appendChild(h("td",{style:{padding:"10px 14px",fontWeight:600,whiteSpace:"nowrap"}},
            h("div",null,d.label),
            h("div",{style:{fontSize:"10px",color:"var(--text3)"}},halfLabel(half)),
            d.note?h("div",{style:{fontSize:"10px",color:"var(--amber)"}},"⚠ "+d.note):null
          ));

          // Activity
          const actCell=h("td",{style:{padding:"10px 14px"}});
          if(isUnassigned){actCell.appendChild(h("span",{style:{color:"var(--red)",fontWeight:600}},"Unassigned"));}
          else if(actName){
            actCell.appendChild(h("div",{style:{fontWeight:700,color:col,fontSize:"14px"}},actName));
            if(subGroup)actCell.appendChild(h("div",{style:{fontSize:"11px",color:gc(subGroup),fontWeight:600,marginTop:"2px"}},subGroup));
          }else{
            actCell.appendChild(h("span",{style:{color:"var(--text3)"}},"—"));
          }
          tr2.appendChild(actCell);

          // v81: Venue cell — where to go. For split activities show both
          // session venues; otherwise the activity's main venue.
          const venueCell=h("td",{style:{padding:"10px 14px",fontSize:"12px"}});
          if(isUnassigned||!actName){
            venueCell.appendChild(h("span",{style:{color:"var(--text3)"}},"—"));

            const vA=actObj?.sessAVenue||(actObj?.v&&actObj.v!=="TBC"?actObj.v:"");

              h("div",{style:{fontSize:"11px",marginTop:"2px"}},h("span",{style:{color:"var(--purple)",fontWeight:600}},sessB+": "),h("span",{style:{color:"var(--text2)"}},vB||"TBC"))
            ));

          tb.appendChild(tr2);

  // ── Browse tab ──
  function buildBrowseTab(){
    if(!pupils.length){
      tabContent.appendChild(h("div",{className:"card card-pad",style:{textAlign:"center",padding:"40px"}},
        h("div",{style:{fontSize:"18px",marginBottom:"8px"}},"⏳"),
        h("div",{style:{fontWeight:600,marginBottom:"4px"}},"Loading…"),
        h("div",{style:{fontSize:"12px",color:"var(--text3)"}},"Connecting to Supabase.")
      ));
      if(!window._pubBrowseRetry){window._pubBrowseRetry=true;
        setTimeout(()=>{window._pubBrowseRetry=false;if(window._pubTab==="browse"){tabContent.innerHTML="";buildBrowseTab();}},3000);}
      return;
    }
    tabContent.appendChild(h("p",{style:{fontSize:"13px",color:"var(--text2)",marginBottom:"12px"}},"See what activities your year group or house are doing. Names and allocations only — choices are private."));

    const ygs=ygSort([...new Set(pupils.map(p=>p.yg).filter(Boolean))]);
    const houses=[...new Set(pupils.map(p=>p.house).filter(Boolean))].sort();

    if(!window._pubBrowseMode)window._pubBrowseMode="yg";
    if(!window._pubBrowseVal)window._pubBrowseVal=ygs[0]||"";

    // Mode toggle
    const modeRow=h("div",{className:"flex mb-12",style:{gap:"6px"}});
    const browseContent=h("div",null);

    function rebuildBrowse(){
      browseContent.innerHTML="";
      Array.from(modeRow.children).filter(b=>b.tagName==="BUTTON").forEach(b=>b.className="btn btn-sm "+(b.getAttribute("data-m")===window._pubBrowseMode?"btn-primary":"btn-ghost"));
      buildBrowseContent();
    }

    // Mode buttons (v81: added "All (everyone)")
    [["yg","By Year Group"],["house","By House"],["all","All (everyone)"]].forEach(([m,label])=>{
      const b=h("button",{className:"btn btn-sm "+(window._pubBrowseMode===m?"btn-primary":"btn-ghost"),onClick:()=>{
        window._pubBrowseMode=m;
        window._pubBrowseVal=m==="yg"?(ygs[0]||""):m==="house"?(houses[0]||""):"__ALL__";
        rebuildBrowse();
      }},label);
      b.setAttribute("data-m",m);modeRow.appendChild(b);
    });

    // Value selector
    const valSel=h("select",{style:{marginLeft:"8px"},onChange:e=>{window._pubBrowseVal=e.target.value;buildBrowseContent();}});
    modeRow.appendChild(valSel);
    tabContent.appendChild(modeRow);
    tabContent.appendChild(browseContent);

    function populateValSel(){
      valSel.innerHTML="";
      if(window._pubBrowseMode==="all"){ valSel.style.display="none"; return; }
      valSel.style.display="";
      const opts=window._pubBrowseMode==="yg"?ygs:houses;
      opts.forEach(v=>{
        const o=h("option",{value:v},window._pubBrowseMode==="yg"?"Year "+displayYg(v):v);
        if(v===window._pubBrowseVal)o.selected=true;
        valSel.appendChild(o);
      });
    }

    function buildBrowseContent(){
      populateValSel();
      browseContent.innerHTML="";
      const mode=window._pubBrowseMode;
      const filterVal=window._pubBrowseVal;
      if(mode!=="all"&&!filterVal)return;

      const group=mode==="yg"?
        pupils.filter(p=>p.yg===filterVal):
        mode==="house"?
        pupils.filter(p=>p.house===filterVal):
        pupils.slice(); // "all" — everyone

      if(!group.length){browseContent.appendChild(h("div",{className:"alert alert-info"},"No pupils found."));return;}

      const sorted=[...group].sort(cmpPupilYgSurname);
      const label=mode==="yg"?"Year "+displayYg(filterVal):mode==="house"?filterVal+" house":"All pupils";

      // Summary stats — what activities is this group doing?
      const actCount={};
      sorted.forEach(p=>{
        const ne=normEmail(p.email);
        sortedDateIndices().forEach(di=>{
          const an=getPupilActPub(ne,di);
          if(an&&an!=="__UNASSIGNED__"){actCount[an]=(actCount[an]||0)+1;}
        });
      });
      // v81: popular-activities summary card removed (not wanted).
      // Per-date breakdown
      sortedDateIndices().forEach(di=>{ const d=dates[di];
        const half=d.half||"S1";
        // Group pupils by activity for this date
        const byAct={};
        sorted.forEach(p=>{
          const ne=normEmail(p.email);
          const an=getPupilActPub(ne,di)||"—";
          if(!byAct[an])byAct[an]=[];
          byAct[an].push({name:((p.pref||p.forename||"")+" "+(p.surname||"")).trim(),house:p.house,yg:p.yg});
        });

        const card=h("div",{className:"card mb-12"});
        const ch=h("div",{className:"card-header",style:{background:halfColorSoft(half)}});
        ch.appendChild(h("div",null,
          h("span",{style:{fontWeight:700,fontSize:"14px",color:halfColor(half)}},d.label),
          h("span",{style:{fontSize:"11px",color:"var(--text3)",marginLeft:"8px"}},halfLabel(half)),
          d.note?h("span",{style:{fontSize:"11px",color:"var(--amber)",marginLeft:"8px"}},"⚠ "+d.note):null
        ));
        card.appendChild(ch);

        const actGrid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:"10px",padding:"12px 14px"}});
        Object.entries(byAct).filter(([an])=>an!=="—").sort((a,b)=>a[0].localeCompare(b[0])).forEach(([an,ps])=>{
          const col=gc(an);
          const actTile=h("div",{style:{background:col+"10",border:"1px solid "+col+"30",borderRadius:"8px",padding:"10px 12px"}});
          actTile.appendChild(h("div",{style:{fontWeight:700,color:col,fontSize:"12px",marginBottom:"6px"}},an+" ("+ps.length+")"));
          ps.forEach(p=>{
            actTile.appendChild(h("div",{style:{fontSize:"11px",padding:"2px 0",borderBottom:"1px solid "+col+"20",color:"var(--text2)"}},p.name));
          });
          actGrid.appendChild(actTile);
        });

        // Unallocated
        const unalloc=byAct["—"]||[];
        if(unalloc.length>0){
          const uTile=h("div",{style:{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:"8px",padding:"10px 12px"}});
          uTile.appendChild(h("div",{style:{fontWeight:700,color:"var(--text3)",fontSize:"12px",marginBottom:"6px"}},"Not yet allocated ("+unalloc.length+")"));
          unalloc.forEach(p=>uTile.appendChild(h("div",{style:{fontSize:"11px",padding:"2px 0",color:"var(--text3)"}},p.name)));
          actGrid.appendChild(uTile);
        }

        card.appendChild(actGrid);
        browseContent.appendChild(card);
      });
    }

    rebuildBrowse();
  }

  setPubTab(window._pubTab);

  // Test Supabase connection and show diagnostic if failing
  (async()=>{
    if(!supaClient){
      const errDiv=h("div",{style:{background:"#fef3c7",border:"1px solid #d97706",borderRadius:"8px",padding:"14px 18px",margin:"12px 20px",fontSize:"13px"}},
        h("strong",null,"⚠ Cannot connect to Supabase"),h("br",null),
        "supaClient is null — credentials not initialised. Check console."
      );
      tabContent.prepend(errDiv);
      return;
    }
    // Quick test read using direct fetch
    try{
      const testUrl=`${supaClient.url}/rest/v1/lex_data?select=key&limit=1`;
      const testRes=await fetch(testUrl,{headers:{"apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key,"Accept":"application/json"}});
      if(!testRes.ok){
        const errText=await testRes.text();
        console.error("Supabase connection test failed:",testRes.status,errText);
        const errDiv=h("div",{style:{background:"#fef3c7",border:"1px solid #d97706",borderRadius:"8px",padding:"14px 18px",margin:"12px 20px",fontSize:"13px"}},
          h("strong",null,"⚠ Supabase connection error"),h("br",null),
          "HTTP "+testRes.status+" — "+errText.slice(0,100),h("br",null),
          h("span",{style:{fontSize:"11px",color:"#92400e"}},"If this is a permissions error (401/403), check that the lex_data table has a public SELECT policy in Supabase → Authentication → Policies.")
        );
        tabContent.prepend(errDiv);
      }
    }catch(e){
      console.error("Supabase connection test threw:",e.message);
    }
  })();
  setInterval(async()=>{
    if(supaConnected){
      await loadFromSupabase();saveLocal();
      setPubTab(window._pubTab);
    }
  },5*60*1000);
}

              if(!act2){const pairing=acts.find(a=>a.di.includes(di)&&a.sessA===sd.a.act);if(pairing)act2={n:sd.a.act,yg:pairing.yg,v:pairing.sessAVenue||pairing.v,mb:pairing.mb};}
              rows.push({di,n:sd.a.act,role:sd.a.role,act:act2,date:dates[di],sess:"A"});

              rows.push({di,n:sd.b.act,role:sd.b.role,act:act2,date:dates[di],sess:"B"});

          } else {
            if(sd.a){const act2=findActByName_exact(sd.a.act);rows.push({di,n:sd.a.act,role:sd.a.role,act:act2,date:dates[di],sess:null});}

        else{

          const halfOrder=[];const seen=new Set();
          sortedDateIndices().forEach(di=>{const d=dates[di];const hv=d.half||"S1";if(!seen.has(hv)){seen.add(hv);halfOrder.push(hv);}});
          halfOrder.forEach(half=>{

                if(act.v&&act.v!=="TBC")tile.appendChild(h("div",{style:{fontSize:"10px",color:"var(--text3)"}},act.v));

    sortedDateIndices().forEach(di=>{ const d=dates[di];
      const th=h("th",{style:{padding:"6px 8px",textAlign:"center",minWidth:"100px",whiteSpace:"nowrap"}},
        h("div",{style:{fontWeight:600}},d.label),
        h("div",{style:{fontSize:"9px",color:"var(--text3)",fontWeight:400}},halfLabelShort(d.half))
      );
      if(d.note)th.appendChild(h("div",{style:{fontSize:"8px",color:"var(--amber)"}},"⚠ "+d.note));
      hdr.appendChild(th);
    });
    thead.appendChild(hdr);tbl.appendChild(thead);

    const tbody=h("tbody",null);
    const sortedStaffList=sortedStaff(staff);

    function buildRows(filterVal){
      tbody.innerHTML="";
      const fl=filterVal?sortedStaffList.filter(s=>s.n.toLowerCase().includes(filterVal.toLowerCase())||s.c.toLowerCase().includes(filterVal.toLowerCase())):sortedStaffList;
      fl.forEach(s=>{
        const tr=h("tr",{style:{borderBottom:"1px solid var(--border)"}});
        tr.appendChild(h("td",{style:{padding:"6px 10px",position:"sticky",left:0,background:"var(--surface)",zIndex:1,whiteSpace:"nowrap"}},
          h("span",{style:{fontWeight:600,fontSize:"12px"}},s.n),
          h("span",{style:{fontFamily:"var(--mono)",fontSize:"9px",color:"var(--text3)",marginLeft:"5px"}},s.c)
        ));

        // Summer + YTD cells (ported from admin staff cal)
        const st=stats[s.c]||{alln:0,tdfrac:0,priorYTD:0};
        const sumTotal=dates.length;
        const sumN=st.alln||0;
        const sumFrac=sumTotal>0?(sumN/sumTotal):0;
        const tdFrac=sumTotal>0?(sumN/sumTotal):0;
        const combinedYTD=tdFrac+(st.priorYTD||0);
        tr.appendChild(h("td",{style:{textAlign:"center",padding:"6px 8px"}},
          h("div",{style:{fontWeight:700,fontSize:"12px",color:sumFrac>0?"var(--accent)":"var(--text3)"}},sumN+"/"+sumTotal),
          h("div",{className:"prog-bar",style:{marginTop:"2px"}},h("div",{className:"prog-fill",style:{width:Math.min(sumFrac*100,100)+"%",background:"var(--accent)"}}))
        ));
        tr.appendChild(h("td",{style:{textAlign:"center",padding:"6px 8px"}},
          h("div",{style:{fontWeight:700,fontSize:"12px",color:combinedYTD>0?"var(--purple)":"var(--text3)"}},combinedYTD.toFixed(2)),
          h("div",{className:"prog-bar",style:{marginTop:"2px"}},h("div",{className:"prog-fill",style:{width:Math.min(Math.min(combinedYTD,1)*100,100)+"%",background:"var(--purple)"}}))
        ));

        sortedDateIndices().forEach(di=>{
          const sd=saGetDate(di,s.c);
          const td=h("td",{style:{padding:"5px 7px",textAlign:"center",minWidth:"100px",verticalAlign:"top"}});
          if(sd&&sd.split&&sd.a&&sd.b&&sd.a.act!==sd.b.act){
            // B1: different components for A and B — sa values are already component names
            td.style.background="var(--surface2)";
            [[sd.a,"P1","var(--accent)"],[sd.b,"P4","var(--purple)"]].forEach(([info,lbl,lc])=>{
              const col=gc(info.act);
              const div=h("div",{style:{fontSize:"9px",marginBottom:"2px",borderLeft:"2px solid "+lc,paddingLeft:"4px",textAlign:"left"}});
              div.appendChild(h("span",{style:{fontWeight:700,color:lc,fontSize:"8px"}},lbl+" "));
              div.appendChild(h("span",{style:{fontWeight:600,color:col}},info.act));
              // Look up pairing to show venue for this component
              const pairing=info===sd.a
                ?acts.find(a=>a.di.includes(di)&&a.sessA===info.act)
                :acts.find(a=>a.di.includes(di)&&a.sessB===info.act);
              if(pairing){
                const venue=info===sd.a?(pairing.sessAVenue||pairing.v):(pairing.sessBVenue||pairing.v);
                if(venue)div.appendChild(h("div",{style:{fontSize:"8px",color:"var(--text3)",marginLeft:"0"}},"· "+venue));
              }
              td.appendChild(div);
            });
          } else if(sd){
            const act=sd.a?sd.a.act:null;const role=sd.a?sd.a.role:"support";
            const actObj=act?findActByName_exact(act):null;
            const hasSplit=isSplitAct(actObj);
            const col=act?gc(act):null;
            td.style.background=act?col+"18":"transparent";
            if(act){
              const roleSpan=h("span",{style:{fontSize:"8px",fontWeight:700,padding:"0 3px",borderRadius:"3px",marginBottom:"2px",display:"inline-block",background:role==="lead"?"var(--accent)":"var(--surface2)",color:role==="lead"?"white":"var(--text2)"}},role==="lead"?"L":"S");
              td.appendChild(roleSpan);
              if(hasSplit){
                td.appendChild(h("div",{style:{fontWeight:600,color:col,fontSize:"10px"}},act));
                td.appendChild(h("div",{style:{fontSize:"8px",color:"var(--accent)"}},"P1: "+(actObj.sessA||"")+(actObj.sessAVenue?" · "+actObj.sessAVenue:"")));
                td.appendChild(h("div",{style:{fontSize:"8px",color:"var(--purple)"}},"P4: "+(actObj.sessB||"")+(actObj.sessBVenue?" · "+actObj.sessBVenue:"")));
              } else {
                td.appendChild(h("div",{style:{fontWeight:600,color:col,fontSize:"11px"}},act));
                const venue=actObj?(actObj.v||actObj.venue):null;
                if(venue)td.appendChild(h("div",{style:{fontSize:"8px",color:"var(--text3)"}},"📍 "+venue));
              }
            } else {
              td.appendChild(h("span",{style:{color:"var(--text3)",fontSize:"10px"}},"—"));
            }
          } else {
            td.appendChild(h("span",{style:{color:"var(--text3)",fontSize:"10px"}},"—"));
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    filterInp.addEventListener("input",e=>buildRows(e.target.value.trim()));
    tbl.appendChild(tbody);tableWrap.appendChild(tbl);tabContent.appendChild(tableWrap);
    buildRows("");
  }

  setStaffTab(window._staffViewTab);
}

function renderAdminSync(el){
  el.appendChild(h("div",{style:{fontWeight:700,fontSize:"14px",marginBottom:"4px"}},"Cloud Sync — Supabase"));
  el.appendChild(h("p",{style:{fontSize:"12px",color:"var(--text3)",marginBottom:"16px",lineHeight:"1.7"}},"Connect to Supabase to sync your data across all admin devices automatically."));

  // Status card
  const ok=supaConnected;
  el.appendChild(h("div",{className:"card card-pad mb-16",style:{background:ok?"var(--green-soft)":"var(--amber-soft)",border:"1px solid "+(ok?"var(--green)":"var(--amber)")}},
    h("div",{style:{fontWeight:700,color:ok?"var(--green)":"var(--amber)",marginBottom:"4px"}},ok?"Connected to Supabase":"Not connected — local only"),
    h("div",{style:{fontSize:"11px",color:"var(--text2)"}},ok?"Saves sync to all admin sessions automatically.":"Changes only visible in this browser.")
  ));

  // ── Sync Health diagnostic ──
  if(supaConnected){
    const healthCard=h("div",{className:"card card-pad mb-16"});
    healthCard.appendChild(h("div",{style:{fontWeight:700,fontSize:"13px",marginBottom:"8px"}},"🩺 Sync Health"));

    // Compute local vs last-synced fingerprint to find pending changes
    const dirtyKeys=[];
    _ALL_KEYS.forEach(k=>{
      try{
        const v=_stateForKey(k);
        const fp=JSON.stringify(v);
        if(fp!==_lastSyncedFingerprints[k])dirtyKeys.push(k);
      }catch(_){dirtyKeys.push(k+" (unreadable)");}
    });

    const statusRow=h("div",{style:{display:"flex",gap:"16px",fontSize:"11px",marginBottom:"10px",flexWrap:"wrap"}});
    statusRow.appendChild(h("div",null,
      h("span",{style:{color:"var(--text3)"}},"Sync status: "),
      h("span",{style:{fontWeight:700,color:syncStatus==="online"?"var(--green)":syncStatus==="error"?"var(--red)":"var(--amber)"}},syncStatus||"unknown")
    ));
    statusRow.appendChild(h("div",null,
      h("span",{style:{color:"var(--text3)"}},"Last sync: "),
      h("span",{style:{fontWeight:600}},lastSyncTime?lastSyncTime.toLocaleTimeString():"never")
    ));
    statusRow.appendChild(h("div",null,
      h("span",{style:{color:"var(--text3)"}},"Activities: "),
      h("span",{style:{fontWeight:700}},acts.length)
    ));
    statusRow.appendChild(h("div",null,
      h("span",{style:{color:"var(--text3)"}},"Pupils: "),
      h("span",{style:{fontWeight:700}},pupils.length)
    ));
    healthCard.appendChild(statusRow);

    if(dirtyKeys.length>0){
      const isFirst=Object.keys(_lastSyncedFingerprints).length===0;
      const dirtyBox=h("div",{style:{padding:"8px 12px",background:"var(--amber-soft)",borderRadius:"4px",marginBottom:"8px",fontSize:"12px",color:"var(--text2)",lineHeight:1.5}});
      if(isFirst){
        dirtyBox.appendChild(h("strong",{style:{color:"var(--amber)"}},"⚠ This tab has not synced yet this session. "));
        dirtyBox.appendChild(document.createTextNode("All "+dirtyKeys.length+" data keys will be pushed on the next save. Edits made here are safe locally but not yet visible to other admins."));
      } else {
        dirtyBox.appendChild(h("strong",{style:{color:"var(--amber)"}},"⚠ "+dirtyKeys.length+" key"+(dirtyKeys.length!==1?"s":"")+" pending sync: "));
        dirtyBox.appendChild(document.createTextNode(dirtyKeys.slice(0,8).join(", ")+(dirtyKeys.length>8?", +"+(dirtyKeys.length-8)+" more":"")));
        dirtyBox.appendChild(h("div",{style:{marginTop:"4px",fontSize:"11px",color:"var(--text3)"}},"These will save automatically next time you make a change. Or click \"Force sync now\" below."));
      }
      healthCard.appendChild(dirtyBox);
    } else {
      healthCard.appendChild(h("div",{style:{padding:"6px 12px",background:"var(--green-soft)",borderRadius:"4px",marginBottom:"8px",fontSize:"11px",color:"var(--green)"}},"✓ All local changes are in sync with Supabase."));
    }

    // Action buttons
    const actBtnRow=h("div",{style:{display:"flex",gap:"8px",flexWrap:"wrap"}});
    actBtnRow.appendChild(h("button",{className:"btn btn-primary btn-sm",onClick:async()=>{
      toast("Force syncing local data to cloud...");
      // Reset fingerprints so saveSupa writes everything
      _lastSyncedFingerprints={};
      saveSupa();
      // Wait a bit then refresh display
      setTimeout(()=>{
        const m=document.querySelector(".main");if(m){m.innerHTML="";renderAdminSync(m);}
        toast(syncStatus==="online"?"Force sync complete ✓":"Force sync had issues — check Sync Status above");
      },1500);
    }},"Force sync now"));
    actBtnRow.appendChild(h("button",{className:"btn btn-ghost btn-sm",onClick:async()=>{
      toast("Pulling fresh data from Supabase...");
      try{
        await loadFromSupabase();
        if(syncStatus!=="error"){lastSyncTime=new Date();syncStatus="online";}
        const m=document.querySelector(".main");if(m){m.innerHTML="";renderAdminSync(m);}
        toast(syncStatus==="online"?"Pull complete — local data updated ✓":"Pull failed — Supabase unreachable");
      }catch(e){toast("Pull failed: "+(e.message||e),"err");}
    }},"Pull fresh from cloud"));
    actBtnRow.appendChild(h("button",{className:"btn btn-warn btn-sm",onClick:async()=>{
      // Actual diagnostic — round-trip test that captures the real error
      const out=h("div",{style:{marginTop:"12px",padding:"12px",background:"var(--surface2)",borderRadius:"4px",fontFamily:"var(--mono)",fontSize:"11px",lineHeight:1.6,whiteSpace:"pre-wrap"}});
      healthCard.appendChild(out);
      function log(msg,col){
        const line=h("div",{style:col?{color:col}:{}},msg);
        out.appendChild(line);
      }
      log("=== Supabase round-trip diagnostic ===","var(--text2)");
      log("URL: "+SUPA_URL);
      log("Key: "+SUPA_KEY.slice(0,20)+"…"+SUPA_KEY.slice(-8));
      log("");

      // Test 1: simple SELECT
      log("Test 1: GET /rest/v1/lex_data?limit=1");
      try{
        const res=await fetch(`${SUPA_URL}/rest/v1/lex_data?select=key&limit=1`,{
          headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Accept":"application/json"}
        });
        const txt=await res.text();
        if(res.ok){log("  ✓ HTTP "+res.status+" — read works","var(--green)");}
        else{log("  ✗ HTTP "+res.status+" — "+txt.slice(0,200),"var(--red)");}
      }catch(e){log("  ✗ NETWORK ERROR: "+(e.message||e),"var(--red)");}

      // Test 2: write-and-read-back
      log("");
      log("Test 2: POST /rest/v1/lex_data (write test key)");
      const testKey="lex12-synctest-"+Date.now();
      const testValue={diagnostic:true,ts:new Date().toISOString()};
      try{
        const res=await fetch(`${SUPA_URL}/rest/v1/lex_data`,{
          method:"POST",
          headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,
            "Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"},
          body:JSON.stringify({key:testKey,value:JSON.stringify(testValue),updated_at:new Date().toISOString()})
        });
        const txt=await res.text();
        if(res.ok){
          log("  ✓ HTTP "+res.status+" — write works","var(--green)");
        } else {
          log("  ✗ HTTP "+res.status+" — "+txt.slice(0,400),"var(--red)");
          if(res.status===401||res.status===403)log("  → Likely RLS policy issue. Check that the public write policy exists in Supabase.","var(--amber)");
          else if(res.status===404)log("  → Table 'lex_data' may not exist. Check Supabase Table Editor.","var(--amber)");
          else if(res.status===503||res.status===504)log("  → Supabase still warming up post-resume. Wait 30s and try again.","var(--amber)");
        }
      }catch(e){log("  ✗ NETWORK ERROR: "+(e.message||e),"var(--red)");}

      // Test 3: read it back
      log("");
      log("Test 3: read the test key back");
      try{
        const res=await fetch(`${SUPA_URL}/rest/v1/lex_data?key=eq.${encodeURIComponent(testKey)}&select=value`,{
          headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Accept":"application/json"}
        });
        const rows=await res.json();
        if(res.ok&&rows&&rows.length>0){log("  ✓ Round-trip success: "+JSON.stringify(rows[0].value).slice(0,80),"var(--green)");}
        else if(res.ok){log("  ✗ Write did not persist (table responded but returned no rows)","var(--red)");}
        else{log("  ✗ HTTP "+res.status,"var(--red)");}
      }catch(e){log("  ✗ NETWORK ERROR: "+(e.message||e),"var(--red)");}

      // Test 4: clean up
      log("");
      log("Test 4: cleanup test key");
      try{
        await fetch(`${SUPA_URL}/rest/v1/lex_data?key=eq.${encodeURIComponent(testKey)}`,{
          method:"DELETE",
          headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY}
        });
        log("  ✓ cleanup done","var(--text2)");
      }catch(e){log("  (cleanup failed, harmless): "+(e.message||e),"var(--text2)");}

      log("");
      log("=== Diagnostic complete ===","var(--text2)");
    }},"🩺 Run sync test"));
    healthCard.appendChild(actBtnRow);
    el.appendChild(healthCard);
  }

  // SQL
  const sql="create table if not exists lex_data (\n  key text primary key,\n  value jsonb not null,\n  updated_at timestamptz default now()\n);\nalter table lex_data enable row level security;\ncreate policy \"public read\" on lex_data for select using (true);\ncreate policy \"public write\" on lex_data for all using (true);";
  el.appendChild(h("div",{className:"card card-pad mb-16"},
    h("div",{style:{fontWeight:600,marginBottom:"6px"}},"SQL (run once in Supabase SQL Editor — already done? skip to credentials)"),
    h("pre",{style:{fontFamily:"var(--mono)",fontSize:"10px",background:"var(--surface2)",padding:"10px",borderRadius:"6px",lineHeight:"1.7",whiteSpace:"pre-wrap",color:"var(--text2)"}},sql),
    h("button",{className:"btn btn-ghost btn-sm",style:{marginTop:"6px"},onClick:()=>{navigator.clipboard.writeText(sql).then(()=>toast("SQL copied"));}},"Copy SQL")
  ));

  // Credentials
  const urlInp=h("input",{type:"text",placeholder:"https://xxxxxxxxxxxx.supabase.co",value:SUPA_URL,style:{width:"100%",marginBottom:"8px",fontFamily:"var(--mono)",fontSize:"11px"}});
  const keyInp=h("input",{type:"password",placeholder:"eyJhbGci... (anon public key)",value:SUPA_KEY,style:{width:"100%",marginBottom:"10px",fontFamily:"var(--mono)",fontSize:"11px"}});
  const credCard=h("div",{className:"card card-pad mb-16"},
    h("div",{style:{fontWeight:600,marginBottom:"10px"}},"Your credentials"),
    h("p",{style:{fontSize:"11px",color:"var(--text3)",marginBottom:"8px"}},"Supabase dashboard → Settings (cog) → API → copy Project URL and anon public key"),
    h("label",{className:"field-label"},"Project URL"),urlInp,
    h("label",{className:"field-label"},"Anon public key (first key shown, not service_role)"),keyInp
  );
  const btnRow=h("div",{className:"flex"});
  btnRow.appendChild(h("button",{className:"btn btn-primary",onClick:async()=>{
    const url=urlInp.value.trim(),key=keyInp.value.trim();
    if(!url||!key){toast("Enter both URL and key","err");return;}
    SUPA_URL=url;SUPA_KEY=key;
    localStorage.setItem("lex12-supa-url",url);localStorage.setItem("lex12-supa-key",key);
    initSupabase();
    if(supaConnected){toast("Connected! Now click Push to upload your data.");updateSyncBadge();render();}
    else toast("Connection failed — check your URL and key","err");
  }},"Connect"));
  if(supaConnected){
    btnRow.appendChild(h("button",{className:"btn btn-success",onClick:async()=>{
      // Safety check: compare local record counts against what's in Supabase
      toast("Checking Supabase before upload...");
      const remoteAllocRes=await supaGet("lex12-allocres");
      const remotePupils=await supaGet("lex12-pupils");
      const remoteAllocCount=Array.isArray(remoteAllocRes)?remoteAllocRes.length:0;
      const remotePupilCount=Array.isArray(remotePupils)?remotePupils.length:0;
      const localAllocCount=Array.isArray(allocRes)?allocRes.length:0;
      const localPupilCount=Array.isArray(pupils)?pupils.length:0;
      const warnings=[];
      if(remoteAllocCount>0&&localAllocCount===0)warnings.push("Supabase has "+remoteAllocCount+" allocation results but you have NONE locally — pushing will wipe them.");
      if(remotePupilCount>0&&localPupilCount===0)warnings.push("Supabase has "+remotePupilCount+" pupils but you have NONE locally — pushing will wipe them.");
      if(remoteAllocCount>localAllocCount*1.5&&localAllocCount>0)warnings.push("Supabase has "+remoteAllocCount+" allocation results but you only have "+localAllocCount+" locally — you may be overwriting a more complete dataset.");
      if(remotePupilCount>localPupilCount*1.2&&localPupilCount>0)warnings.push("Supabase has "+remotePupilCount+" pupils but you only have "+localPupilCount+" locally.");
      if(warnings.length>0){
        const msg="⚠️ PUSH WARNING:\n\n"+warnings.join("\n\n")+"\n\nPushing will overwrite Supabase with your local data.\n\nAre you sure you want to continue?";
        if(!confirm(msg))return;
      }
      toast("Uploading...");
      const ok=await migrateToSupabase();
      if(ok){toast("All data pushed to Supabase ✓");updateSyncBadge();render();}
      else toast("Upload failed — open browser console for details","err");
    }},"Push local data to Supabase"));
    btnRow.appendChild(h("button",{className:"btn btn-ghost",onClick:async()=>{
      // Safety check: warn if pulling would overwrite more local data than is in Supabase
      const remoteAllocRes=await supaGet("lex12-allocres");
      const remotePupils=await supaGet("lex12-pupils");
      const remoteAllocCount=Array.isArray(remoteAllocRes)?remoteAllocRes.length:0;
      const remotePupilCount=Array.isArray(remotePupils)?remotePupils.length:0;
      const localAllocCount=Array.isArray(allocRes)?allocRes.length:0;
      const localPupilCount=Array.isArray(pupils)?pupils.length:0;
      const warnings=[];
      if(localAllocCount>0&&remoteAllocCount===0)warnings.push("Supabase has NO allocation results but you have "+localAllocCount+" locally — pulling will wipe your local data.");
      if(localPupilCount>0&&remotePupilCount===0)warnings.push("Supabase has NO pupils but you have "+localPupilCount+" locally — pulling will wipe your local pupil list.");
      if(localAllocCount>remoteAllocCount*1.5&&remoteAllocCount>0)warnings.push("You have "+localAllocCount+" allocation results locally but Supabase only has "+remoteAllocCount+" — your local copy looks more complete.");
      let msg="Pull from Supabase? This overwrites your local copy.";
      if(warnings.length>0)msg="⚠️ PULL WARNING:\n\n"+warnings.join("\n\n")+"\n\nPulling will overwrite your local data with Supabase.\n\nAre you sure?";
      if(!confirm(msg))return;
      await loadFromSupabase();saveLocal();toast("Pulled from Supabase ✓");render();
    }},"Pull from Supabase"));
    btnRow.appendChild(h("button",{className:"btn btn-danger btn-sm",onClick:()=>{
      if(!confirm("Disconnect?"))return;
      SUPA_URL="";SUPA_KEY="";
      localStorage.removeItem("lex12-supa-url");localStorage.removeItem("lex12-supa-key");
      supaClient=null;supaConnected=false;syncStatus="local";
      toast("Disconnected");render();
    }},"Disconnect"));
  }
  credCard.appendChild(btnRow);
  el.appendChild(credCard);

  // ── Full-state JSON backup (v50) ──
  // Protects against simultaneous loss of Supabase + browser localStorage (e.g. during Supabase auto-pause
  // on a new device) by keeping a downloadable snapshot of every data table in one file.
  const backupCard=h("div",{className:"card card-pad mb-16",style:{background:"var(--surface2)",border:"1px solid var(--border2)"}});
  backupCard.appendChild(h("div",{style:{fontWeight:700,marginBottom:"6px"}},"💾 Full-state JSON backup"));
  backupCard.appendChild(h("p",{style:{fontSize:"12px",color:"var(--text2)",marginBottom:"10px",lineHeight:"1.7"}},"Downloads every LEX table into one JSON file: activities, staff, pupils, dates, allocations, overrides, form data, venues, consents, sub-groups, attendance, notepad, prior YTD, and activity log. Use this as an off-platform safety net in case Supabase auto-pauses and local browser storage also disappears. Restore overwrites all current data."));
  const backupBtnRow=h("div",{className:"flex",style:{gap:"8px",flexWrap:"wrap"}});
  backupBtnRow.appendChild(h("button",{className:"btn btn-primary btn-sm",onClick:()=>{
    const payload={
      _backupVersion:1,
      _createdAt:new Date().toISOString(),
      _appVersion:"v50",
      acts,staff,sa,pupils,dates,priorYTD,
      allocOverrides,allocDateOverrides,allocHistory,
      formData,allocRes,venues,consentMap,
      savedSubGroups,
      notepad:notepadText||"",
      attendance,
      activityLog:activityLog.slice(-500),
      snapshots:(typeof snapshots!=="undefined"&&snapshots)||[]
    };
    try{
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      const stamp=new Date().toISOString().slice(0,10); // YYYY-MM-DD
      a.href=url;a.download="LEX_full_backup_"+stamp+".json";
      document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
      logAction("BACKUP","Full-state JSON downloaded");
      // v78: stamp the date for the topbar nag indicator
      try{ localStorage.setItem("lex12-lastbackupdate", new Date().toISOString()); }catch(_){}
      toast("Backup downloaded ✓");
    }catch(e){console.error("Backup failed",e);toast("Backup failed — open browser console","err");}
  }},"⬇ Download full backup"));

  // Hidden file input + visible button that triggers it
  const restoreInp=h("input",{type:"file",accept:"application/json,.json",style:{display:"none"}});
  restoreInp.addEventListener("change",async e=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    try{
      const text=await file.text();

// Auto-refresh from Supabase every 30s for multi-admin sync
let _autoRefresh=null;
let _lastSaveTime=0;
let _lastUserActivity=0;     // v50: last saveAll timestamp — skip auto-refresh during active editing
let _autosnapDirty=false;    // v50: set by saveAll, cleared by autoSnapshot
let _autoSnapshots=[];       // v50: rolling ring of local state snapshots
let _onlineUsers={}; // {clientId: {clientId, name, ts, view}}
// Per-device identifier — ensures two users with the same _logUser ("Admin") don't overwrite each other
let _clientId=(()=>{
  let id=localStorage.getItem("lex12-clientid");
  if(!id){
    // Lightweight UUID-ish: time + random, no external dependency
    id="c"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10);
    localStorage.setItem("lex12-clientid",id);
  }
  return id;
})();
async function presenceHeartbeat(){
  if(!supaConnected||!supaClient)return;
  if(typeof document!=="undefined"&&document.hidden)return; // don't heartbeat when tab backgrounded
  try{
    const existing=await supaGet("lex12-presence")||{};
    existing[_clientId]={clientId:_clientId,name:_logUser||"Admin",ts:Date.now(),view:isStaffView()?"staff":"admin"};
    // Clean stale entries (>3 minutes old)
    const cutoff=Date.now()-180000;
    Object.keys(existing).forEach(k=>{if(!existing[k]||!existing[k].ts||existing[k].ts<cutoff)delete existing[k];});
    await supaSet("lex12-presence",existing);
    _onlineUsers=existing;
    updatePresenceBadge();
  }catch(e){console.error("Presence heartbeat:",e);}
}
// Remove ourselves from the presence map on page unload
async function presenceDepart(){
  if(!supaConnected||!supaClient)return;
  try{
    const existing=await supaGet("lex12-presence")||{};
    delete existing[_clientId];
    await supaSet("lex12-presence",existing);
  }catch(e){/* best effort */}
}
function updatePresenceBadge(){

// v56: Auto-refresh redesigned for connection-pool friendliness.
// Previously fired ~19 parallel requests every 10s → exhausted Supabase free-tier
// connection pool when 2+ tabs were open, causing PGRST003 cascade failures.
// Now: 15s interval, summary checks run sequentially (3 requests over ~600ms),
// exponential backoff on errors (15s → 30s → 60s → 120s cap), and a global
// throttle preventing overlapping cycles.
let _autoRefreshInterval=15000;       // current refresh interval (grows on errors)
const _autoRefreshBaseInterval=15000; // resets to this on success
const _autoRefreshMaxInterval=120000; // hard cap when backing off
let _autoRefreshConsecErrors=0;       // count of consecutive failures
let _refreshCycleInFlight=false;      // global lock preventing overlapping cycles

async function _runRefreshCycle(){
  if(_refreshCycleInFlight)return;
  if(!supaConnected||!supaClient)return;
  if(_supaWriteInFlight)return;
  if(_hasPendingSupaWrite)return; // v64: local changes not yet written — don't pull stale data
  if(Date.now()-_lastSaveTime<3000)return;
  // v64: refresh runs on every tab now (including admin) — but auto-rerender is conditional.

  _refreshCycleInFlight=true;
  _showSyncIndicator(true);
  try{
    presenceHeartbeat();
    _checkAppVersion(); // v80: lightweight cloud version check each cycle
    if(_autosnapDirty)autoSnapshot();
    drainPendingOvrDeletes(); // v66: keep retrying unconfirmed override deletes

    let attSum,ovrSum,ovOvSum,blobStamp;
    try{
      attSum=await tableSummary("lex_attendance");
      ovrSum=await tableSummary("lex_date_overrides");
      ovOvSum=await tableSummary("lex_overview"); // Wave 0
      blobStamp=await blobMaxUpdated();
    }catch(e){
      _autoRefreshConsecErrors++;
      _autoRefreshInterval=Math.min(_autoRefreshBaseInterval*Math.pow(2,_autoRefreshConsecErrors),_autoRefreshMaxInterval);
      syncStatus="error";updateSyncBadge();
      _restartAutoRefreshTimer();
      return;
    }

    const attUnchanged=_attLastSeen===null||(attSum
      &&attSum.count===_attLastSeen.count
      &&attSum.maxUpdated===_attLastSeen.maxUpdated);
    const ovrUnchanged=_ovrLastSeen===null||(ovrSum
      &&ovrSum.count===_ovrLastSeen.count
      &&ovrSum.maxUpdated===_ovrLastSeen.maxUpdated);
    // Wave 0: lex_overview is per-row, change-detected here — NOT via
    // blobMaxUpdated (which only watches lex_data, so overview edits never
    // trigger a blob reload; the §7 / v79.1 Fix A decoupling for overview).
    const ovOverviewUnchanged=_ovOverviewLastSeen===null||(ovOvSum
      &&ovOvSum.count===_ovOverviewLastSeen.count
      &&ovOvSum.maxUpdated===_ovOverviewLastSeen.maxUpdated);
    const blobUnchanged=_blobLastSeen===null||(blobStamp!==null
      &&blobStamp===_blobLastSeen);

    // v64: First-run priming — if seen-state is null, just record what we see and skip the banner.
    // Without this, every fresh page load triggers a phantom "data changed" alert because there
    // was no prior baseline to compare against.
    const isPriming=_attLastSeen===null||_ovrLastSeen===null||_ovOverviewLastSeen===null||_blobLastSeen===null;
    if(isPriming){
      if(attSum)_attLastSeen=attSum;
      if(ovrSum)_ovrLastSeen=ovrSum;
      if(ovOvSum)_ovOverviewLastSeen=ovOvSum; // Wave 0
      if(blobStamp!==null)_blobLastSeen=blobStamp;
    }

    // v64: Suppress banner if we wrote to Supabase in the last 5 seconds — the updated_at advance
    // is from our own save round-tripping back, not from another user.
    const recentLocalSave=(Date.now()-_lastSupaWriteTime)<90000; // v79.1 Fix C: 5s -> 90s (cloud echo lag)

    if(_autoRefreshConsecErrors>0){
      _autoRefreshConsecErrors=0;
      _autoRefreshInterval=_autoRefreshBaseInterval;
      _restartAutoRefreshTimer();
    }

    if(attUnchanged&&ovrUnchanged&&ovOverviewUnchanged&&blobUnchanged){
      lastSyncTime=new Date();syncStatus="online";updateSyncBadge();
      return;
    }

    // v79.1 Fix A: DECOUPLE per-row changes from blob reloads.
    // A register mark (attendance) or a pupil reassignment (override) advances
    // the per-row tables but does NOT change the admin blobs (acts/sa/pupils/...).
    // Previously ANY of these triggered a full loadFromSupabase(), which pulled
    // — and could clobber — in-memory blob state with a stale cloud copy written
    // by another device. Now: if ONLY the per-row tables changed, refresh just
    // those maps and leave the blobs untouched. Blobs are pulled only when the
    // blob stamp itself moved.
    if(blobUnchanged && (!attUnchanged || !ovrUnchanged || !ovOverviewUnchanged)){
      // Per-row-only change. Refresh attendance + override + overview maps in
      // place; leave the admin blobs untouched (Wave 0 extends v79.1 Fix A to
      // overview — an overview edit must not pull/clobber blob state).
      try{
        const [freshAtt,freshOvr,freshOv]=await Promise.all([attLoadAll(),dateOvrLoadAll(),ovOverviewLoadAll()]);
        if(freshAtt)attendance=freshAtt;
        if(freshOvr)allocDateOverrides=freshOvr;
        if(freshOv){
          // Preserve in-flight local overview edits, mirroring the touched-key merges.
          if(_touchedOverviewKeys.size>0){
            const merged={...freshOv};
            _touchedOverviewKeys.forEach(k=>{if(overviewData[k]!==undefined)merged[k]=overviewData[k];});
            overviewData=merged;
          } else {
            overviewData=freshOv;
          }
        }
        if(attSum)_attLastSeen=attSum;
        if(ovrSum)_ovrLastSeen=ovrSum;
        if(ovOvSum)_ovOverviewLastSeen=ovOvSum;
        saveLocal();
        if(syncStatus!=="error"){lastSyncTime=new Date();syncStatus="online";}
        updateSyncBadge();
        // Re-render only if on a register/attendance- or overview-facing view; otherwise silent.
        const onRegView=(currentTab==="alloc"&&(window._allocSub==="regs"||window._allocSub==="bydate"))||currentTab==="staff"||currentTab==="overview";
        // Wave 0: never rebuild the overview grid while a cell is being typed —
        // _doSilentRerender recreates every <input>, which would drop the focused
        // field and its in-progress keystrokes. If a grid input has focus, defer
        // the re-render; the cell's onBlur applies it once editing pauses.
        const _ovInputFocused=currentTab==="overview"&&document.activeElement&&typeof document.activeElement.closest==="function"&&!!document.activeElement.closest(".ovv");
        if(_ovInputFocused){ _ovDeferredRerender=true; }
        else if(onRegView && (Date.now()-_lastUserActivity)>3000){ _doSilentRerender(); }
      }catch(e){ console.warn("v79.1 per-row refresh failed",e); }
      return;
    }

    // v64: If we recently wrote our own data, the updated_at advance is from our save round-tripping.
    // Pull the fresh state (to update our seen-state) but don't show the banner.
    if(recentLocalSave){
      await loadFromSupabase();saveLocal();
      if(syncStatus!=="error"){lastSyncTime=new Date();syncStatus="online";}
      updateSyncBadge();
      return;
    }

    // Blob changed remotely. Full load (the per-key apply guard in
    // loadFromSupabase, v79.1 Fix B, protects locally-fresh keys).
    await loadFromSupabase();saveLocal();
    if(syncStatus!=="error"){lastSyncTime=new Date();syncStatus="online";}
    updateSyncBadge();

    // v64: Smart re-render policy:
    //   • Display-only views (notices, RA, pre-flight checks, alloc/regs|bydate|history)
    //     auto-rerender after 5+ seconds idle — user is just viewing
    //   • Editable views (admin settings, alloc/paste, alloc/run, alloc/results, calendars)
    //     show "🔔 Updated by another user — click to refresh" banner instead.
    //     This prevents in-progress edits, search filters, and dropdown selections from being wiped.
    const userIdleMs=Date.now()-_lastUserActivity;
    const onAlloc=currentTab==="alloc";
    const allocSub=window._allocSub||"results";
    const isDisplayOnly=
      currentTab==="notices"||
      currentTab==="ra"||
      currentTab==="checks"||
      (onAlloc&&(allocSub==="regs"||allocSub==="bydate"||allocSub==="history"));
    if(isDisplayOnly&&userIdleMs>5000){
      _doSilentRerender();
    }else{
      _showRemoteUpdateBanner();
    }
  }catch(e){
    console.error("Auto-refresh cycle error:",e);
    _autoRefreshConsecErrors++;
    _autoRefreshInterval=Math.min(_autoRefreshBaseInterval*Math.pow(2,_autoRefreshConsecErrors),_autoRefreshMaxInterval);
    syncStatus="error";updateSyncBadge();
    _restartAutoRefreshTimer();
  }finally{
    _refreshCycleInFlight=false;
    _showSyncIndicator(false);
  }
}

// v64: Subtle "🔄 Updating…" indicator next to sync badge during a refresh cycle
function _showSyncIndicator(on){
  const el=document.getElementById("sync-indicator");
  if(!el)return;
  el.style.display=on?"inline-flex":"none";
}

// Re-render the current tab without losing scroll
function _doSilentRerender(){
  const m=document.querySelector(".main");
  if(!m)return;
  const sy=window.scrollY;
  const tw=m.querySelector(".table-wrap,.scroll-table");
  const tsy=tw?tw.scrollTop:0;
  const tsx=tw?tw.scrollLeft:0;
  // T6: preserve the focused activity input (e.g. Req'd) + caret across the silent rerender
  let _fAct=null,_fSelS=null,_fSelE=null;
  const _ae=document.activeElement;
  if(_ae&&_ae.getAttribute&&m.contains(_ae)){_fAct=_ae.getAttribute("data-act");if(_fAct){try{_fSelS=_ae.selectionStart;_fSelE=_ae.selectionEnd;}catch(_){}}}
  m.innerHTML="";
  if(currentTab==="staff")renderStaffCal(m);
  else if(currentTab==="act")renderActCal(m);
  else if(currentTab==="venues")renderVenues(m);
  else if(currentTab==="alloc")renderAlloc(m);
  else if(currentTab==="ra")renderRA(m);
  else if(currentTab==="notices")renderNotices(m);
  else if(currentTab==="notepad")renderNotepad(m);
  else if(currentTab==="checks")renderChecks(m);
  else if(currentTab==="admin")renderAdmin(m);
  requestAnimationFrame(()=>{
    window.scrollTo(0,sy);
    const tw2=m.querySelector(".table-wrap,.scroll-table");
    if(tw2){tw2.scrollTop=tsy;tw2.scrollLeft=tsx;}
    if(_fAct){try{const node=m.querySelector('[data-act="'+CSS.escape(_fAct)+'"]');if(node){node.focus({preventScroll:true});if(_fSelS!=null&&(node.tagName==="INPUT"||node.tagName==="TEXTAREA")){try{node.setSelectionRange(_fSelS,_fSelE);}catch(_){}}}}catch(_){}}
  });
  // Remove the banner if it's showing — data is now applied
  const b=document.getElementById("remote-update-banner");if(b)b.remove();
}

// Show the dismissable "remote changes ready" banner — user clicks to apply
function _showRemoteUpdateBanner(){
  if(document.getElementById("remote-update-banner"))return; // already showing
  const b=h("div",{id:"remote-update-banner",style:{
    position:"fixed",top:"60px",right:"16px",zIndex:9998,
    background:"var(--accent)",color:"white",padding:"8px 14px",
    borderRadius:"var(--radius-sm)",boxShadow:"0 4px 12px rgba(0,0,0,0.18)",
    fontSize:"12px",fontWeight:600,cursor:"pointer",
    display:"flex",alignItems:"center",gap:"8px"
  },
  onClick:()=>{_doSilentRerender();}
  },"🔔 Data updated by another user — click to refresh",
    h("span",{style:{opacity:.8,fontWeight:400,fontSize:"14px",marginLeft:"4px",padding:"0 4px"},onClick:e=>{
      e.stopPropagation();
      const el=document.getElementById("remote-update-banner");if(el)el.remove();
    }},"✕")
  );
  document.body.appendChild(b);
}

function _restartAutoRefreshTimer(){
  if(_autoRefresh)clearInterval(_autoRefresh);
  _autoRefresh=setInterval(_runRefreshCycle,_autoRefreshInterval);
}

function startAutoRefresh(){
  if(_autoRefresh)clearInterval(_autoRefresh);
  presenceHeartbeat(); // initial heartbeat
  _autoRefreshConsecErrors=0;
  _autoRefreshInterval=_autoRefreshBaseInterval;
  _restartAutoRefreshTimer();
}

// ── v50: Rolling local autosnapshots (independent of Supabase) ──
// Every ~3 minutes of editing, capture a snapshot of allocation-critical state to localStorage.
// Survives auto-refresh overwrites, Supabase outages, and sync errors. Kept at 20 slots = ~1 hour history.
function autoSnapshot(){
  try{
    // v52d: snapshot now excludes attendance and allocDateOverrides — these live in per-row
    // Supabase tables (lex_attendance, lex_date_overrides) which are inherently clobber-safe.
    // Keeping them in snapshots was costing ~80% of the snapshot size with no recovery benefit.
    // v79.2: snapshot only the small, edit-heavy, hard-to-recover state. The
    // large fields (allocRes ~105KB, pupils ~41KB, formData ~33KB) are
    // recoverable from cloud and the manual JSON backups, and were filling
    // localStorage to the point of QuotaExceededError. Dropping them cuts
    // ~95% of snapshot size. Ring reduced 20 -> 6 slots.
    const snap={
      ts:new Date().toISOString(),
      acts:JSON.parse(JSON.stringify(acts)),
      sa:JSON.parse(JSON.stringify(sa)),
      allocOverrides:JSON.parse(JSON.stringify(allocOverrides)),
      consentMap:JSON.parse(JSON.stringify(consentMap||{})),
      dates:JSON.parse(JSON.stringify(dates||[])),
      overview:JSON.parse(JSON.stringify(overviewData||{}))
    };
    _autoSnapshots.unshift(snap);
    if(_autoSnapshots.length>6)_autoSnapshots=_autoSnapshots.slice(0,6);
    try{
      localStorage.setItem("lex12-autosnaps",JSON.stringify(_autoSnapshots));
    }catch(qe){
      // Quota exceeded — drop the oldest half and retry once
      console.warn("autoSnapshot: localStorage quota hit, trimming older slots");
      _autoSnapshots=_autoSnapshots.slice(0,10);
      try{localStorage.setItem("lex12-autosnaps",JSON.stringify(_autoSnapshots));}catch(_){
        // Still failing — give up on this cycle but don't crash
        console.warn("autoSnapshot: localStorage still full after trim, skipping this cycle");
      }
    }
    _autosnapDirty=false;
  }catch(e){console.error("autoSnapshot failed",e);}
}
function loadAutoSnapshots(){
  try{const s=localStorage.getItem("lex12-autosnaps");if(s)_autoSnapshots=JSON.parse(s)||[];}
  catch(_){_autoSnapshots=[];}
}
// Also run an independent autosnapshot cadence regardless of Supabase state
let _autosnapTimer=setInterval(()=>{if(_autosnapDirty)autoSnapshot();},3*60*1000); // 3 min
// And one on unload as a last resort
window.addEventListener("beforeunload",()=>{if(_autosnapDirty)autoSnapshot();});
loadAutoSnapshots();
// Staff portal runs a lighter-weight heartbeat-only cycle (no admin data reload)
function startStaffPresence(){
  if(_autoRefresh)clearInterval(_autoRefresh);
  presenceHeartbeat();
  _autoRefresh=setInterval(()=>{
    if(!supaConnected||!supaClient)return;
    presenceHeartbeat();
  },30000);
}
// Depart the presence map on tab close / navigation
if(typeof window!=="undefined"){
  window.addEventListener("pagehide",()=>{_flushOnUnload();presenceDepart();});
  window.addEventListener("beforeunload",()=>{_flushOnUnload();presenceDepart();});
  // Resume heartbeat when tab becomes visible again
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden&&supaConnected&&supaClient)presenceHeartbeat();
  });
}
// Dispatch: public timetable and staff view need their own render path,
// which bypasses the admin render() that initData calls. For those modes
// we still want the immediate UI, so we hand off as soon as localStorage loads.
if(isPublicTimetable()||isStaffView()){
  // Synchronous local load + immediate render for non-admin paths
  loadPrefs();
  initSupabase();
  try{loadLocal();}catch(e){console.error("startup: localStorage load failed",e);}
  try{_loadPendingOvrDel();}catch(_){}
  try{
    if(isPublicTimetable())renderPublicTimetable();
    else {renderStaffView();startStaffPresence();}
  }catch(e){
    console.error("startup: initial render failed",e);
    const appEl=document.getElementById("app");
    if(appEl){appEl.innerHTML='<div style="padding:40px;font-family:sans-serif;color:#dc2626;"><h2>LEX failed to start</h2><p>'+String(e&&(e.message||e))+'</p></div>';}
  }
  // Background sync
  if(supaConnected){
    loadFromSupabase().then(()=>{
      try{
        if(isPublicTimetable())renderPublicTimetable();
        else renderStaffView();
      }catch(e){console.error("background re-render failed",e);}
    }).catch(e=>{console.error("background sync failed",e);});
  }
} else {
  // Admin path — initData() handles immediate render + background sync
  initData().then(()=>{
    startAutoRefresh();
  }).catch(e=>{
    console.error("LEX startup failed:",e&&(e.message||e));
    const appEl=document.getElementById("app");
    if(appEl&&appEl.innerHTML.length<200){
      appEl.innerHTML='<div style="padding:40px;font-family:sans-serif;color:#dc2626;"><h2>LEX failed to start</h2><p>'+String(e&&(e.message||e))+'</p><p>Open the browser console (F12) for details, then try reloading with Ctrl+Shift+R.</p></div>';
    }
  });
}
</script>

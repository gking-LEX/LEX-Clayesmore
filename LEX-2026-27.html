function initSupabase(){
  if(!SUPA_URL||!SUPA_KEY){supaClient=null;supaConnected=false;syncStatus="local";return;}
  // Direct REST API — no Supabase JS library, eliminates DataCloneError permanently
  supaClient={url:SUPA_URL,key:SUPA_KEY};
  supaConnected=true;syncStatus="online";
}
async function supaGet(key){
  if(!supaClient)return null;
  try{
    const url=`${supaClient.url}/rest/v1/lex_data?key=eq.${encodeURIComponent(key)}&select=value&limit=1`;
    const res=await fetch(url,{headers:{
      "apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key,"Accept":"application/json"
    }});
    if(!res.ok){console.error("supaGet",key,"HTTP",res.status);return null;}
    const rows=await res.json();
    if(!rows||!rows.length)return null;
    const v=rows[0].value;
    if(typeof v==="string"){try{return JSON.parse(v);}catch{return v;}}
    return v;
  }catch(e){console.error("supaGet",key,e.message||e);return null;}
}
async function supaSet(key,value){
  if(!supaClient)return false;
  try{
    const res=await fetch(`${supaClient.url}/rest/v1/lex_data`,{
      method:"POST",
      headers:{"apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key,
        "Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
      body:JSON.stringify({key,value:JSON.stringify(value),updated_at:new Date().toISOString()})
    });
    if(!res.ok){const t=await res.text();console.error("supaSet",key,"HTTP",res.status,t);return false;}
    return true;
  }catch(e){console.error("supaSet",key,e.message||e);return false;}
}

// ── v52: per-row attendance and date-override storage ─────────────────────
// These functions talk to the new lex_attendance and lex_date_overrides tables.
// Each attendance mark and each per-date override is its own row, so concurrent
// writers can never overwrite each other.

// v72 (A2): per-row tables are now year-namespaced via a `pfx` column. The
// pfx is THIS file's prefix (lex11 / lex12 / ...), detected from PREF_KEY so
// the value self-propagates to future year-files without code changes. Every
// read filters by pfx; every write includes pfx. This closes the residual
// contamination vector where two systems on the same Supabase project would
// share per-row rows (which had no year discriminator before v72).
const PFX=(function(){const m=/lex(\d+)-prefs/.exec(PREF_KEY||"");return m?"lex"+m[1]:"lex11";})();

// Write or update one attendance mark. Returns true on success.
async function attUpsert(di,act,email,sess,code){
  if(!supaClient)return false;
  try{
    const res=await fetch(`${supaClient.url}/rest/v1/lex_attendance`,{
      method:"POST",
      headers:{"apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key,
        "Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
      body:JSON.stringify({di:di,act:act,email:email,sess:sess,code:code||"",pfx:PFX,updated_at:new Date().toISOString()})
    });
    if(!res.ok){const t=await res.text();console.error("attUpsert HTTP",res.status,t);return false;}
    _lastSupaWriteTime=Date.now(); // v64: own-write banner suppression
    return true;
  }catch(e){console.error("attUpsert error",e.message||e);return false;}
}

// Pull every attendance row from the cloud and rebuild the local `attendance` map.
// Returns the rebuilt map (also assigned to global `attendance`).
async function attLoadAll(){
  if(!supaClient)return null;
  try{
    // v52b: Supabase free tier caps SELECT responses at 1000 rows. Paginate using Range headers.
    // We fetch in batches of 1000, parsing the Content-Range header to know the total and when to stop.
    const map={};
    const PAGE=1000;
    let offset=0;
    let totalSeen=0;
    let safetyMax=50; // 50 pages * 1000 = 50,000 rows — more than enough for any realistic term
    while(safetyMax-->0){
      const res=await fetch(`${supaClient.url}/rest/v1/lex_attendance?select=di,act,email,sess,code&pfx=eq.${PFX}&order=updated_at.asc`,{
        headers:{
          "apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key,"Accept":"application/json",
          "Range-Unit":"items",
          "Range":offset+"-"+(offset+PAGE-1),
          "Prefer":"count=exact"
        }
      });
      if(!res.ok&&res.status!==206){console.error("attLoadAll HTTP",res.status);return null;}
      const rows=await res.json();
      if(!Array.isArray(rows)||rows.length===0)break;
      rows.forEach(r=>{
        const k=r.di+"|"+r.act+"|"+r.email;
        if(!map[k])map[k]={a:"",b:""};
        map[k][r.sess]=r.code||"";
      });
      totalSeen+=rows.length;
      // Content-Range looks like "0-999/1475". Parse the total.
      const cr=res.headers.get("content-range")||"";
      const totalMatch=cr.match(/\/(\d+)$/);
      const total=totalMatch?parseInt(totalMatch[1],10):null;
      // Stop when we've seen all rows, or when this page returned fewer than PAGE (last page).
      if(rows.length<PAGE)break;
      if(total!==null&&totalSeen>=total)break;
      offset+=PAGE;
    }
    console.log("[attLoadAll] loaded",totalSeen,"rows");
    return map;
  }catch(e){console.error("attLoadAll error",e.message||e);return null;}
}

// Write or update one per-date override. Pass activity="" to delete.
async function dateOvrUpsert(di,email,activity){
  if(!supaClient)return false;
  try{
    if(!activity){
      // Delete the row when activity is empty
      const res=await fetch(`${supaClient.url}/rest/v1/lex_date_overrides?di=eq.${di}&email=eq.${encodeURIComponent(email)}&pfx=eq.${PFX}`,{
        method:"DELETE",
        headers:{"apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key}
      });
      if(!res.ok){console.error("dateOvrDelete HTTP",res.status);return false;}
      _lastSupaWriteTime=Date.now(); // v64
      return true;
    }
    const res=await fetch(`${supaClient.url}/rest/v1/lex_date_overrides`,{
      method:"POST",
      headers:{"apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key,
        "Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
      body:JSON.stringify({di:di,email:email,activity:activity,pfx:PFX,updated_at:new Date().toISOString()})
    });
    if(!res.ok){const t=await res.text();console.error("dateOvrUpsert HTTP",res.status,t);return false;}
    _lastSupaWriteTime=Date.now(); // v64
    // v66: a confirmed WRITE supersedes any queued delete for the same key —
    // single chokepoint so no caller can leave a stale delete that would later
    // wipe a freshly-written override (the re-assign-after-failed-clear race).
    if(typeof _pendingOvrDel!=="undefined"){
      const _k=di+"|"+normEmail(email);
      if(_pendingOvrDel[_k]){delete _pendingOvrDel[_k];_savePendingOvrDel();}
    }
    return true;
  }catch(e){console.error("dateOvrUpsert error",e.message||e);return false;}
}

// Pull every override row from the cloud and rebuild the local `allocDateOverrides` map.
async function dateOvrLoadAll(){
  if(!supaClient)return null;
  try{
    // v52b: paginate (Supabase free tier caps responses at 1000 rows).
    const map={};
    const PAGE=1000;
    let offset=0;
    let totalSeen=0;
    let safetyMax=50;
    while(safetyMax-->0){
      const res=await fetch(`${supaClient.url}/rest/v1/lex_date_overrides?select=di,email,activity&pfx=eq.${PFX}&order=updated_at.asc`,{
        headers:{
          "apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key,"Accept":"application/json",
          "Range-Unit":"items",
          "Range":offset+"-"+(offset+PAGE-1),
          "Prefer":"count=exact"
        }
      });
      if(!res.ok&&res.status!==206){console.error("dateOvrLoadAll HTTP",res.status);return null;}
      const rows=await res.json();
      if(!Array.isArray(rows)||rows.length===0)break;
      rows.forEach(r=>{map[r.di+"|"+r.email]=r.activity;});
      totalSeen+=rows.length;
      const cr=res.headers.get("content-range")||"";
      const totalMatch=cr.match(/\/(\d+)$/);
      const total=totalMatch?parseInt(totalMatch[1],10):null;
      if(rows.length<PAGE)break;
      if(total!==null&&totalSeen>=total)break;
      offset+=PAGE;
    }
    console.log("[dateOvrLoadAll] loaded",totalSeen,"rows");
    return map;
  }catch(e){console.error("dateOvrLoadAll error",e.message||e);return null;}
}

// ── Wave 0 (Phase 1): per-row overview storage ────────────────────────────
// The year-overview grid was a single blob (lex12-overview): one row per date
// holding the cell object {y9a,y9b,...,dofe}. Two admins editing different
// dates both held the whole blob — last save wins. lex_overview makes each
// DATE its own row (PK = pfx + datekey), so different-date edits never collide.
// Mirrors the v52 lex_attendance / lex_date_overrides design line-for-line:
// pfx column, merge-duplicates upsert, paginated reads, updated_at, soft-delete.

// Write or update one overview row (the whole cell-object for a date).
// An empty/blank cell-object soft-deletes the row (deleted=true).
async function ovOverviewUpsert(datekey,data){
  if(!supaClient)return false;
  try{
    const isEmpty=!data||typeof data!=="object"||Object.keys(data).length===0;
    const res=await fetch(`${supaClient.url}/rest/v1/lex_overview`,{
      method:"POST",
      headers:{"apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key,
        "Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
      body:JSON.stringify({pfx:PFX,datekey:datekey,data:isEmpty?{}:data,deleted:isEmpty,updated_at:new Date().toISOString()})
    });
    if(!res.ok){const t=await res.text();console.error("ovOverviewUpsert HTTP",res.status,t);return false;}
    _lastSupaWriteTime=Date.now(); // v64: own-write banner suppression
    return true;
  }catch(e){console.error("ovOverviewUpsert error",e.message||e);return false;}
}

// Pull every overview row from the cloud and rebuild a {datekey: cells} map.
// Soft-deleted rows are filtered out server-side. Returns the map, or null on error.
async function ovOverviewLoadAll(){
  if(!supaClient)return null;
  try{
    // Paginate (mirrors attLoadAll — harmless on Pro, protects free-tier lex12).
    const map={};
    const PAGE=1000;
    let offset=0;
    let totalSeen=0;
    let safetyMax=50;
    while(safetyMax-->0){
      const res=await fetch(`${supaClient.url}/rest/v1/lex_overview?select=datekey,data&pfx=eq.${PFX}&deleted=is.false&order=updated_at.asc`,{
        headers:{
          "apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key,"Accept":"application/json",
          "Range-Unit":"items",
          "Range":offset+"-"+(offset+PAGE-1),
          "Prefer":"count=exact"
        }
      });
      if(!res.ok&&res.status!==206){console.error("ovOverviewLoadAll HTTP",res.status);return null;}
      const rows=await res.json();
      if(!Array.isArray(rows)||rows.length===0)break;
      rows.forEach(r=>{if(r.datekey)map[r.datekey]=(r.data&&typeof r.data==="object")?r.data:{};});
      totalSeen+=rows.length;
      const cr=res.headers.get("content-range")||"";
      const totalMatch=cr.match(/\/(\d+)$/);
      const total=totalMatch?parseInt(totalMatch[1],10):null;
      if(rows.length<PAGE)break;
      if(total!==null&&totalSeen>=total)break;
      offset+=PAGE;
    }
    console.log("[ovOverviewLoadAll] loaded",totalSeen,"rows");
    return map;
  }catch(e){console.error("ovOverviewLoadAll error",e.message||e);return null;}
}

// v52c: lightweight "has anything changed?" check for a per-row table.
// Returns {count, maxUpdated} or null on error. Costs ~one tiny network round-trip,
// far cheaper than pulling 1000+ rows. Used by auto-refresh to skip redundant pulls.
async function tableSummary(table){
  if(!supaClient)return null;
  try{
    // v72 (A2): every per-row table is filtered by pfx so the summary reflects
    // ONLY this year's rows. Without this, the count would jump every time
    // another year wrote a row and trigger a spurious "data changed" pull.
    // We use two parallel calls because PostgREST's count + order&limit=1 in one
    // request is awkward; two simple calls are cleaner and still <100ms total.
    const countPromise=fetch(`${supaClient.url}/rest/v1/${table}?pfx=eq.${PFX}&select=di`,{
      headers:{
        "apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key,"Accept":"application/json",
        "Range-Unit":"items","Range":"0-0","Prefer":"count=exact"
      }
    });
    const latestPromise=fetch(`${supaClient.url}/rest/v1/${table}?pfx=eq.${PFX}&select=updated_at&order=updated_at.desc&limit=1`,{
      headers:{"apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key,"Accept":"application/json"}
    });
    const [countRes,latestRes]=await Promise.all([countPromise,latestPromise]);
    if(!countRes.ok&&countRes.status!==206)return null;
    if(!latestRes.ok)return null;
    const cr=countRes.headers.get("content-range")||"";
    const m=cr.match(/\/(\d+)$/);
    const count=m?parseInt(m[1],10):0;
    const latestRows=await latestRes.json();
    const maxUpdated=Array.isArray(latestRows)&&latestRows.length>0?(latestRows[0].updated_at||""):"";
    return {count,maxUpdated};
  }catch(e){
    console.error("tableSummary "+table+" error",e.message||e);
    return null;
  }
}

// v52d: similar lightweight check for the admin blob keys (acts, dates, allocres, etc).
// Returns the most-recent updated_at across all lex_data rows. If this hasn't moved since
// our last successful load, no admin has edited anything — we can skip the blob load.
async function blobMaxUpdated(){
  if(!supaClient)return null;
  try{
    // v52e: exclude lex12-presence — that row is written by every tab's 10s heartbeat,
    // so including it makes blobMaxUpdated advance every cycle and triggers full loads
    // even when nothing has actually changed. Filtering it out fixes the "no skip ever" bug.
    const res=await fetch(`${supaClient.url}/rest/v1/lex_data?key=not.in.(lex12-presence,lex12-appversion)&select=updated_at&order=updated_at.desc&limit=1`,{
      headers:{"apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key,"Accept":"application/json"}
    });
    if(!res.ok)return null;
    const rows=await res.json();
    return Array.isArray(rows)&&rows.length>0?(rows[0].updated_at||""):"";
  }catch(e){
    console.error("blobMaxUpdated error",e.message||e);
    return null;
  }
}

// v52c: state remembered between auto-refresh cycles so we know when to skip a full pull.
// Initialised by the first successful loadFromSupabase, refreshed after each successful pull.
let _attLastSeen=null;     // {count, maxUpdated} for lex_attendance
let _ovrLastSeen=null;     // {count, maxUpdated} for lex_date_overrides
let _ovOverviewLastSeen=null; // Wave 0: {count, maxUpdated} for lex_overview (per-row)
let _blobLastSeen=null;    // v52d: max updated_at across all lex_data rows


// One-time migration: copy attendance + per-date overrides from the old shared blocks
// (lex12-attendance, lex12-allocdateoverrides) into the new per-row tables.
// Marked complete by writing lex12-migration-v52 = true. Every device checks this
// marker on startup; only the first device runs the migration.
async function migrateToPerRowTables(){
  if(!supaClient)return false;
  // Strict fetch helper — throws on network error or non-OK status, so we can
  // distinguish "Supabase says key doesn't exist" (returns null) from "Supabase unreachable".
  async function strictGet(key){
    const url=`${supaClient.url}/rest/v1/lex_data?key=eq.${encodeURIComponent(key)}&select=value&limit=1`;
    const res=await fetch(url,{headers:{
      "apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key,"Accept":"application/json"
    }});
    if(!res.ok)throw new Error("HTTP "+res.status+" reading "+key);
    const rows=await res.json();
    if(!rows||!rows.length)return null;
    const v=rows[0].value;
    if(typeof v==="string"){try{return JSON.parse(v);}catch{return v;}}
    return v;
  }
  async function strictSet(key,value){
    const res=await fetch(`${supaClient.url}/rest/v1/lex_data`,{
      method:"POST",
      headers:{"apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key,
        "Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
      body:JSON.stringify({key,value:JSON.stringify(value),updated_at:new Date().toISOString()})
    });
    if(!res.ok){const t=await res.text();throw new Error("HTTP "+res.status+" writing "+key+": "+t);}
    return true;
  }
  try{
    // Step 1: check marker. If migration already done, exit immediately.
    const marker=await strictGet("lex12-migration-v52");
    if(marker===true){console.log("[v52 migration] already complete, skipping");return true;}
    console.log("[v52 migration] starting one-time migration to per-row tables…");
    // Step 2: read old attendance. A null result here means "key doesn't exist" — that's OK,
    // it just means there's no attendance to migrate (fresh install). A throw means Supabase failed.
    const oldAtt=await strictGet("lex12-attendance");
    if(oldAtt&&typeof oldAtt==="object"){
      const rowsToInsert=[];
      Object.entries(oldAtt).forEach(([key,val])=>{
        const parts=key.split("|");
        if(parts.length<3)return;
        const di=parseInt(parts[0],10);
        const act=parts[1];
        const email=parts.slice(2).join("|");
        if(isNaN(di)||!act||!email)return;
        if(typeof val==="string"){
          if(val)rowsToInsert.push({di,act,email,sess:"a",code:val,pfx:PFX,updated_at:new Date().toISOString()});
        } else if(val&&typeof val==="object"){
          if(val.a)rowsToInsert.push({di,act,email,sess:"a",code:val.a,pfx:PFX,updated_at:new Date().toISOString()});
          if(val.b)rowsToInsert.push({di,act,email,sess:"b",code:val.b,pfx:PFX,updated_at:new Date().toISOString()});
        }
      });
      console.log("[v52 migration] preparing "+rowsToInsert.length+" attendance rows");
      // Insert in chunks of 500 — any single chunk failure aborts the whole migration
      for(let i=0;i<rowsToInsert.length;i+=500){
        const chunk=rowsToInsert.slice(i,i+500);
        const res=await fetch(`${supaClient.url}/rest/v1/lex_attendance`,{
          method:"POST",
          headers:{"apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key,
            "Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
          body:JSON.stringify(chunk)
        });
        if(!res.ok){
          const t=await res.text();
          throw new Error("attendance chunk "+i+" failed: HTTP "+res.status+" "+t);
        }
      }
      console.log("[v52 migration] attendance migrated ✓ ("+rowsToInsert.length+" rows)");
    } else {
      console.log("[v52 migration] no attendance data to migrate");
    }
    // Step 3: same for per-date overrides
    const oldOvr=await strictGet("lex12-allocdateoverrides");
    if(oldOvr&&typeof oldOvr==="object"){
      const rowsToInsert=[];
      Object.entries(oldOvr).forEach(([key,val])=>{
        const parts=key.split("|");
        if(parts.length<2)return;
        const di=parseInt(parts[0],10);
        const email=parts.slice(1).join("|");
        if(isNaN(di)||!email||!val)return;
        rowsToInsert.push({di,email,activity:val,pfx:PFX,updated_at:new Date().toISOString()});
      });
      console.log("[v52 migration] preparing "+rowsToInsert.length+" override rows");
      for(let i=0;i<rowsToInsert.length;i+=500){
        const chunk=rowsToInsert.slice(i,i+500);
        const res=await fetch(`${supaClient.url}/rest/v1/lex_date_overrides`,{
          method:"POST",
          headers:{"apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key,
            "Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
          body:JSON.stringify(chunk)
        });
        if(!res.ok){
          const t=await res.text();
          throw new Error("override chunk "+i+" failed: HTTP "+res.status+" "+t);
        }
      }
      console.log("[v52 migration] overrides migrated ✓ ("+rowsToInsert.length+" rows)");
    } else {
      console.log("[v52 migration] no override data to migrate");
    }
    // Step 4: write marker — if THIS fails, throw, and the migration will retry next time.
    // Critical: marker is only set after ALL data has been successfully written above.
    await strictSet("lex12-migration-v52",true);
    console.log("[v52 migration] complete ✓");
    return true;
  }catch(e){
    console.error("[v52 migration] FAILED — will retry next load. Error:",e.message||e);
    return false;
  }
}

// Wave 0 (Phase 1) one-time seed: copy the overview blob into the per-row
// lex_overview table (design §4 step 2). Idempotent and reversible:
//   * guarded by localStorage flag lex12-migration-overview-v84 (the
//     {pfx}-migration-{key}-v84 convention) so it runs at most once per device;
//   * also guarded by the table being EMPTY for this pfx, so a second device
//     that finds rows already there just sets its flag and skips — no double
//     insert across devices (the cross-device guard the v52 marker gives
//     attendance, done here per the localStorage-flag design);
//   * upserts are merge-duplicates, so even a partial re-run is harmless;
//   * the blob is left UNTOUCHED — it is the frozen rollback anchor (§4 step 4 / §6).
// `blobOverview` is the just-fetched blob value, passed in by loadFromSupabase.
async function seedOverviewPerRow(blobOverview){
  if(!supaClient)return false;
  const FLAG="lex12-migration-overview-v84";
  try{
    if(localStorage.getItem(FLAG)==="true")return true; // already seeded on this device
    // Only the first device to reach an EMPTY table seeds it. A non-empty table
    // means another device already migrated — set our local flag and skip.
    const existing=await ovOverviewLoadAll();
    if(existing===null)return false; // table unreachable — retry next load
    if(Object.keys(existing).length>0){localStorage.setItem(FLAG,"true");console.log("[overview seed] table already populated — flag set, skipping");return true;}
    // Canonicalise date keys to padded DD/MM/YYYY (matches dates[].full and the
    // render-time _ovCanonKey, so a pre-v81 unpadded blob key still lands right).
    function _canon(full){
      const p=String(full||"").split("/").map(s=>parseInt(s,10));
      if(p.length<3||p.some(isNaN))return String(full||"");
      return String(p[0]).padStart(2,"0")+"/"+String(p[1]).padStart(2,"0")+"/"+p[2];
    }
    const rows=[];
    if(blobOverview&&typeof blobOverview==="object"){
      Object.keys(blobOverview).forEach(k=>{
        const cells=blobOverview[k];
        if(cells&&typeof cells==="object"&&Object.keys(cells).length>0){
          rows.push({pfx:PFX,datekey:_canon(k),data:cells,deleted:false,updated_at:new Date().toISOString()});
        }
      });
    }
    if(rows.length===0){localStorage.setItem(FLAG,"true");console.log("[overview seed] nothing to migrate — flag set");return true;}
    // Insert in chunks of 500 — any chunk failure aborts (flag stays unset, retries next load).
    for(let i=0;i<rows.length;i+=500){
      const chunk=rows.slice(i,i+500);
      const res=await fetch(`${supaClient.url}/rest/v1/lex_overview`,{
        method:"POST",
        headers:{"apikey":supaClient.key,"Authorization":"Bearer "+supaClient.key,
          "Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
        body:JSON.stringify(chunk)
      });
      if(!res.ok){const t=await res.text();console.error("[overview seed] chunk",i,"failed HTTP",res.status,t);return false;}
    }
    localStorage.setItem(FLAG,"true");
    _lastSupaWriteTime=Date.now(); // v64: suppress own-write banner for the seed round-trip
    console.log("[overview seed] migrated",rows.length,"rows ✓");
    return true;
  }catch(e){console.error("[overview seed] FAILED — will retry next load.",e.message||e);return false;}
}

async function loadFromSupabase(){
  // v52: ensure migration has run (one-time, no-op if already done)
  await migrateToPerRowTables();
  // Note: "attendance" and "allocdateoverrides" are NO LONGER loaded from lex_data —
  // they come from the new per-row tables instead. The blob keys remain as historical.

  // device would keep seeing the stale cloud copy).

async function migrateToSupabase(){

// v79.2: quota-safe local save. Each key is written independently so one
// oversized key can't abort the rest (the old version wrote acts first, so a
// quota blow there silently skipped everything after). QuotaExceeded is
// detected explicitly and surfaced loudly — a failed local save must never be
// silent, because if local AND cloud both fail, a tab close loses the change.
function _lsSet(key,val){
  try{ localStorage.setItem(key,val); return true; }
  catch(e){
    const quota = e && (e.name==="QuotaExceededError" || e.code===22 || /quota/i.test(String(e&&e.message)));
    if(quota){
      // Try to reclaim space by trimming the autosnapshot ring, then retry once.
      try{
        let snaps=JSON.parse(localStorage.getItem("lex12-autosnaps")||"[]");
        if(snaps.length>2){ snaps=snaps.slice(0,2); localStorage.setItem("lex12-autosnaps",JSON.stringify(snaps)); }
        localStorage.setItem(key,val);
        console.warn("[saveLocal] quota hit on "+key+" — reclaimed space by trimming snapshots, retry OK");
        return true;
      }catch(e2){
        console.error("[saveLocal] QUOTA EXCEEDED on "+key+" — local copy NOT saved. Change exists only in memory until it reaches the cloud.");
        _localSaveFailed=true;
        try{ if(typeof toast==="function") toast("\u26a0 Local storage full — your change is in memory only until it syncs. Don't close this tab.","err"); }catch(_){}
        return false;
      }
    }

// v64: On page close/refresh, flush any pending Supabase writes via fetch+keepalive.
// This is critical because the 100ms debounce timer is killed when the page unloads,
// meaning changes saved to localStorage but not yet to Supabase would be lost.
function _flushOnUnload(){
  if(!_hasPendingSupaWrite||!supaClient)return;

  const isFirstSync=Object.keys(_lastSyncedFingerprints).length===0;
  _ALL_KEYS.forEach(k=>{

    if(session==="A")return a.sessA===componentName;

// v80: self-updating version nudge. Compares this tab's CURRENT_VERSION against
// a cloud-stored "latest deployed version" and prompts a one-tap update when a
// newer version exists. Replaces the old (effectively dead) github.io-only,
// self-referential freshness check.
//
// Version strings look like "v79", "v79.2", "v80". Parse to a comparable number.
function _parseVer(v){
  if(!v||typeof v!=="string")return 0;
  const m=v.replace(/^v/i,"").split(".");
  const major=parseInt(m[0],10)||0;
  const minor=m.length>1?(parseInt(m[1],10)||0):0;
  return major*1000+minor; // v79 -> 79000, v79.2 -> 79002, v80 -> 80000
}
let _versionNudgeShown=false;

  try{updateSyncBadge();renderPrefPanel();}catch(e){console.error("initData: badge/pref failed",e&&(e.message||e));}

  // STAGE 2: sync with Supabase in the BACKGROUND (non-blocking).
  // When complete, the data is updated and the current view is re-rendered.
  // The user can interact with cached data during this window — any edits will sync after.
  if(supaConnected){
    syncStatus="connecting";updateSyncBadge();
    loadFromSupabase().then(()=>{
      if(syncStatus!=="error"){syncStatus="online";lastSyncTime=new Date();}
      updateSyncBadge();
      // Re-render to show fresh data, but only if user hasn't been actively editing
      const userIdleMs=Date.now()-_lastUserActivity;
      if(userIdleMs>2000){
        try{
          const m=document.querySelector(".main");
          if(m){
            const sy=window.scrollY;
            render(); // render() already empties #app — no manual pre-clear
            requestAnimationFrame(()=>window.scrollTo(0,sy));
          } else {
            render();
          }
        }catch(e){console.error("Background re-render failed",e&&(e.message||e));}
      }
    }).catch(e=>{
      console.error("Background Supabase sync failed:",e&&(e.message||e));
      syncStatus="error";updateSyncBadge();
      // App is still usable from localStorage data
    });
  }
}

// COMPUTED

// Returns {actName|half: count} correctly accounting for both engine results AND manual overrides
// This is the single source of truth for capacity display everywhere
// ── Shared allocation helpers ──
// What activity is a pupil effectively on for a specific date?
// Priority: per-date override > half-term override > engine result
// engMap is optional {ne|half → actName} pre-built from allocRes for performance
function getEffectiveAllocOnDate(ne,di,engMap){
  const d=dates[di];if(!d)return null;
  const half=d.half||"S1";
  // 1. Per-date override (highest priority)
  const pdo=allocDateOverrides[di+"|"+ne];
  if(pdo)return pdo==="__UNASSIGNED__"?null:pdo;
  // 2. Half-term override — admin has explicitly assigned this pupil
  const hto=(allocOverrides[half.toLowerCase()]||{})[ne];
  if(hto){
    if(hto==="__UNASSIGNED__")return null;
    // If the activity exists in the acts array, verify it actually runs on this date
    // Special allocs (Out of school, Supported Study, etc.) won't be in acts — trust those as-is
    const htAct=findActByName_exact(hto);
    if(htAct&&!htAct.di.includes(di))return null;
    return hto;
  }
  // 3. Engine result
  const eng=engMap?engMap[ne+"|"+half]:null;
  if(eng){
    const a=findActByName_exact(eng);
    return(a&&a.di.includes(di))?eng:null;
  }
  return null;
}
// Batch-precompute effective allocations for many pupils across all dates.
// Returns a Map keyed "ne|di" → actName (or undefined if unallocated).
// Use this in heavy renders (term summary, whole school, missing allocations,
// disbursement) instead of calling getEffectiveAllocOnDate in a tight inner loop.
function buildAllocCache(emails,diList){
  const engMap=buildEngMap();
  const cache=new Map();
  emails.forEach(ne=>{
    diList.forEach(di=>{
      const v=getEffectiveAllocOnDate(ne,di,engMap);
      cache.set(ne+"|"+di,v);
    });
  });
  cache._engMap=engMap; // expose for callers that still need it
  return cache;
}
// Build engine lookup map from allocRes: {ne|half → actName}
// v64: cached versions — rebuilt only when allocRes / overrides change (via invalidateCaches)
// v64: Removes a pupil's allocation traces from allocRes, half-overrides, per-date overrides, AND form data.
// v64: also removes formData (was missing — caused orphans to reappear after engine re-run)
//      and syncs date-override deletions to the per-row Supabase table so deletions don't return on refresh.
// Used by single-pupil delete, bulk delete, orphan cleanup, and unmatched-form cleanup.
function cleanupPupilAllocations(ne){
  if(!ne)return;
  if(allocRes)allocRes=allocRes.filter(r=>normEmail(r.email)!==ne);
  HALF_TERMS.map(h=>h.toLowerCase()).forEach(ht=>{if(allocOverrides[ht])delete allocOverrides[ht][ne];});
  const removedDateKeys=[];
  Object.keys(allocDateOverrides).forEach(k=>{
    const parts=k.split("|");
    if(parts.length>=2&&normEmail(parts[1])===ne){
      removedDateKeys.push(k);
      delete allocDateOverrides[k];
      _touchedOvrKeys.add(k);
    }
  });
  // v66: journal each delete, then attempt it. Confirmed deletes clear the
  // journal entry; failures stay queued and are retried on load/refresh so a
  // refresh mid-failure can no longer resurrect the orphan from the cloud.
  removedDateKeys.forEach(k=>{_queueOvrDelete(k);_confirmedOvrDelete(k);});
  if(formData)formData=formData.filter(f=>normEmail(f.email)!==ne);
}

function buildEngMap(){
  if(_engMapCache)return _engMapCache;
  const m={};
  if(allocRes)allocRes.filter(r=>r.alloc&&r.alloc!=="__UNASSIGNED__").forEach(r=>{
    m[normEmail(r.email)+"|"+r.half]=r.alloc;
  });
  _engMapCache=m;
  return m;
}
// Collect every email that might have an allocation (engine, half-override, date-override)
function getAllAllocEmails(){
  if(_allAllocEmailsCache)return _allAllocEmailsCache;
  const s=new Set();
  if(allocRes)allocRes.forEach(r=>s.add(normEmail(r.email)));
  HALF_TERMS.map(h=>h.toLowerCase()).forEach(ht=>Object.keys(allocOverrides[ht]||{}).forEach(e=>s.add(normEmail(e))));
  Object.keys(allocDateOverrides).forEach(k=>{const p=k.split("|");if(p[1])s.add(normEmail(p[1]));});
  _allAllocEmailsCache=s;
  return s;
}

// ── v50: Dates-first summary of a pupil's effective allocation across a half ──
// Returns {effActs: Map<actName,count>, totalDates, unassignedDates, sources: Set<"pd"|"ho"|"eng">}
// Uses the same priority as getEffectiveAllocOnDate (per-date > half-override > engine) but records
// WHICH source settled each date so callers can distinguish pure per-date overrides from engine runs.
function getPupilHalfInfo(ne,half,engMap){
  const halfDi=dates.map((_,i)=>i).filter(i=>(dates[i]?.half||"S1")===half);
  const effActs=new Map();let unassignedDates=0;const sources=new Set();
  const hoMap=(allocOverrides[half.toLowerCase()]||{});
  halfDi.forEach(di=>{
    let act=null,src=null;
    const pdo=allocDateOverrides[di+"|"+ne];
    if(pdo!==undefined){
      act=pdo==="__UNASSIGNED__"?null:pdo;
      src="pd";
    } else {
      const ho=hoMap[ne];
      if(ho){
        if(ho==="__UNASSIGNED__"){act=null;src="ho";}
        else{
          // Check activity runs on this date (special allocs without acts entry are trusted)
          const hoAct=findActByName_exact(ho);
          if(hoAct&&!hoAct.di.includes(di)){act=null;src=null;}
          else{act=ho;src="ho";}
        }
      } else if(engMap){
        const eng=engMap[ne+"|"+half];
        if(eng){
          const a=findActByName_exact(eng);
          if(a&&a.di.includes(di)){act=eng;src="eng";}
        }
      }
    }
    if(act){effActs.set(act,(effActs.get(act)||0)+1);sources.add(src);}
    else{unassignedDates++;}
  });
  return{effActs,totalDates:halfDi.length,unassignedDates,sources};
}
// Format a PupilHalfInfo for display in the Results & Overrides S1/S2 columns.
// Returns {text, detail, kind: "clean"|"pd"|"partial"|"mixed"|"unassigned"|"none"}
function formatPupilHalfDisplay(info,halfOvr){
  if(info.effActs.size===0){
    if(halfOvr==="__UNASSIGNED__")return{text:"Unassigned",detail:"Explicitly unassigned for this half",kind:"unassigned"};
    return{text:"\u2014",detail:"",kind:"none"};
  }
  const sorted=[...info.effActs.entries()].sort((a,b)=>b[1]-a[1]);
  const primary=sorted[0][0];
  const nPrimary=sorted[0][1];
  if(sorted.length===1){
    if(info.unassignedDates===0){
      // Every date in the half: same activity
      const pdOnly=info.sources.has("pd")&&!info.sources.has("ho")&&!info.sources.has("eng");
      return{text:primary,detail:pdOnly?"Allocated via per-date overrides on every date of this half":"",kind:pdOnly?"pd":"clean"};
    }
    return{text:primary+" ("+nPrimary+"/"+info.totalDates+")",detail:"Allocated on "+nPrimary+" of "+info.totalDates+" dates; "+info.unassignedDates+" date(s) unassigned",kind:"partial"};
  }
  const parts=sorted.map(([a,n])=>a+" \u00D7"+n).join(", ");
  const tail=info.unassignedDates?"; "+info.unassignedDates+" unassigned":"";
  return{text:primary+" + "+(sorted.length-1)+" more",detail:parts+tail,kind:"mixed"};
}
// Returns {actName|half: count} — unique pupils per activity per half-term
// A pupil counts toward EVERY activity they attend on any date in that half
function getAllocByActHalf(){
  const m={};
  const engMap=buildEngMap();
  const allNe=getAllAllocEmails();
  const halfSets={}; // actName|half → Set<ne>
  dates.forEach((d,di)=>{
    allNe.forEach(ne=>{
      const act=getEffectiveAllocOnDate(ne,di,engMap);
      if(!act)return;
      const hk=act+"|"+d.half;
      if(!halfSets[hk])halfSets[hk]=new Set();
      halfSets[hk].add(ne);
    });
  });
  Object.entries(halfSets).forEach(([k,s])=>{m[k]=s.size;});
  return m;
}
// Returns {actName|di: count} — pupils on each activity on each specific date
function getCountPerActDate(){
  const m={};
  const engMap=buildEngMap();
  const allNe=getAllAllocEmails();
  dates.forEach((d,di)=>{
    allNe.forEach(ne=>{
      const act=getEffectiveAllocOnDate(ne,di,engMap);
      if(!act)return;
      const k=act+"|"+di;
      m[k]=(m[k]||0)+1;
    });
  });
  return m;
}
// Returns array of {name,yg,house,ne} for pupils on an activity on a specific date
function getPupilsOnActDate(actName,di){

    result.push({name:((p.pref||p.forename||"")+" "+(p.surname||"")).trim()||ne,surname:p.surname||"",forename:p.forename||p.pref||"",yg:p.yg||"",house:p.house||"",ne});

// Returns array of {name,surname,forename,yg,house,ne} — unique pupils on an activity across a whole half
function getPupilsOnActHalf(actName,half){
  const engMap=buildEngMap();

  const halfDates=dates.map((_,i)=>i).filter(i=>(dates[i]?.half||"S1")===half);
  const seen=new Set();const result=[];

    });

// Get all consent-requiring activities a pupil is allocated to across all dates
function getConsentActivitiesForPupil(ne,engMap){
  const consentActs=new Set();
  dates.forEach((_,di)=>{
    const eff=getEffectiveAllocOnDate(ne,di,engMap);
    if(eff){const act=findActByName_exact(eff);if(act&&act.consentReq)consentActs.add(eff);}
  });
  return[...consentActs].sort();
}
// Migrate old consentMap format {s1:bool,s2:bool} → per-activity {actName:bool}
function migrateConsentMap(){
  // v69: one-shot. Never re-run within a session, and bail immediately if
  // nothing is in a legacy shape — a modern per-activity map must never be
  // walked by this function again (that is what caused the v64-era loss).
  if(_consentMigrationDone)return;
  if(!allocRes||!allocRes.length)return;
  const _hasLegacy=Object.keys(consentMap).some(ne=>{
    const c=consentMap[ne];
    return c===true||(c&&typeof c==="object"&&(c.hasOwnProperty("s1")||c.hasOwnProperty("s2"))&&!Object.keys(c).some(k=>k!=="s1"&&k!=="s2"));
  });
  if(!_hasLegacy){_consentMigrationDone=true;return;}
  const engMap=buildEngMap();
  let migrated=false;
  Object.keys(consentMap).forEach(ne=>{
    const cm=consentMap[ne];
    if(cm===null||cm===undefined)return;
    // Detect old format: has s1/s2 keys but no activity-name keys
    if(typeof cm==="object"&&(cm.hasOwnProperty("s1")||cm.hasOwnProperty("s2"))&&!Object.keys(cm).some(k=>k!=="s1"&&k!=="s2")){
      // v69: NON-DESTRUCTIVE. Preserve any already-present per-activity keys
      // and only ADD derived ones. The old code built a fresh object and
      // replaced cm wholesale, dropping ticks for any activity the current
      // allocation snapshot no longer happened to include.
      const newCm={};
      Object.keys(cm).forEach(k=>{if(k!=="s1"&&k!=="s2")newCm[k]=cm[k];});
      const consentActs=getConsentActivitiesForPupil(ne,engMap);
      consentActs.forEach(actName=>{
        const act=findActByName_exact(actName);if(!act)return;
        const actDi=act.di||[];
        const runsInS1=actDi.some(di=>dates[di]&&dates[di].half==="S1");
        const runsInS2=actDi.some(di=>dates[di]&&dates[di].half==="S2");
        if(runsInS1&&cm.s1)newCm[actName]=true;
        else if(runsInS2&&cm.s2)newCm[actName]=true;
      });
      // Only count as migrated if we actually changed something.
      if(JSON.stringify(newCm)!==JSON.stringify((function(){var o={};Object.keys(cm).forEach(k=>{if(k!=="s1"&&k!=="s2")o[k]=cm[k];});return o;})())){
        consentMap[ne]=newCm;migrated=true;
      } else if(cm.hasOwnProperty("s1")||cm.hasOwnProperty("s2")){
        // strip the dead s1/s2 scaffolding but keep all real keys
        consentMap[ne]=newCm;migrated=true;
      }
    }
    else if(cm===true){
      // v69: legacy bare-true → expand to per-activity, additive only.
      const newCm={};
      getConsentActivitiesForPupil(ne,engMap).forEach(a=>{newCm[a]=true;});
      consentMap[ne]=newCm;
      migrated=true;
    }
  });
  _consentMigrationDone=true; // v69: never run again this session
  if(migrated){saveAll();console.log("ConsentMap migrated to per-activity format (v69 non-destructive)");}
}

// ── Attendance helpers (v47 — per-session A/B) ──
// Read attendance for a key, normalising old string format → {a,b}
function getAtt(key){
  const v=attendance[key];
  if(!v)return{a:"",b:""};
  if(typeof v==="string")return{a:v,b:v}; // migrate: old single value → both sessions
  return{a:v.a||"",b:v.b||""};
}
// v52: _touchedAttKeys tracks marks that are in-flight or recently completed.
// A key stays in this set from setAtt() call until the upsert completes successfully.
// loadFromSupabase preserves these keys' local values on overwrite, so a load happening
// during the brief window between local update and cloud confirmation can't undo the mark.
let _touchedAttKeys=new Set();
// v69: same in-flight protection for consent. consentMap had NONE — a cloud
// pull landing between a local tick and its push reverted the tick and then
// re-pushed the stale map (the concurrent-two-admin consent-loss amplifier).
// Keys are normalised pupil emails (consentMap is keyed by ne).
let _touchedConsentKeys=new Set();
// v70: same in-flight protection for date-card edits (note, half-term).
// Without this, a concurrent cloud pull mid-edit reverts d.note / d.half
// via the wholesale `dates = blobRes[4]` in loadFromSupabase. Keys are
// the numeric index into the dates[] array, stringified.
let _touchedDateIdxs=new Set();
// v69: migrateConsentMap must run AT MOST ONCE per session, and never on a
// system already in the modern per-activity format. This flag retires it
// from the unconditional every-load path.
let _consentMigrationDone=false;
// Same protection for per-date overrides — keys are "di|email" matching allocDateOverrides shape.
let _touchedOvrKeys=new Set();
// Wave 0 (Phase 1): same in-flight protection for per-row overview edits. Keys
// are canonical datekeys (DD/MM/YYYY). A key stays in the set from the cell edit
// until ovOverviewUpsert confirms, so a load landing in that window can't revert it.
let _touchedOverviewKeys=new Set();
// Wave 0: set true when the per-row refresh wanted to re-render the overview
// grid but a cell had focus. The cell's onBlur applies the deferred re-render,
// so an auto-refresh can never rebuild the <input>s mid-keystroke.
let _ovDeferredRerender=false;
// v66: Persistent pending-delete journal. A per-row override delete that fails
// (HTTP error or network drop) used to be lost the moment the tab refreshed —
// _touchedOvrKeys is in-memory only — so dateOvrLoadAll() would read the stale
// row straight back (the v60 orphan class, network-failure variant). We now
// journal unconfirmed deletes to localStorage and drain the queue on load and
// on every refresh cycle until Supabase confirms each one.
const _PENDING_OVR_DEL_KEY="lex12-pending-ovr-del";
let _pendingOvrDel={}; // {"di|email": true} awaiting confirmed cloud delete
function _loadPendingOvrDel(){
  try{const s=localStorage.getItem(_PENDING_OVR_DEL_KEY);_pendingOvrDel=s?JSON.parse(s)||{}:{};}
  catch(_){_pendingOvrDel={};}
  // Re-arm in-memory protection for anything still queued from a prior session.
  Object.keys(_pendingOvrDel).forEach(k=>_touchedOvrKeys.add(k));
}
function _savePendingOvrDel(){
  try{localStorage.setItem(_PENDING_OVR_DEL_KEY,JSON.stringify(_pendingOvrDel));}catch(_){}
}
function _queueOvrDelete(k){
  _pendingOvrDel[k]=true;_touchedOvrKeys.add(k);_savePendingOvrDel();
}
// Attempt one confirmed cloud delete. Protection/journal entry is cleared
// ONLY when Supabase confirms (dateOvrUpsert returns true). On failure the
// entry stays queued for the next drain.
function _confirmedOvrDelete(k){
  const parts=k.split("|");
  const di=parseInt(parts[0],10);
  const em=parts.slice(1).join("|");
  if(isNaN(di)||!em||typeof dateOvrUpsert!=="function"){return Promise.resolve(false);}
  return dateOvrUpsert(di,em,"").then(ok=>{
    if(ok){delete _pendingOvrDel[k];_touchedOvrKeys.delete(k);_savePendingOvrDel();}
    return ok;
  }).catch(()=>false);
}
// Drain the journal. Safe to call repeatedly; no-op when empty or offline.
let _ovrDrainInFlight=false;
async function drainPendingOvrDeletes(){
  if(_ovrDrainInFlight||!supaClient)return;
  const keys=Object.keys(_pendingOvrDel);
  if(keys.length===0)return;
  _ovrDrainInFlight=true;
  try{for(const k of keys){await _confirmedOvrDelete(k);}}
  finally{_ovrDrainInFlight=false;}
}
// Set attendance for a specific session (or both). Handles offsite auto-copy.
// v52: writes the mark IMMEDIATELY to the per-row table — no debounce, no merge dance.
// Each call is one independent upsert; concurrent writers cannot collide.
function setAtt(key,session,val,actName){
  if(!attendance[key]||typeof attendance[key]==="string"){
    const old=attendance[key];
    attendance[key]={a:typeof old==="string"?old:"",b:typeof old==="string"?old:""};
  }
  attendance[key][session]=val;
  _touchedAttKeys.add(key);
  // Offsite auto-copy: if activity is offsite and session A is set, copy to B
  let alsoB=false;
  if(session==="a"&&actName){
    const act=findActByName_exact(actName);
    if(act&&act.offsite){attendance[key].b=val;alsoB=true;}
  }
  // Local persistence (in case of network failure — we still want it in localStorage)
  saveLocal();
  // Per-row cloud write — fire and forget, but log failures
  // Key shape is "di|act|email" — split it back out for the upsert.
  const parts=key.split("|");
  if(parts.length>=3){
    const di=parseInt(parts[0],10);
    const act=parts[1];
    const email=parts.slice(2).join("|");
    if(!isNaN(di)&&act&&email&&supaClient){
      attUpsert(di,act,email,session,val).then(ok=>{
        if(ok){
          _touchedAttKeys.delete(key);
          if(syncStatus==="error"){syncStatus="online";updateSyncBadge();}
        } else {
          syncStatus="error";updateSyncBadge();toast("Save failed — check connection","err");
        }
      });
      if(alsoB){
        attUpsert(di,act,email,"b",val).then(ok=>{if(!ok){syncStatus="error";updateSyncBadge();}});
      }
    } else {
      // No supabase — keep the touched marker so a later sync can use it
    }
  }
  _lastUserActivity=Date.now();
  _autosnapDirty=true;
}
// Check if an activity is offsite (Session A attendance auto-populates B)
function isOffsite(actName){
  const act=findActByName_exact(actName);
  return !!(act&&act.offsite);
}

function actsByDate(){
  const m={};dates.forEach((_,i)=>{m[i]=[];});
  acts.forEach(a=>a.di.forEach(di=>{if(m[di]&&!m[di].includes(a.n))m[di].push(a.n);}));
  Object.values(m).forEach(arr=>arr.sort());return m;
}
function getUnstaffed(){
  if(_unstaffedCache)return _unstaffedCache;
  const m={};acts.forEach(a=>a.di.forEach(di=>{
    const keys=saKeysForDate(di);
    if(isSplitAct(a)){
      // Split activity: check each component has staff
      const hasA=keys.some(k=>{const s=k.split("|")[2];return(s==="A"||!s)&&saGet(k)===a.sessA;});
      const hasB=keys.some(k=>{const s=k.split("|")[2];return(s==="B"||!s)&&saGet(k)===a.sessB;});
      if(!hasA||!hasB){if(!m[di])m[di]=[];m[di].push(a.n);}
    } else {
      const has=keys.some(k=>saGet(k)===a.n);
      if(!has){if(!m[di])m[di]=[];m[di].push(a.n);}
    }
  }));
  _unstaffedCache=m;

}
// Staff codes assigned to an activity or component on a given date (handles session-specific keys, deduped)
function getActStaffOnDate(actName,di){
  // Match by compound name OR by component name
  const act=findActByName_exact(actName);
  const names=new Set([actName]);
  if(act){names.add(act.sessA);names.add(act.sessB);}
  const codes=saKeysForDate(di).filter(k=>names.has(saGet(k))).map(k=>saCode(k));
  return[...new Set(codes)];
}
function getClashes(){
  if(_clashesCache)return _clashesCache;
  // Clash: staff member has base key AND session key on same date, or two base keys (impossible but defensive)
  const clashKeys=new Set();
  const byStaffDate={};
  Object.keys(sa).forEach(k=>{
    if(!saGet(k))return;
    const parts=k.split("|");const di=parts[0];const code=parts[1];
    const sdKey=di+"|"+code;
    if(!byStaffDate[sdKey])byStaffDate[sdKey]=[];
    byStaffDate[sdKey].push(k);
  });
  Object.entries(byStaffDate).forEach(([sdKey,keys])=>{
    if(keys.length<=1)return;
    const hasBase=keys.includes(sdKey);
    if(hasBase){keys.forEach(k=>clashKeys.add(k));}
  });
  _clashesCache=clashKeys;
  return clashKeys;
}

// Staff allocation tracker with activity weightings
// Weighting: A+B=full session (×wt), A only or B only=half session (×wt×0.5)
// Returns {code: {s1raw, s2raw, tdRaw, s1max, s2max, tdMax, s1frac, s2frac, tdfrac, priorYTD, grandTotal}}
function sessMultiplier(act){
  if(!act)return 1;
  return(act.sess==="A"||act.sess==="B")?0.5:1;
}
function getActWeight(act,staffCode,role){
  // role takes priority if provided; otherwise infer from act.lead
  if(!act)return 1;
  const isLead=role?role==="lead":(act.lead===staffCode||act.sessALead===staffCode||act.sessBLead===staffCode);
  if(isLead)return(act.wtLead!=null?act.wtLead:(act.wt||1));
  return(act.wtStaff!=null?act.wtStaff:(act.wt||1));
}
function getStaffAllocStats(){
  const s1Di=dates.map((_,i)=>i).filter(i=>dates[i].half==="S1");
  const s2Di=dates.map((_,i)=>i).filter(i=>dates[i].half==="S2");
  // max possible weighted points — use wtLead as the ceiling for normalisation
  const maxWt=Math.max(...acts.map(a=>Math.max(a.wtLead??a.wt??1,a.wtStaff??a.wt??1)),1);
  const s1max=s1Di.length*maxWt;
  const s2max=s2Di.length*maxWt;
  const tdMax=dates.length*maxWt;
  const NON_COUNTED_DESIGS=new Set(getAllDesignations().filter(d=>!d.counted).map(d=>d.n));
  const stats={};
  staff.forEach(s=>{
    function sumWt(diArr){
      return diArr.reduce((acc,di)=>{
        const sd=saGetDate(di,s.c);
        if(!sd)return acc;
        if(sd.split){
          // Session-specific entries: each half counts independently
          let tot=0;
          if(sd.a){
            let act=acts.find(x=>x.n===sd.a.act);
            if(!act)act=acts.find(x=>x.sessA===sd.a.act); // B1: look up by component
            if(act&&!NON_COUNTED_DESIGS.has(sd.a.act))tot+=getActWeight(act,s.c,sd.a.role)*0.5;
          }
          if(sd.b){
            let act=acts.find(x=>x.n===sd.b.act);
            if(!act)act=acts.find(x=>x.sessB===sd.b.act); // B1: look up by component
            if(act&&!NON_COUNTED_DESIGS.has(sd.b.act))tot+=getActWeight(act,s.c,sd.b.role)*0.5;
          }
          return acc+tot;
        }
        // Base key — original logic
        const actName=sd.a?sd.a.act:null;if(!actName)return acc;
        if(NON_COUNTED_DESIGS.has(actName))return acc;
        const act=findActByName_exact(actName);
        return acc+(getActWeight(act,s.c,sd.a.role)*sessMultiplier(act));
      },0);
    }
    function countDates(diArr){
      return diArr.filter(di=>{
        const sd=saGetDate(di,s.c);if(!sd)return false;
        if(sd.split){
          if(sd.a&&!NON_COUNTED_DESIGS.has(sd.a.act))return true;
          if(sd.b&&!NON_COUNTED_DESIGS.has(sd.b.act))return true;
          return false;
        }
        const an=sd.a?sd.a.act:null;return an&&!NON_COUNTED_DESIGS.has(an);
      }).length;
    }
    const s1raw=sumWt(s1Di);
    const s2raw=sumWt(s2Di);
    const tdRaw=sumWt(dates.map((_,i)=>i));
    const prior=priorYTD[s.c]||0;
    stats[s.c]={
      s1raw,s2raw,tdRaw,
      s1frac:s1max>0?s1raw/s1max:0,
      s2frac:s2max>0?s2raw/s2max:0,
      tdfrac:tdMax>0?tdRaw/tdMax:0,
      s1max,s2max,tdMax,
      priorYTD:prior,
      grandTotal:tdRaw+prior,
      // Simple date counts for display (excluding non-counted designations)
      s1n:countDates(s1Di),
      s2n:countDates(s2Di),
      alln:countDates(dates.map((_,i)=>i)),
    };
  });
  return stats;
}

  function _ovTdCell(){return{padding:editable?"2px":"6px 8px",borderRight:"1px solid var(--border)",borderBottom:"1px solid var(--border)",verticalAlign:"top",fontSize:"11px",lineHeight:"1.3",minWidth:"90px"};}
  function _ovInput(){return{width:"100%",fontSize:"11px",padding:"4px 6px",border:"1px solid transparent",background:"transparent",boxSizing:"border-box",fontFamily:"inherit",color:"inherit"};}
  // v81: robust date-key resolution. Overview cells are keyed by date.full.
  // Data written before the v77.1 date normalisation used unpadded strings
  // (e.g. "6/6/2026") while dates[].full is now zero-padded ("06/06/2026"),

  // Canonicalise to DD/MM/YYYY and resolve any stored key by parsed date.
  function _ovCanonKey(full){
    const p=String(full||"").split("/").map(s=>parseInt(s,10));
    if(p.length<3||p.some(isNaN))return String(full||"");
    return String(p[0]).padStart(2,"0")+"/"+String(p[1]).padStart(2,"0")+"/"+p[2];
  }
  const _ovResolved={};
  Object.keys(overviewData||{}).forEach(_ok=>{ _ovResolved[_ovCanonKey(_ok)]=overviewData[_ok]; });

  const rows=[];

    const list=byTerm[t];const anchor=_ovParseDate(list[0].full);
    list.forEach((d,i)=>{
      const wk=Math.round((_ovParseDate(d.full)-anchor)/(7*86400000))+1;
      rows.push({term:t,week:wk,date:d,firstInTerm:i===0,termRowSpan:list.length});

  }
  thead.appendChild(hr2);
  tbl.appendChild(thead);

  const tbody=h("tbody");
  let _ovPrevHalf=null;
  rows.forEach(r=>{
    const _ovHalfBnd=_ovPrevHalf!==null&&r.date.half!==_ovPrevHalf;
    const _ovHtBdr=_ovHalfBnd?{borderTop:"2px solid var(--text2)"}:{};
    const tr=h("tr");
    if(r.firstInTerm){
      tr.appendChild(h("td",{rowspan:String(r.termRowSpan),style:{..._ovTdTerm(),..._ovHtBdr}},r.term));
    }
    tr.appendChild(h("td",{style:{..._ovTdNum(),..._ovHtBdr}},String(r.week)));
    tr.appendChild(h("td",{style:{..._ovTdNum(),..._ovHtBdr}},r.date.label||r.date.full));
    const cols=["y9a","y9b","y10a","y10b","y11a","y11b","y12a","y12b","y13a","y13b","dofe"];
    const dKey=r.date.full;
    const _canon=_ovCanonKey(dKey);
    cols.forEach(k=>{

          onFocus:e=>{e.target.style.background="var(--surface2)";e.target.style.borderColor="var(--accent)";},
          // Wave 0: per-keystroke activity stamp so the auto-refresh 3s activity
          // guard actually reflects active typing (onChange only fires on blur).
          onInput:e=>{_lastUserActivity=Date.now();},
          onBlur:e=>{
            e.target.style.background="transparent";e.target.style.borderColor="transparent";
            // Wave 0: apply any refresh that was deferred while this cell was focused.
            if(_ovDeferredRerender){_ovDeferredRerender=false;setTimeout(()=>{try{_doSilentRerender();}catch(_){}},0);}
          },
          onChange:e=>{
            const v=e.target.value;
            // v81: write to canonical key, migrating any old-format duplicate.
            Object.keys(overviewData).forEach(_oldK=>{
              if(_oldK!==_canon && _ovCanonKey(_oldK)===_canon){
                if(!overviewData[_canon])overviewData[_canon]={...overviewData[_oldK]};

              }

            if(v){overviewData[_canon][k]=v;}else{delete overviewData[_canon][k];if(!Object.keys(overviewData[_canon]).length)delete overviewData[_canon];}
            if(!_ovResolved[_canon])_ovResolved[_canon]={};
            if(v){_ovResolved[_canon][k]=v;}else{delete _ovResolved[_canon][k];}
            // Wave 0 (Phase 1): overview is per-row now. Write THIS date's row
            // straight to lex_overview (the whole cell-object) instead of the
            // blob, so two admins editing different dates can't clobber each
            // other. An emptied row soft-deletes. Mirrors setAtt's per-row write.
            _touchedOverviewKeys.add(_canon);
            saveLocal();                 // local persistence baseline (blob frozen)
            _lastUserActivity=Date.now();
            _autosnapDirty=true;
            if(supaClient){
              ovOverviewUpsert(_canon,overviewData[_canon]).then(ok=>{

                }

            }
          }
        });
        td.appendChild(inp);

        if(cur)td.appendChild(document.createTextNode(cur));
      }
      tr.appendChild(td);
    });
    _ovPrevHalf=r.date.half;
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  tableWrap.appendChild(tbl);
  card.appendChild(tableWrap);

    bulkDatesDiv.appendChild(lbl);

  // Quick-select buttons

    qRow.appendChild(h("button",{className:"btn btn-ghost btn-xs",onClick:()=>{dateChecks.forEach(dc=>{dc.cb.checked=fn(dc);});}},lbl));
  });

  const bulkPreview=h("div",{style:{fontSize:"11px",color:"var(--text3)",marginTop:"6px"}});
  function updateBulkPreview(){
    const yg=bulkYgSel.value;
    if(yg){const count=pupils.filter(p=>(p.yg||"Unknown")===yg).length;bulkPreview.textContent=count+" pupils in "+yg;}
    else bulkPreview.textContent="";
  }
  bulkYgSel.addEventListener("change",updateBulkPreview);

  const bulkBtn=h("button",{className:"btn btn-primary",onClick:()=>{
    const yg=bulkYgSel.value,act=bulkActSel.value;
    if(!yg||!act){toast("Select year group and activity","err");return;}
    const selectedDates=dateChecks.filter(dc=>dc.cb.checked);
    if(!selectedDates.length){toast("Select at least one date","err");return;}
    const ygPupils=pupils.filter(p=>(p.yg||"Unknown")===yg&&p.email);
    if(!ygPupils.length){toast("No pupils with emails in "+yg,"err");return;}
    // v52: build the list of (di, email) writes, do the local update for instant UI,
    // then push each row to lex_date_overrides. Failures are surfaced.
    const writes=[];
    ygPupils.forEach(p=>{
      const em=normEmail(p.email);if(!em)return;
      selectedDates.forEach(({di})=>{
        const k=di+"|"+em;
        allocDateOverrides[k]=act;
        _touchedOvrKeys.add(k);
        writes.push({di,email:em,key:k});
      });
    });
    saveLocal();
    _lastUserActivity=Date.now();_autosnapDirty=true;
    logAction("OVERRIDE_DATE","Bulk: "+yg+" × "+selectedDates.length+" dates → "+act+" ("+writes.length+" overrides)");
    toast("Saving "+writes.length+" overrides to cloud…");
    // Fire all upserts in parallel — Supabase REST handles concurrent writes fine
    Promise.all(writes.map(w=>dateOvrUpsert(w.di,w.email,act).then(ok=>{if(ok)_touchedOvrKeys.delete(w.key);return ok;}))).then(results=>{
      const failed=results.filter(r=>!r).length;
      if(failed===0){
        toast(ygPupils.length+" pupils × "+selectedDates.length+" dates → "+act+" ✓ ("+writes.length+" saved)");
        if(syncStatus==="error"){syncStatus="online";updateSyncBadge();}
      } else {
        toast(failed+" of "+writes.length+" overrides failed — check connection","err");
        syncStatus="error";updateSyncBadge();
      }
      const main=document.querySelector(".main");if(main){main.innerHTML="";renderAlloc(main);}
    });
  }},"Assign");

  const bulkRow=h("div",{className:"flex",style:{gap:"8px",flexWrap:"wrap",alignItems:"center"}});
  bulkRow.appendChild(bulkYgSel);bulkRow.appendChild(bulkActSel);
  bulkCard.appendChild(bulkRow);
  bulkCard.appendChild(qRow);bulkCard.appendChild(bulkDatesDiv);
  bulkCard.appendChild(bulkBtn);bulkCard.appendChild(bulkPreview);
  el.appendChild(bulkCard);

  // ── Form Data Name Patcher ─────────────────────────────────────────────────
  el.appendChild(h("hr",{className:"section-divider"}));
  const patchCard=h("div",{className:"card card-pad mb-16"});
  patchCard.appendChild(h("div",{style:{fontWeight:700,fontSize:"13px",marginBottom:"4px"}},"🔧 Fix Activity Names in Form Data"));
  patchCard.appendChild(h("p",{style:{fontSize:"11px",color:"var(--text3)",marginBottom:"8px"}},"If pupils typed an activity name slightly differently (e.g. \"Pilates and Embroidery\" vs \"Pilates & Embroidery\"), use this to correct the choices before running allocation. Searches all choice columns (1st, 2nd, 3rd) in both halves."));
  // Auto-detect mismatches
  const allChoiceValues=[];
  formData.forEach(f=>{["s1c1","s1c2","s1c3","s2c1","s2c2","s2c3"].forEach(k=>{if(f[k]&&f[k].trim())allChoiceValues.push(f[k].trim());});});
  const actNames=new Set(acts.map(a=>a.n));
  const unmatched=[...new Set(allChoiceValues.filter(v=>!actNames.has(v)))].sort();
  if(unmatched.length>0){
    const detect=h("div",{className:"alert alert-warn mb-8",style:{fontSize:"11px"}});
    detect.appendChild(h("strong",null,"Unrecognised names in form data: "));
    detect.appendChild(document.createTextNode(unmatched.join(", ")));
    patchCard.appendChild(detect);
  }
  const fromInp=h("input",{placeholder:"Search text (e.g. \"Pilates and Embroidery\")",style:{width:"260px"}});
  const toSel=h("select",{style:{width:"220px"}});
  toSel.appendChild(h("option",{value:""},"Replace with…"));
  [...acts].sort((a,b)=>a.n.localeCompare(b.n)).forEach(a=>toSel.appendChild(h("option",{value:a.n},a.n)));
  const patchBtn=h("button",{className:"btn btn-primary btn-sm",onClick:()=>{
    const from=fromInp.value.trim(),to=toSel.value;
    if(!from||!to){toast("Enter both search text and replacement","err");return;}
    let count=0;
    formData.forEach(f=>{
      ["s1c1","s1c2","s1c3","s2c1","s2c2","s2c3","c1","c2","c3"].forEach(k=>{
        if(f[k]&&f[k].trim().toLowerCase()===from.toLowerCase()){f[k]=to;count++;}
      });
    });
    saveAll();toast(count+" choices updated: \""+from+"\" → \""+to+"\"");
    const main=document.querySelector(".main");if(main){main.innerHTML="";renderAlloc(main);}
  }},"Patch Choices");
  patchCard.appendChild(h("div",{className:"flex",style:{gap:"8px",flexWrap:"wrap",marginTop:"6px"}},fromInp,toSel,patchBtn));
  el.appendChild(patchCard);

  // ── Bake-Off Sub-Group Splitter ────────────────────────────────────────────
  el.appendChild(h("hr",{className:"section-divider"}));
  const boCard=h("div",{className:"card card-pad mb-16"});
  boCard.appendChild(h("div",{style:{fontWeight:700,fontSize:"13px",marginBottom:"4px"}},"🎂 Activity Sub-Group Splitter"));
  boCard.appendChild(h("p",{style:{fontSize:"11px",color:"var(--text3)",marginBottom:"10px"}},"Split allocated pupils into named sub-groups by house. Generates separate lists for S1 and S2 — allocation may differ between halves. Planning/printing only — allocation data is not changed."));
  if(!allocRes||!allocRes.length){boCard.appendChild(h("div",{className:"alert alert-info",style:{fontSize:"11px"}},"Run allocation first."));el.appendChild(boCard);return;}

  const boActSel=h("select",{style:{width:"220px"}});
  boActSel.appendChild(h("option",{value:""},"Select parent activity…"));
  [...acts].sort((a,b)=>a.n.localeCompare(b.n)).forEach(a=>boActSel.appendChild(h("option",{value:a.n},a.n)));

  // Sub-group definitions: 3 configurable groups
  const boGroups=[
    {nameInp:h("input",{placeholder:"Sub-group name e.g. Bake-Off D",style:{width:"180px",fontSize:"11px"}}),houseSel:null},
    {nameInp:h("input",{placeholder:"Sub-group name e.g. Bake-Off K",style:{width:"180px",fontSize:"11px"}}),houseSel:null},
    {nameInp:h("input",{placeholder:"Sub-group name e.g. Bake-Off W",style:{width:"180px",fontSize:"11px"}}),houseSel:null},
  ];
  const houseOptions=["K","W","D","(all others)"];
  boGroups.forEach(g=>{
    const ms=h("select",{style:{width:"220px",fontSize:"11px"},multiple:true,size:4});
    houseOptions.forEach(ho=>{const o=h("option",{value:ho},ho==="(all others)"?"(all remaining)":ho+" house");ms.appendChild(o);});
    g.houseSel=ms;
  });

  const boResultDiv=h("div",{style:{marginTop:"12px"}});

  const boRunBtn=h("button",{className:"btn btn-primary btn-sm",onClick:()=>{
    boResultDiv.innerHTML="";
    const parentAct=boActSel.value;if(!parentAct){toast("Select parent activity","err");return;}

    // Build group config once
    const groups=boGroups.map(g=>({
      name:g.nameInp.value.trim()||"(unnamed group)",
      houses:[...g.houseSel.selectedOptions].map(o=>o.value),
      allOthers:[...g.houseSel.selectedOptions].map(o=>o.value).includes("(all others)")
    }));

    // Process each half separately
    const halves=["S1","S2"].filter(half=>allocRes.some(r=>r.alloc===parentAct&&r.half===half));
    if(!halves.length){toast("No pupils allocated to "+parentAct,"err");return;}

    // Check if S1 and S2 rosters differ
    const s1emails=new Set(allocRes.filter(r=>r.alloc===parentAct&&r.half==="S1").map(r=>normEmail(r.email)));
    const s2emails=new Set(allocRes.filter(r=>r.alloc===parentAct&&r.half==="S2").map(r=>normEmail(r.email)));
    const rostersDiffer=halves.length===2&&([...s1emails].some(e=>!s2emails.has(e))||[...s2emails].some(e=>!s1emails.has(e)));

    if(rostersDiffer){
      boResultDiv.appendChild(h("div",{className:"alert alert-amber mb-12",style:{background:"var(--amber-soft)",borderLeft:"3px solid var(--amber)",padding:"10px 14px",fontSize:"12px",color:"var(--amber)",borderRadius:"var(--radius-sm)"}},"⚠ S1 and S2 rosters differ for "+parentAct+" — sub-groups are shown separately for each half below."));
    }

    let allCopyText="";
    const savedData={s1:[],s2:[]}; // for saving to notepad

    halves.forEach(half=>{
      const halfLbl=halfLabel(half);
      const allocated=allocRes.filter(r=>r.alloc===parentAct&&r.half===half).map(r=>{
        const p=findPupilByEmail(r.email)||{};
        return{email:normEmail(r.email),name:((p.pref||p.forename||"")+" "+(p.surname||"")).trim()||r.email,surname:p.surname||"",forename:p.forename||p.pref||"",house:(p.house||"").toUpperCase(),yg:p.yg||""};
      }).sort(cmpPupilYgSurname);

      if(!allocated.length)return;

      // Half header
      const halfHdr=h("div",{style:{fontWeight:700,fontSize:"13px",color:halfColor(half),margin:"16px 0 8px",paddingBottom:"6px",borderBottom:"2px solid "+(halfColor(half))}},halfLbl+" — "+parentAct+" ("+allocated.length+" pupils)");
      boResultDiv.appendChild(halfHdr);

      // Split into groups
      const assigned=new Set();
      const filledGroups=groups.map(g=>({...g,pupils:[]}));
      filledGroups.forEach(g=>{if(!g.allOthers){g.pupils=allocated.filter(p=>g.houses.includes(p.house));g.pupils.forEach(p=>assigned.add(p.email));}});
      filledGroups.forEach(g=>{if(g.allOthers){g.pupils=allocated.filter(p=>!assigned.has(p.email));}});

      // Save to structure for notepad storage
      savedData[half.toLowerCase()]=filledGroups.filter(g=>g.pupils.length>0).map(g=>({name:g.name,houses:g.houses,pupils:g.pupils.map(p=>({email:p.email,name:p.name,house:p.house,yg:p.yg}))}));

      // Check for pupils not assigned to any group
      const allAssigned=new Set(filledGroups.flatMap(g=>g.pupils.map(p=>p.email)));
      const unassigned=allocated.filter(p=>!allAssigned.has(p.email));

      const groupRow=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:"12px",marginBottom:"12px"}});

      let halfText=halfLbl+" — "+parentAct+"\n";
      filledGroups.filter(g=>g.pupils.length>0).forEach(g=>{
        const col=gc(g.name);
        const card=h("div",{className:"card"});
        const ch=h("div",{className:"card-header flex-between",style:{borderLeft:"3px solid "+col}});
        ch.appendChild(h("span",{style:{fontWeight:700,color:col}},g.name+" ("+g.pupils.length+")"));
        ch.appendChild(h("button",{className:"btn btn-ghost btn-xs",onClick:()=>{
          const txt=g.name+" ("+halfLbl+")\n"+g.pupils.map((p,i)=>(i+1)+". "+p.name+" ("+p.house+", Yr "+displayYg(p.yg)+")").join("\n");
          navigator.clipboard.writeText(txt).then(()=>toast(g.name+" "+half+" copied"));
        }},"📋"));
        card.appendChild(ch);
        const list=h("div",{style:{padding:"8px 12px"}});
        g.pupils.forEach((p,i)=>{
          list.appendChild(h("div",{style:{padding:"3px 0",borderBottom:"1px solid var(--border)",fontSize:"12px",display:"flex",justifyContent:"space-between",alignItems:"center"}},
            h("span",{style:{fontWeight:500}},String(i+1)+". "+p.name),
            h("span",{style:{fontSize:"10px",color:"var(--text3)"}},p.house+" · Yr "+displayYg(p.yg))
          ));
        });
        card.appendChild(list);
        groupRow.appendChild(card);
        halfText+="\n"+g.name+":\n"+g.pupils.map((p,i)=>(i+1)+". "+p.name+" ("+p.house+")").join("\n")+"\n";
      });

      boResultDiv.appendChild(groupRow);

      if(unassigned.length>0){
        boResultDiv.appendChild(h("div",{className:"alert alert-warn",style:{fontSize:"11px",marginBottom:"8px"}},"⚠ "+unassigned.length+" pupils not assigned to any group (house not matched): "+unassigned.map(p=>p.name+" ("+p.house+")").join(", ")));
      }

      // Copy this half
      boResultDiv.appendChild(h("button",{className:"btn btn-ghost btn-sm mb-8",onClick:()=>navigator.clipboard.writeText(halfText).then(()=>toast(halfLbl+" sub-groups copied"))},"📋 Copy "+halfLbl+" sub-groups"));
      allCopyText+=halfText+"\n";
    });

    const btnRow=h("div",{className:"flex mt-8",style:{gap:"8px",flexWrap:"wrap"}});
    if(halves.length>1){
      btnRow.appendChild(h("button",{className:"btn btn-primary btn-sm",onClick:()=>navigator.clipboard.writeText(allCopyText).then(()=>toast("All sub-groups copied"))},"📋 Copy All (S1 + S2)"));
    }
    // Save to Notepad / Notices
    btnRow.appendChild(h("button",{className:"btn btn-success btn-sm",onClick:()=>{
      savedSubGroups[parentAct]=savedData;
      saveAll();
      toast("Sub-groups saved — visible in Notepad and Notices timetables");
    }},"💾 Save Sub-Groups to Notepad"));
    boResultDiv.appendChild(btnRow);
  }},"Generate Sub-Groups");

  const groupsGrid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:"12px",marginTop:"10px"}});
  boGroups.forEach((g,i)=>{
    const col=h("div",{className:"card card-pad"});
    col.appendChild(h("div",{style:{fontWeight:600,fontSize:"11px",marginBottom:"6px"}},"Group "+(i+1)));
    col.appendChild(h("div",{style:{marginBottom:"6px"}},g.nameInp));
    col.appendChild(h("label",{className:"field-label",style:{marginBottom:"2px"}},"Houses (Ctrl/Cmd+click multi-select):"));
    col.appendChild(g.houseSel);
    groupsGrid.appendChild(col);
  });

  boCard.appendChild(h("div",{className:"flex mb-8",style:{gap:"8px"}},boActSel,boRunBtn));
  boCard.appendChild(groupsGrid);
  boCard.appendChild(boResultDiv);
  el.appendChild(boCard);
}

function renderAllocHistory(el){
  el.appendChild(h("div",{className:"card card-pad mb-16"},
    h("label",{className:"field-label"},"Paste Previous Allocation History"),
    h("p",{style:{fontSize:"11px",color:"var(--text3)",marginBottom:"8px"}},"Format: Email, Activity, Half-Term (e.g. Autumn 1), Choice Index (0=1st, 1=2nd, 2=3rd). This feeds the fairness algorithm — pupils who previously received 2nd/3rd choices get priority for 1st choice."),
    (()=>{
      const ta=h("textarea",{rows:5,placeholder:"jsmith@clayesmore.com\tBake-Off\tAutumn 1\t0\nabrown@clayesmore.com\tCricket\tAutumn 1\t1",style:{marginBottom:"8px"}});
      const wrap=h("div",null,ta,h("div",{className:"flex"},
        h("button",{className:"btn btn-primary",onClick:()=>{
          const lines=ta.value.trim().split("\n").filter(l=>l.trim());
          const sep=lines[0]&&lines[0].includes("\t")?"\t":",";
          let count=0;
          lines.forEach(l=>{const c=l.split(sep).map(x=>x.trim());if(c.length>=3){allocHistory.push({email:(c[0]||"").toLowerCase(),activity:c[1]||"",halfTerm:c[2]||"",choiceIndex:parseInt(c[3])||0});count++;}});
          saveAll();toast(count+" history records added");
          const main=document.querySelector(".main");if(main){main.innerHTML="";renderAlloc(main);}
        }},"Add History"),
        h("button",{className:"btn btn-ghost",onClick:()=>{if(!confirm("Clear all allocation history?"))return;allocHistory=[];saveAll();
          const main=document.querySelector(".main");if(main){main.innerHTML="";renderAlloc(main);}
        }},"Clear All"),
        h("span",{style:{fontSize:"11px",color:"var(--text3)"}},allocHistory.length+" records loaded")
      ));
      return wrap;
    })()
  ));
  if(allocHistory.length>0){
    const card=h("div",{className:"card mb-16"});
    card.appendChild(h("div",{className:"card-header"},h("span",{className:"card-title"},"Loaded History ("+allocHistory.length+" records)")));
    const tw=h("div",{style:{maxHeight:"250px",overflow:"auto"}});
    const t=h("table",null);
    t.appendChild(h("thead",null,h("tr",null,...["Email","Activity","Half-Term","Choice"].map(x=>h("th",null,x)))));
    const tb=h("tbody",null);
    allocHistory.slice(0,50).forEach(r=>{
      tb.appendChild(h("tr",null,h("td",null,r.email),h("td",null,r.activity),h("td",null,r.halfTerm),
        h("td",null,h("span",{className:"badge "+(r.choiceIndex===0?"badge-green":"badge-amber")},r.choiceIndex===0?"1st":r.choiceIndex===1?"2nd":"3rd"))));
    });
    t.appendChild(tb);tw.appendChild(t);card.appendChild(tw);el.appendChild(card);
  }
}

function renderAllocOverrides(el){
  el.appendChild(h("div",{className:"alert alert-info mb-12"},"Overrides are applied instantly — allocation results update automatically in the background when form data is loaded."));

    // Show existing overrides
    Object.entries(overrides).forEach(([email,activity])=>{
      const pupil=findPupilByEmail(email);
      const name=pupil?(pupil.pref||pupil.forename||"")+" "+(pupil.surname||""):email;
      card.appendChild(h("div",{className:"flex",style:{padding:"4px 0",borderBottom:"1px solid var(--border)",gap:"8px"}},
        h("span",{style:{fontSize:"12px",fontWeight:500,minWidth:"200px"}},name),

    // Show from formData or pupils
    const allEmails=[...new Set([...formData.map(r=>r.email),...pupils.map(p=>p.email)].filter(Boolean))].sort();
    allEmails.forEach(em=>{
      const p=findPupilByEmail(em);
      const label=p?((p.pref||p.forename||"")+" "+(p.surname||"")+" — "+em):em;
      emailSel.appendChild(h("option",{value:em},label));
    });
    const actSel=h("select",{style:{width:"180px",fontSize:"11px"}});
    actSel.appendChild(h("option",{value:""},"Select activity…"));
    const halfDi=dates.map((_,i)=>i).filter(i=>dates[i].half===ht);
    const halfActs=acts.filter(a=>a.di.some(d=>halfDi.includes(d))).map(a=>a.n).sort();
    halfActs.forEach(n=>actSel.appendChild(h("option",{value:n},n)));
    // Special override options
    ["Out of school","Supported Study","Other (see notes)"].forEach(n=>actSel.appendChild(h("option",{value:n,style:"color:var(--text3)"},n)));
    addRow.appendChild(emailSel);addRow.appendChild(actSel);
    addRow.appendChild(h("button",{className:"btn btn-primary btn-sm",onClick:()=>{
      const em=emailSel.value,act=actSel.value;
      if(!em||!act){toast("Select both pupil and activity","err");return;}
      if(!allocOverrides[ht.toLowerCase()])allocOverrides[ht.toLowerCase()]={};
      allocOverrides[ht.toLowerCase()][em]=act;saveAll();toast("Override added");
      const main=document.querySelector(".main");if(main){main.innerHTML="";renderAlloc(main);}
    }},"Add Override"));
    card.appendChild(addRow);
    el.appendChild(card);
  });
}

function renderAllocRun(el){
  // Explanation of algorithm
  const explCard=h("div",{className:"card card-pad mb-16"});
  explCard.appendChild(h("div",{style:{fontWeight:600,fontSize:"13px",marginBottom:"8px"}},"Allocation Priority Rules"));
  const rules=h("div",{style:{background:"var(--surface2)",borderRadius:"6px",padding:"12px",fontSize:"12px",color:"var(--text2)",lineHeight:"1.8"}});

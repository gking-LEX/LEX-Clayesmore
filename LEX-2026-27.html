  function decodeJwt(jwt){
    try {
      const parts = jwt.split('.');
      if (parts.length !== 3) return null;
      const payload = parts[1].replace(/-/g,'+').replace(/_/g,'/');
      const padded = payload + '='.repeat((4 - payload.length % 4) % 4);
      const decoded = atob(padded);
      return JSON.parse(decodeURIComponent(escape(decoded)));
    } catch(e){ return null; }
  }

  function getValidSession(){
    try {
      const raw = sessionStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || !s.exp) return null;
      if (Date.now()/1000 >= s.exp) return null;
      if (s.hd !== ALLOWED_HD) return null;
      if (s.aud !== CLIENT_ID) return null;
      return s;
    } catch(e){ return null; }
  }

  const session = getValidSession();
  if (session) {
    window.__LEX_USER__ = { email: session.email, name: session.name, hd: session.hd };
    window.lexSignOut = function(){
      sessionStorage.removeItem(SESSION_KEY);
      try {
        if (window.google && google.accounts && google.accounts.id) {
          google.accounts.id.disableAutoSelect();
        }
      } catch(e){}
      window.location.reload();
    };
    return;
  }

  window.__LEX_HANDLE_CREDENTIAL__ = function(response){
    const claims = decodeJwt(response && response.credential);
    if (!claims) return showError('Invalid sign-in response.');
    if (claims.iss !== 'https://accounts.google.com' && claims.iss !== 'accounts.google.com') return showError('Invalid token issuer.');
    if (claims.aud !== CLIENT_ID) return showError('Token audience does not match.');
    if (claims.hd !== ALLOWED_HD) return showError('Please sign in with a clayesmore.com account.');
    if (!claims.email_verified) return showError('Your Google email is not verified.');
    if (!claims.exp || claims.exp <= Date.now()/1000) return showError('Token expired. Please try again.');

    // v76: fire-and-forget audit log write. keepalive: true ensures the POST
    // survives the imminent window.location.reload(). Silent on failure.
    try {
      fetch(AUDIT_SUPA_URL + '/rest/v1/lex_signins', {
        method: 'POST',
        keepalive: true,
        headers: {
          'Content-Type': 'application/json',
          'apikey': AUDIT_SUPA_KEY,
          'Authorization': 'Bearer ' + AUDIT_SUPA_KEY,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({
          email: claims.email,
          file: AUDIT_FILE_TAG,
          user_agent: (navigator.userAgent || '').slice(0, 500)
        })
      }).catch(function(){});
    } catch(e) {}

    sessionStorage.setItem(SESSION_KEY, JSON.stringify({
      email: claims.email,
      name: claims.name || claims.email,
      hd: claims.hd,
      aud: claims.aud,
      exp: claims.exp,
      iat: claims.iat
    }));
    window.location.reload();
  };

  function showError(msg){
    const el = document.getElementById('lex-gate-error');
    if (el) { el.textContent = msg; el.style.display = 'block'; }
    sessionStorage.removeItem(SESSION_KEY);
  }

  const gateHtml = '<!DOCTYPE html><html lang="en"><head>' +
'<meta charset="utf-8">' +
'<meta name="viewport" content="width=device-width,initial-scale=1">' +
'<title>LEX \u2014 Sign in</title>' +

'.lex-gate-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:2rem 2.5rem;max-width:22rem;width:100%;box-shadow:0 1px 3px rgba(0,0,0,.05);text-align:center}' +
'.lex-gate-logo{display:block;width:180px;height:auto;margin:0 auto 1rem}' +
'.lex-gate-sub{margin:0 0 1.5rem;color:#475569;font-size:.95rem;line-height:1.4}' +
'.lex-gate-btn-wrap{display:flex;justify-content:center;margin:1rem 0;min-height:44px}' +
'#lex-gate-error{display:none;margin:1rem 0 0;padding:.6rem .8rem;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;color:#991b1b;font-size:.875rem;text-align:left}' +
'.lex-gate-foot{margin:1.5rem 0 0;font-size:.75rem;color:#94a3b8;line-height:1.4}' +
'</style>' +
'</head><body>' +
'<div class="lex-gate-wrap"><div class="lex-gate-card">' +
'<img class="lex-gate-logo" src="' + LEX_LOGO_DATA_URI + '" alt="LEX">' +
'<p class="lex-gate-sub">Sign in with your Clayesmore Google account</p>' +
'<div id="g_id_onload" data-client_id="' + CLIENT_ID + '" data-context="signin" data-ux_mode="popup" data-callback="__LEX_HANDLE_CREDENTIAL__" data-auto_select="false" data-itp_support="true" data-hd="' + ALLOWED_HD + '"></div>' +
'<div class="lex-gate-btn-wrap"><div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left"></div></div>' +
'<p id="lex-gate-error"></p>' +
'<p class="lex-gate-foot">Restricted to clayesmore.com accounts.<br>If you can\'t sign in, contact IT.</p>' +
'</div></div>' +
'<script src="https://accounts.google.com/gsi/client" async defer><\/script>' +
'</body></html>';

  document.open();
  document.write(gateHtml);
  document.close();
})();

  --surface2:#222226;
  --surface3:#2a2a2f;
  --border:#333338;
  --border2:#44444a;
  --text:#e8e6e1;
  --text2:#a8a59e;
  --text3:#666460;
  --accent:#4f8ef7;
  --accent-soft:#1a2d4a;
  --green:#22c55e;
  --green-soft:#0f2a1a;
  --amber:#f59e0b;
  --amber-soft:#2a1f0a;
  --red:#f87171;
  --red-soft:#2a1010;
  --purple:#a78bfa;
  --purple-soft:#1e1530;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
  --shadow-md:0 4px 12px rgba(0,0,0,.4),0 2px 4px rgba(0,0,0,.2);
  --shadow-lg:0 12px 32px rgba(0,0,0,.5),0 4px 8px rgba(0,0,0,.3);
}
/* ── FONT FAMILIES ── */
body.font-dmsans{--font:'DM Sans',system-ui,sans-serif;}
body.font-inter{--font:'Inter',system-ui,sans-serif;}
body.font-serif{--font:'Source Serif 4',Georgia,serif;}
body.font-system{--font:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
/* ── FONT SIZE ── */
body.fsize-sm{font-size:11px;}
body.fsize-sm th,body.fsize-sm td{font-size:10px;}
body.fsize-sm .card-title{font-size:11px;}
body.fsize-sm .btn{font-size:10px;}
body.fsize-sm .badge{font-size:9px;}
body.fsize-sm .nav-btn{font-size:11px;}
body.fsize-sm .page-header h2{font-size:17px;}
body.fsize-md{font-size:13px;}
body.fsize-lg{font-size:15px;}
body.fsize-lg th,body.fsize-lg td{font-size:14px;}
body.fsize-lg .card-title{font-size:15px;}
body.fsize-lg .btn{font-size:13px;}
body.fsize-lg .badge{font-size:11px;}
body.fsize-lg .nav-btn{font-size:13px;}
body.fsize-lg .page-header h2{font-size:23px;}
body.fsize-lg input,body.fsize-lg select,body.fsize-lg textarea{font-size:14px;}
body.fsize-xl{font-size:17px;}
body.fsize-xl th,body.fsize-xl td{font-size:15px;}
body.fsize-xl .card-title{font-size:16px;}
body.fsize-xl .btn{font-size:14px;}
body.fsize-xl .badge{font-size:12px;}
body.fsize-xl .nav-btn{font-size:14px;}
body.fsize-xl .page-header h2{font-size:25px;}
body.fsize-xl input,body.fsize-xl select,body.fsize-xl textarea{font-size:15px;}
/* ── DENSITY ── */
body.density-compact .card-pad{padding:10px;}
body.density-compact .card-header{padding:8px 12px;}
body.density-compact th,body.density-compact td{padding:5px 7px;}
body.density-compact .stat-card{padding:8px 12px;}
body.density-compact .main{padding:12px;}
body.density-compact .stats-row{gap:8px;margin-bottom:12px;}
body.density-spacious .card-pad{padding:24px;}
body.density-spacious .card-header{padding:18px 24px;}
body.density-spacious th,body.density-spacious td{padding:11px 14px;}
body.density-spacious .stat-card{padding:20px 24px;}
body.density-spacious .stat-val{font-size:30px;}
body.density-spacious .main{padding:32px;}
body.density-spacious .stats-row{gap:16px;margin-bottom:24px;}
/* ── PREFERENCES PANEL ── */
.pref-overlay{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;}
.pref-overlay.open{opacity:1;pointer-events:all;}
.pref-panel{position:fixed;top:0;right:0;bottom:0;width:300px;z-index:901;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);overflow-y:auto;display:flex;flex-direction:column;}
.pref-panel.open{transform:translateX(0);}
.pref-panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1;}
.pref-section{padding:16px 20px;border-bottom:1px solid var(--border);}
.pref-section-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.pref-row{display:flex;gap:6px;flex-wrap:wrap;}
.pref-btn{padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:12px;font-family:var(--font);cursor:pointer;transition:all .15s;}
.pref-btn:hover{border-color:var(--accent);color:var(--text);}
.pref-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
.pref-preview{margin-top:10px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--border);font-size:12px;color:var(--text2);line-height:1.6;}
.theme-dark .sticky-l{background:var(--surface);}
.theme-dark tr:hover .sticky-l{background:var(--surface2);}
.theme-dark .sticky-lt{background:var(--surface2);}
.theme-dark th{background:var(--surface2);}
.theme-dark .topbar,.theme-dark .nav{background:var(--surface);}

/* Layout */
.shell{display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:0;height:52px;position:sticky;top:0;z-index:50;}
.logo-mark{width:28px;height:28px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;letter-spacing:-0.02em;flex-shrink:0;}
.logo-img{height:30px;width:auto;flex-shrink:0;}
.logo-text{font-weight:600;font-size:15px;letter-spacing:-0.02em;margin-left:10px;color:var(--text);}
.logo-text span{color:var(--text3);font-weight:400;}
.topbar-meta{margin-left:16px;font-size:11px;color:var(--text3);border-left:1px solid var(--border);padding-left:16px;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.term-badge{background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;}

/* Nav */
.nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:2px;overflow-x:auto;position:sticky;top:52px;z-index:49;}
.nav::-webkit-scrollbar{height:0;}
.nav-btn{padding:10px 14px;font-size:12px;font-weight:500;color:var(--text2);background:transparent;border:none;cursor:pointer;font-family:var(--font);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;display:flex;align-items:center;gap:6px;}
.nav-btn:hover{color:var(--text);}
.nav-btn.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.nav-icon{font-size:13px;opacity:.7;}

/* Main content */
.main{flex:1;padding:8px;max-width:100%;margin:0 auto;width:100%;transition:padding .2s;padding-bottom:240px;}
.page-header{margin-bottom:20px;}
.page-header h2{font-size:20px;font-weight:700;letter-spacing:-0.03em;color:var(--text);}
.page-header p{font-size:12px;color:var(--text3);margin-top:2px;}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:16px;}
.card-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:13px;font-weight:600;color:var(--text);}

/* Stats row */
.stats-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;flex:1;min-width:120px;box-shadow:var(--shadow);}
.stat-val{font-size:24px;font-weight:700;letter-spacing:-0.04em;color:var(--text);}
.stat-label{font-size:11px;color:var(--text3);margin-top:1px;font-weight:500;}
.stat-sub{font-size:10px;color:var(--text3);margin-top:4px;}

/* Tables */
.table-wrap{overflow:auto;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);width:100%;padding-bottom:180px;}
table{border-collapse:collapse;width:100%;font-size:12px;}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;color:var(--text);white-space:nowrap;}
th{background:var(--surface2);font-weight:600;font-size:11px;color:var(--text2);position:sticky;top:0;z-index:2;}
/* Tables outside scroll-table need larger offset to clear sticky topbar+nav */
.main>*:not(.scroll-table) table th{position:sticky;top:0;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface2);}
.sticky-l{position:sticky;left:0;z-index:1;background:var(--surface);}
.sticky-lt{position:sticky;left:0;top:0;z-index:3;background:var(--surface2);}
/* v86: compact admin Activities editor + sticky activity column */
.acts-compact th,.acts-compact td{padding:4px 6px;}
.acts-compact .sticky-l,.acts-compact .sticky-lt{box-shadow:2px 0 4px -2px rgba(0,0,0,.12);}
/* v86: calendar scroll containers fit the viewport so the horizontal scrollbar is reachable on open */
.cal-scroll{max-height:calc(100vh - 230px);}
tr:hover .sticky-l{background:var(--surface2);}

/* Form controls */
input,select,textarea{
  padding:6px 10px;background:var(--surface);color:var(--text);
  border:1px solid var(--border2);border-radius:var(--radius-sm);
  font-size:12px;font-family:var(--font);outline:none;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
textarea{resize:vertical;width:100%;}
label.field-label{font-size:11px;font-weight:500;color:var(--text2);display:block;margin-bottom:4px;}

/* Buttons */
.btn{padding:6px 14px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:var(--font);transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(37,99,235,.3);}
.btn-primary:hover{background:#1d4ed8;box-shadow:0 2px 6px rgba(37,99,235,.4);}
.btn-success{background:var(--green);color:#fff;}
.btn-success:hover{background:#15803d;}
.btn-danger{background:var(--red);color:#fff;}
.btn-danger:hover{background:#b91c1c;}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2);}
.btn-ghost:hover{background:var(--surface2);color:var(--text);}
.btn-sm{padding:4px 10px;font-size:11px;}
.btn-xs{padding:2px 7px;font-size:10px;border-radius:4px;}
.no-spinner::-webkit-outer-spin-button,.no-spinner::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.no-spinner{-moz-appearance:textfield;}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;}
.badge-blue{background:var(--accent-soft);color:var(--accent);}
.badge-green{background:var(--green-soft);color:var(--green);}
.badge-amber{background:#fef3c7;color:#d97706;}
.badge-teal{background:#ccfbf1;color:#0d9488;}
.badge-amber{background:var(--amber-soft);color:var(--amber);}
.badge-red{background:var(--red-soft);color:var(--red);}
.badge-purple{background:var(--purple-soft);color:var(--purple);}

/* Alerts */
.alert{padding:10px 14px;border-radius:var(--radius-sm);font-size:12px;margin-bottom:8px;border-left:3px solid;}
.alert-error{background:var(--red-soft);color:var(--red);border-color:var(--red);}
.alert-warn{background:var(--amber-soft);color:var(--amber);border-color:var(--amber);}
.alert-info{background:var(--surface2);color:var(--text2);border-color:var(--border2);}
.alert-success{background:var(--green-soft);color:var(--green);border-color:var(--green);}

/* Flex utils */
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.gap-4{gap:4px;}.gap-8{gap:8px;}.gap-16{gap:16px;}
.mb-4{margin-bottom:4px;}.mb-8{margin-bottom:8px;}.mb-12{margin-bottom:12px;}.mb-16{margin-bottom:16px;}.mb-20{margin-bottom:20px;}
.mt-8{margin-top:8px;}.mt-12{margin-top:12px;}.mt-16{margin-top:16px;}
.w-full{width:100%;}

/* Color dot */
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}

/* Alloc cell popup */
.cell-popup{position:fixed;z-index:500;
  background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);
  box-shadow:var(--shadow-lg);padding:4px;min-width:180px;max-height:260px;overflow-y:auto;}
.cell-popup-item{padding:7px 10px;font-size:12px;cursor:pointer;border-radius:6px;color:var(--text2);font-family:var(--font);transition:background .1s;}
.cell-popup-item:hover{background:var(--surface2);}
.cell-popup-item.active{font-weight:600;}
.cell-popup-none{color:var(--text3);font-style:italic;}

/* Progress bar */
.prog-bar{height:5px;background:var(--surface3);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width .3s;}

/* Grid layouts */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}

/* Section divider */
.section-divider{border:none;border-top:1px solid var(--border);margin:20px 0;}

/* Toast */
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;pointer-events:none;}
.toast-msg{background:var(--text);color:#fff;padding:10px 16px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;margin-top:8px;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;}
.toast-msg.show{opacity:1;transform:translateY(0);}

/* Scrollable constraint */
.scroll-table{overflow:auto;max-height:calc(100vh - 90px);}.fs-btn{display:none !important;}
@media print{.topbar,.nav,.btn,button{display:none!important;}.card{box-shadow:none!important;}body{background:#fff!important;}}

/* Mobile responsive */
@media(max-width:768px){
  .topbar{padding:0 12px;height:46px;gap:6px;}
  .logo-text{font-size:13px;margin-left:6px;}
  .topbar-meta{display:none;}
  .nav{padding:0 8px;gap:0;}
  .nav-btn{padding:8px 10px;font-size:11px;gap:4px;}
  .nav-icon{font-size:11px;}
  .main{padding:12px;}
  .stats-row{gap:8px;}
  .stat-card{padding:10px 12px;min-width:90px;}
  .stat-val{font-size:18px;}
  .grid-2,.grid-3{grid-template-columns:1fr;}
  .table-wrap,.scroll-table{font-size:11px;}
  th,td{padding:6px 7px;font-size:11px;}
  .flex{flex-wrap:wrap;}
  .card-pad{padding:12px;}
  input,select,textarea{font-size:13px;} /* prevent iOS zoom */
}
@media(max-width:480px){
  .topbar{height:42px;}
  .topbar-right .badge{display:none;}
  .topbar-right .term-badge{display:none;}
  .main{padding:8px;}
  .page-header h2{font-size:16px;}
}

/* Sync pulse */
.sync-pulse{animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.last-sync{font-size:10px;color:var(--text3);margin-left:4px;}
</style>

// Detect network-drive / UNC path — fires before anything else renders
(function(){
  var loc = window.location.href;
  var isUNC = loc.startsWith('file:////') || loc.indexOf('file://__') >= 0 || loc.indexOf('file://\\') >= 0;
  // Also catch file:// paths that go via \server\ (shown as file:////server or file://__server)
  var isNetworkPath = /^file:\/\/\/\/[^/]/.test(loc) || /^file:\/\/__/.test(loc);
  if (isUNC || isNetworkPath) {
    document.addEventListener('DOMContentLoaded', function(){
      var b = document.createElement('div');

        '<small style="opacity:.8">Path detected: ' + loc.slice(0,80) + '</small>';
      document.body.prepend(b);
    });
  }
})();
</script>

<script>
// Version freshness check — warns if browser is serving a cached old version
(function(){
  var CURRENT_VERSION = 'v83.1';
  var VERSION_KEY = 'lex-last-known-version';
  var LOAD_TIME_KEY = 'lex-last-load-time';
  var now = Date.now();
  var lastLoad = parseInt(localStorage.getItem(LOAD_TIME_KEY)||'0');
  var lastVersion = localStorage.getItem(VERSION_KEY)||'';
  localStorage.setItem(LOAD_TIME_KEY, now);
  localStorage.setItem(VERSION_KEY, CURRENT_VERSION);
  // If last known version differs and page is served from GitHub Pages (not localhost/file)
  var isGHPages = window.location.hostname.includes('github.io');
  if(isGHPages && lastVersion && lastVersion !== CURRENT_VERSION){
    document.addEventListener('DOMContentLoaded', function(){
      var b = document.createElement('div');
      b.id = 'version-banner';
      b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9998;background:#d97706;color:#fff;padding:10px 24px;font-family:sans-serif;font-size:13px;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,.2);display:flex;align-items:center;gap:12px;';
      b.innerHTML = '<span>⚠ You may be viewing a cached version of LEX. Press <strong>Ctrl+Shift+R</strong> (Windows) or <strong>Cmd+Shift+R</strong> (Mac) to load the latest version.</span>';
      var btn = document.createElement('button');
      btn.textContent = '🔄 Reload now';
      btn.style.cssText = 'background:#fff;color:#d97706;border:none;padding:4px 12px;border-radius:4px;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap;';
      btn.onclick = function(){ location.reload(true); };
      var close = document.createElement('button');
      close.textContent = '✕';
      close.style.cssText = 'background:transparent;color:#fff;border:none;font-size:16px;cursor:pointer;margin-left:auto;opacity:.8;';
      close.onclick = function(){ b.remove(); };
      b.appendChild(btn);b.appendChild(close);
      document.body.prepend(b);
    });
  }
})();
</script>

    observer.observe(document.getElementById('app'), {childList:true, subtree:true});
  }
})();
</script>

<script>
// ═══════════════════════════════════════════════
// PREFERENCES SYSTEM
// ═══════════════════════════════════════════════
const PREF_KEY="lex12-prefs";
const PREF_DEFAULTS={theme:"light",font:"dmsans",fsize:"md",density:"normal"};
let prefs={...PREF_DEFAULTS};

function loadPrefs(){
  try{const s=localStorage.getItem(PREF_KEY);if(s)prefs={...PREF_DEFAULTS,...JSON.parse(s)};}catch(e){}
  applyPrefs();
}
function savePrefs(){localStorage.setItem(PREF_KEY,JSON.stringify(prefs));}
function applyPrefs(){
  const b=document.body;
  // Theme
  b.classList.toggle("theme-dark",prefs.theme==="dark");
  // Font
  ["font-dmsans","font-inter","font-serif","font-system"].forEach(c=>b.classList.remove(c));
  b.classList.add("font-"+prefs.font);
  // Font size
  ["fsize-sm","fsize-md","fsize-lg","fsize-xl"].forEach(c=>b.classList.remove(c));
  b.classList.add("fsize-"+prefs.fsize);
  // Density
  ["density-compact","density-normal","density-spacious"].forEach(c=>b.classList.remove(c));
  b.classList.add("density-"+prefs.density);
}
function setPref(key,val){prefs[key]=val;savePrefs();applyPrefs();renderPrefPanel();}

let prefPanelOpen=false;
function togglePrefPanel(){
  prefPanelOpen=!prefPanelOpen;
  document.getElementById("pref-overlay").classList.toggle("open",prefPanelOpen);
  document.getElementById("pref-panel").classList.toggle("open",prefPanelOpen);
}
function closePrefPanel(){
  prefPanelOpen=false;
  document.getElementById("pref-overlay").classList.remove("open");
  document.getElementById("pref-panel").classList.remove("open");
}

function renderPrefPanel(){
  const panel=document.getElementById("pref-panel");
  if(!panel)return;
  panel.innerHTML="";
  panel.appendChild(h("div",{className:"pref-panel-header"},
    h("span",{style:{fontWeight:700,fontSize:"14px"}},"🎨 Preferences"),

  // Theme
  const themeSection=h("div",{className:"pref-section"});
  themeSection.appendChild(h("div",{className:"pref-section-title"},"Colour Theme"));
  const themeRow=h("div",{className:"pref-row"});
  [["light","☀ Light"],["dark","🌙 Dark"]].forEach(([val,label])=>{
    themeRow.appendChild(h("button",{
      className:"pref-btn"+(prefs.theme===val?" active":""),
      onClick:()=>setPref("theme",val)
    },label));
  });
  themeSection.appendChild(themeRow);
  panel.appendChild(themeSection);

  // Font
  const fontSection=h("div",{className:"pref-section"});
  fontSection.appendChild(h("div",{className:"pref-section-title"},"Typeface"));
  const fontRow=h("div",{className:"pref-row"});
  [["dmsans","DM Sans"],["inter","Inter"],["serif","Serif"],["system","System"]].forEach(([val,label])=>{
    fontRow.appendChild(h("button",{
      className:"pref-btn"+(prefs.font===val?" active":""),
      style:{fontFamily:val==="dmsans"?"'DM Sans',sans-serif":val==="inter"?"'Inter',sans-serif":val==="serif"?"'Source Serif 4',serif":"system-ui,sans-serif"},
      onClick:()=>setPref("font",val)
    },label));
  });
  fontSection.appendChild(fontRow);
  // Preview
  const preview=h("div",{className:"pref-preview"});
  preview.style.fontFamily=prefs.font==="dmsans"?"'DM Sans',sans-serif":prefs.font==="inter"?"'Inter',sans-serif":prefs.font==="serif"?"'Source Serif 4',serif":"system-ui,sans-serif";
  preview.textContent="The quick brown fox — LEX System v29. Activities · Staff · Allocation.";
  fontSection.appendChild(preview);
  panel.appendChild(fontSection);

  // Font size
  const fsSection=h("div",{className:"pref-section"});
  fsSection.appendChild(h("div",{className:"pref-section-title"},"Text Size"));
  const fsRow=h("div",{className:"pref-row"});
  [["sm","Small"],["md","Medium"],["lg","Large"],["xl","X-Large"]].forEach(([val,label])=>{
    const sizes={sm:"11px",md:"13px",lg:"15px",xl:"17px"};
    fsRow.appendChild(h("button",{
      className:"pref-btn"+(prefs.fsize===val?" active":""),
      style:{fontSize:sizes[val]},
      onClick:()=>setPref("fsize",val)
    },label));
  });
  fsSection.appendChild(fsRow);
  fsSection.appendChild(h("div",{style:{fontSize:"11px",color:"var(--text3)",marginTop:"6px",lineHeight:"1.5"}},"Affects body text, table cells, buttons and inputs throughout the app."));
  panel.appendChild(fsSection);

  // Density
  const densSection=h("div",{className:"pref-section"});
  densSection.appendChild(h("div",{className:"pref-section-title"},"Layout Density"));
  const densRow=h("div",{className:"pref-row"});
  [["compact","Compact"],["normal","Normal"],["spacious","Spacious"]].forEach(([val,label])=>{
    densRow.appendChild(h("button",{
      className:"pref-btn"+(prefs.density===val?" active":""),
      onClick:()=>setPref("density",val)
    },label));
  });
  densSection.appendChild(densRow);
  densSection.appendChild(h("div",{style:{fontSize:"11px",color:"var(--text3)",marginTop:"8px",lineHeight:"1.5"}},"Compact: more data on screen. Spacious: easier to read on large monitors."));

  panel.appendChild(h("div",{className:"pref-section"},
    h("button",{className:"btn btn-ghost btn-sm",onClick:()=>{
      prefs={...PREF_DEFAULTS};savePrefs();applyPrefs();renderPrefPanel();
    }},"Reset to defaults")
  ));
}

// ═══════════════════════════════════════════════
// CONSTANTS & UTILITIES
// ═══════════════════════════════════════════════
const COLORS=["#2563eb","#d97706","#16a34a","#dc2626","#7c3aed","#0891b2","#db2777","#65a30d","#ca8a04","#ea580c"];
function gc(n){return COLORS[Math.abs([...String(n||"")].reduce((a,c)=>a+c.charCodeAt(0),0))%COLORS.length];}

// Robust pupil matching: normalise emails for comparison
function normEmail(e){return(e||"").trim().toLowerCase().replace(/\s+/g,"");}
function _lexUserAcro(){if(!window.__LEX_USER__)return null;const ne=normEmail(window.__LEX_USER__.email);const s=staff.find(sm=>normEmail(sm.email)===ne);return s?s.c:null;}

// ── Default pupil ordering (v50) ──────────────────────────────
// Year group ascending (9,10,11,12,13) then surname then forename.
// Handles "Year 9"/"9"/"Y9" and pushes non-numeric years to the end.
function ygRank(yg){
  if(yg==null)return 999;
  const s=String(yg).trim();if(!s)return 999;
  const m=s.match(/\d+/);
  return m?parseInt(m[0],10):999;
}
// Default comparator for pupil-like objects with .yg, .surname, .forename (pref fallback)
function cmpPupilYgSurname(a,b){
  const ra=ygRank(a?.yg),rb=ygRank(b?.yg);
  if(ra!==rb)return ra-rb;
  const sa=(a?.surname||"").localeCompare(b?.surname||"");
  if(sa!==0)return sa;
  return (a?.forename||a?.pref||"").localeCompare(b?.forename||b?.pref||"");
}

// ── Lookup caches (rebuilt on save for performance) ──
let _pupilCache=null; // Map<normEmail → pupil>
let _actCache=null;   // Map<actName → act>
function _rebuildCaches(){
  _pupilCache=new Map();
  pupils.forEach(p=>{const ne=normEmail(p.email);if(ne)_pupilCache.set(ne,p);});
  _actCache=new Map();
  acts.forEach(a=>_actCache.set(a.n,a));
}
function _ensureCaches(){if(!_pupilCache||!_actCache)_rebuildCaches();}
let _findActFuzzyCache=null;
let _engMapCache=null;
let _allAllocEmailsCache=null;
let _unstaffedCache=null;
let _clashesCache=null;
function invalidateCaches(){_pupilCache=null;_actCache=null;_engMapCache=null;_allAllocEmailsCache=null;_findActFuzzyCache=null;_unstaffedCache=null;_clashesCache=null;}
function findPupilByEmail(email){
  _ensureCaches();
  return _pupilCache.get(normEmail(email))||null;
}
function findActByName_exact(name){
  _ensureCaches();
  return _actCache.get(name)||null;
}
// Fuzzy activity name matching: find closest match in acts (cached)
function findActByName(name){
  if(!name)return null;
  const n=name.trim();
  if(!_findActFuzzyCache)_findActFuzzyCache=new Map();
  if(_findActFuzzyCache.has(n))return _findActFuzzyCache.get(n);
  let found=findActByName_exact(n);if(!found){
    const nl=n.toLowerCase();
    found=acts.find(a=>a.n.toLowerCase()===nl);
    if(!found){
      const norm=s=>s.toLowerCase().replace(/\s*&\s*/g," and ").replace(/[\s\-_]+/g,"");
      found=acts.find(a=>norm(a.n)===norm(n));
      if(!found){
        // v72/B1: was acts.find(...) — returned the first substring match,
        // so "Art" silently picked "Art Club" or "Martial Arts" depending on
        // storage order. Now: collect ALL substring matches; if more than
        // one candidate exists, return null (== unresolved) so the engine
        // surfaces the ambiguity in its log rather than mis-routing.
        const candidates=acts.filter(a=>norm(a.n).includes(norm(n))||norm(n).includes(norm(a.n)));
        if(candidates.length===1)found=candidates[0];
        else if(candidates.length>1){
          console.warn("findActByName: ambiguous fuzzy match for \""+n+"\" — candidates: "+
            candidates.map(c=>c.n).join(", ")+" — returning null (caller will flag NOT FOUND)");
          found=null;
        }
      }
    }
  }
  _findActFuzzyCache.set(n,found||null);
  return found||null;
}

function toast(msg,type="ok"){
  const t=document.getElementById("toast");
  const d=document.createElement("div");
  d.className="toast-msg";
  d.style.background=type==="ok"?"#16a34a":type==="err"?"#dc2626":"#1a1916";
  d.textContent=msg;
  t.appendChild(d);
  requestAnimationFrame(()=>{d.classList.add("show");});
  setTimeout(()=>{d.classList.remove("show");setTimeout(()=>d.remove(),300);},2800);
}

function h(tag,attrs,...ch){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object"){Object.assign(el.style,v);}
    else if(k.startsWith("on")&&k.length>2){el.addEventListener(k.slice(2).toLowerCase(),v);}
    else if(k==="className"){el.className=v;}
    else if(k==="value"&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA")){el.value=v;}
    else if(k==="checked"){el.checked=v;}
    else if(k==="selected"){el.selected=v;}
    else if(k==="disabled"){if(v)el.setAttribute("disabled","");}
    else{el.setAttribute(k,v);}
  });
  ch.flat(Infinity).forEach(c=>{if(c==null||c===false)return;if(typeof c==="string"||typeof c==="number")el.appendChild(document.createTextNode(String(c)));else if(c instanceof Node)el.appendChild(c);});
  return el;
}

// v64: Excel-style multi-select filter popup with search, select-all, counts, viewport-aware positioning.
// v64: Pending-changes model — toggling checkboxes does NOT commit. Changes only apply on OK.
//      Cancel reverts. Escape also cancels. This prevents the popup from closing when each
//      checkbox toggle triggers a parent re-render.
// Usage: buildExcelFilterPopup({values, counts, selected, anchor, onChange})
//   - values:   string[] — all distinct values for the column
//   - counts:   {[val]: number} — optional, shown beside each row
//   - selected: Set<string> | null — null = all selected (no filter)
//   - anchor:   HTMLElement — element near which to position
//   - onChange: (newSelected: Set<string>|null) => void — called ONLY on OK
function buildExcelFilterPopup(opts){
  const {values,counts,selected,anchor,onChange}=opts;
  // Working copy — only committed when user clicks OK
  let cur=selected?new Set(selected):null; // null = unfiltered (all selected)
  const popup=h("div",{className:"col-filter-popup",style:{
    position:"absolute",top:"100%",left:"0",zIndex:200,
    background:"var(--surface)",border:"1px solid var(--border2)",
    borderRadius:"var(--radius)",boxShadow:"var(--shadow-lg)",
    padding:"0",minWidth:"240px",maxWidth:"340px",
    fontSize:"11px",userSelect:"none",
    display:"flex",flexDirection:"column"
  }});
  // Stop propagation on the popup itself — so a click inside never reaches the global click handler
  popup.addEventListener("click",e=>e.stopPropagation());
  popup.addEventListener("mousedown",e=>e.stopPropagation());

  // Header: search box
  const header=h("div",{style:{padding:"8px 8px 6px",borderBottom:"1px solid var(--border)"}});
  const searchInp=h("input",{type:"text",placeholder:"🔍 Search…",style:{
    width:"100%",fontSize:"11px",padding:"4px 6px",border:"1px solid var(--border)",borderRadius:"3px"
  }});
  header.appendChild(searchInp);
  popup.appendChild(header);

  // Select All / Clear / Invert (operate on working copy only)
  const actions=h("div",{style:{display:"flex",gap:"4px",padding:"4px 8px",borderBottom:"1px solid var(--border)",background:"var(--surface2)"}});
  const allBtn=h("button",{className:"btn btn-xs btn-ghost",style:{flex:1,fontSize:"10px"},onClick:()=>{
    cur=null;rebuildList();
  }},"✓ Select all");
  const noneBtn=h("button",{className:"btn btn-xs btn-ghost",style:{flex:1,fontSize:"10px"},onClick:()=>{
    cur=new Set();rebuildList();
  }},"✗ Clear");
  const invBtn=h("button",{className:"btn btn-xs btn-ghost",style:{flex:1,fontSize:"10px"},onClick:()=>{
    const next=new Set();
    values.forEach(v=>{if(!cur||!cur.has(v))next.add(v);});
    cur=next;rebuildList();
  }},"⇅ Invert");
  actions.appendChild(allBtn);actions.appendChild(noneBtn);actions.appendChild(invBtn);
  popup.appendChild(actions);

  // "Select only matching search" — works on the search-filtered subset
  const visAction=h("div",{style:{padding:"4px 8px",borderBottom:"1px solid var(--border)",fontSize:"10px",color:"var(--text2)",cursor:"pointer",background:"var(--surface2)",fontWeight:500}},
    "↳ Select only matching search");
  visAction.addEventListener("click",()=>{
    const term=searchInp.value.trim().toLowerCase();
    if(!term){cur=null;rebuildList();return;}
    cur=new Set(values.filter(v=>String(v).toLowerCase().includes(term)));
    rebuildList();
  });
  popup.appendChild(visAction);

  // Scrollable checkbox list
  const listWrap=h("div",{style:{maxHeight:"280px",overflowY:"auto",padding:"4px 4px"}});
  popup.appendChild(listWrap);

  // Footer with status + OK / Cancel
  const footer=h("div",{style:{padding:"8px",borderTop:"1px solid var(--border)",background:"var(--surface2)",display:"flex",alignItems:"center",gap:"6px"}});
  const status=h("span",{style:{flex:1,fontSize:"10px",color:"var(--text3)",fontStyle:"italic"}});
  footer.appendChild(status);
  const cancelBtn=h("button",{className:"btn btn-xs btn-ghost",style:{fontSize:"10px"},onClick:()=>{
    closeWithoutCommit();
  }},"Cancel");
  const okBtn=h("button",{className:"btn btn-xs btn-primary",style:{fontSize:"10px",fontWeight:600},onClick:()=>{
    commit();
  }},"OK");
  footer.appendChild(cancelBtn);footer.appendChild(okBtn);
  popup.appendChild(footer);

  function isChecked(val){return cur===null||cur.has(val);}
  function toggle(val){
    if(cur===null)cur=new Set(values);
    if(cur.has(val))cur.delete(val);else cur.add(val);
    if(cur.size===values.length)cur=null; // collapse to "no filter"
    updateFooter();
    // Update only this checkbox's row indicator without rebuilding the whole list
  }
  function updateFooter(){
    const n=cur===null?values.length:cur.size;
    status.textContent=n+" of "+values.length+" selected"+(cur===null?" (no filter)":"");
  }
  function rebuildList(){
    listWrap.innerHTML="";
    const term=searchInp.value.trim().toLowerCase();
    const filtered=term?values.filter(v=>String(v).toLowerCase().includes(term)):values;
    if(!filtered.length){
      listWrap.appendChild(h("div",{style:{padding:"6px 8px",color:"var(--text3)",fontStyle:"italic"}},"No matches"));
    }
    filtered.forEach(val=>{
      const cnt=counts?counts[val]:null;
      const row=h("label",{style:{display:"flex",alignItems:"center",gap:"6px",padding:"3px 6px",fontSize:"11px",cursor:"pointer",borderRadius:"3px"}});
      row.addEventListener("mouseenter",()=>{row.style.background="var(--surface2)";});
      row.addEventListener("mouseleave",()=>{row.style.background="transparent";});
      const cb=h("input",{type:"checkbox"});
      cb.checked=isChecked(val);
      cb.addEventListener("change",()=>{toggle(val);});
      row.appendChild(cb);
      const lbl=h("span",{style:{flex:1}},val||"(blank)");
      row.appendChild(lbl);
      if(cnt!=null)row.appendChild(h("span",{style:{fontSize:"10px",color:"var(--text3)",fontFamily:"var(--mono)"}},cnt));
      listWrap.appendChild(row);
    });
    updateFooter();
  }
  searchInp.addEventListener("input",rebuildList);

  // Mark this popup as "pending" so the global click-outside handler treats it differently
  popup.dataset.pending="1";

  function commit(){
    onChange(cur);
    popup.remove();
  }
  function closeWithoutCommit(){
    popup.remove();
  }

  // Escape closes without committing; Enter commits
  popup.addEventListener("keydown",e=>{
    if(e.key==="Escape"){e.preventDefault();e.stopPropagation();closeWithoutCommit();}
    else if(e.key==="Enter"){e.preventDefault();e.stopPropagation();commit();}
  });

  rebuildList();

  // Position aware of right-edge clipping
  setTimeout(()=>{
    if(!anchor)return;
    const r=popup.getBoundingClientRect();
    const vw=window.innerWidth;
    if(r.right>vw-8){popup.style.left="auto";popup.style.right="0";}
  },0);
  setTimeout(()=>searchInp.focus(),50);
  return popup;
}

// v64: Build next year's standalone HTML system.
// Strategy: fetch this page's HTML, do targeted find-and-replace, inject seeded data, download.
async function buildNextYearSystem(opts){
  const {yearLabel,supaUrl,supaKey}=opts;
  toast("Building "+yearLabel+" system… this takes a few seconds");
  try{
    // 1. Fetch current page HTML
    const resp=await fetch(window.location.href+"?_t="+Date.now(),{cache:"no-cache"});
    if(!resp.ok)throw new Error("Could not fetch current page source ("+resp.status+")");
    let html=await resp.text();
    // v65: detect this file's localStorage prefix generically so the rollover
    //      wizard works from ANY year's file and self-propagates each year.
    const _pm=html.match(/const PREF_KEY="lex(\d+)-prefs";/);
    const _curN=_pm?parseInt(_pm[1],10):11;
    const NEXT_PREFIX="lex"+(_curN+1)+"-";

    // 2. Bump pupils: Y9→Y10, Y10→Y11, Y11→Y12, Y12→Y13; Y13 removed
    // v64: yg may be either bare number ("13") or "Year 13" — handle both.
    // Preserve the original format style so the new system keeps consistency.
    function bumpYg(yg,delta){
      if(!yg)return yg;
      // Match "Year N" pattern first
      const m=String(yg).match(/^(Year\s+)?(\d+)$/i);
      if(!m)return yg;
      const prefix=m[1]||"";
      const num=parseInt(m[2],10);
      return prefix+(num+delta);
    }
    function ygNum(yg){
      const m=String(yg||"").match(/(\d+)/);
      return m?parseInt(m[1],10):NaN;
    }
    const bumpedPupils=pupils
      .filter(p=>ygNum(p.yg)!==13) // remove Year 13 (leavers)
      .map(p=>{
        const n=ygNum(p.yg);
        if(n>=9&&n<=12)return{...p,yg:bumpYg(p.yg,1)};
        return{...p};
      });

    // 3. Seed data — what carries forward
    const seedData={
      _seedFromYear:SYSTEM_YEAR_LABEL,
      _seedAt:new Date().toISOString(),
      staff:JSON.parse(JSON.stringify(staff)),
      pupils:bumpedPupils,
      venues:JSON.parse(JSON.stringify(venues||[])),
      priorYTD:JSON.parse(JSON.stringify(priorYTD||{})),
      consentMap:JSON.parse(JSON.stringify(consentMap||{})),
      acts:[],dates:[],formData:[],allocRes:null,
      allocOverrides:{},allocDateOverrides:{},sa:{},attendance:{},
      allocHistory:JSON.parse(JSON.stringify(allocHistory||[])),
      savedSubGroups:JSON.parse(JSON.stringify(savedSubGroups||[]))
    };

    // 4. Mutate constants (year-agnostic — works from any year's file)
    html=html.replace(/<title>LEX [^<]*<\/title>/,"<title>LEX "+yearLabel+" \u2014 Clayesmore</title>");
    html=html.replace(/const SYSTEM_YEAR_LABEL = "[^"]*";/,'const SYSTEM_YEAR_LABEL = "'+yearLabel+'";');
    html=html.replace(/const PLANNING_YEAR_MODE = (?:true|false);/,"const PLANNING_YEAR_MODE = true;");

    // 5. Bump every lexNN- localStorage prefix by one generation. Numeric increment
    //    (not string substitution) so it is collision-free, quote-agnostic (also
    //    catches template literals like key=neq.lexNN-presence) and self-safe: this
    //    line holds no lexNN- literal so it cannot corrupt its own clone.
    html=html.replace(/lex(\d+)-/g,function(_m,_n){return "lex"+(parseInt(_n,10)+1)+"-";});

// Normalise house names to single-letter initial
// Clayesmore houses: Manor (M), Gate (G), Devine (D), King's (K), Wolverton (W)
function normaliseHouse(raw){
  if(!raw)return raw;
  const r=raw.trim().toLowerCase().replace(/[''']/g,"'");
  if(!r)return raw;
  // Direct single-letter codes
  if(r==='m'||r==='g'||r==='d'||r==='k'||r==='w')return r.toUpperCase();
  // Manor
  if(r==='manor'||r.startsWith('manor '))return 'M';
  // Gate (must check before Devine to handle "Gate" alone)
  if(r==='gate'||r.startsWith('gate '))return 'G';
  // Devine
  if(r==='devine'||r.startsWith('devine ')||r==='dev'||r.startsWith('dev '))return 'D';
  // King's / Kings
  if(r==="king's"||r==='kings'||r==='king'||r.startsWith("king's ")||r.startsWith('kings ')||r.startsWith('king '))return 'K';
  // Wolverton
  if(r==='wolverton'||r.startsWith('wolverton ')||r==='wolv'||r.startsWith('wolv '))return 'W';
  return raw.trim();
}
// Convert single-letter house code back to full name
function houseFullName(code){
  if(!code)return code;
  const c=String(code).trim().toUpperCase();
  if(c==='M')return 'Manor';
  if(c==='G')return 'Gate';
  if(c==='D')return 'Devine';
  if(c==='K')return "King's";
  if(c==='W')return 'Wolverton';
  return code;
}
function normaliseYg(raw){

  if(/^Year \d+$/i.test(r))return r.charAt(0).toUpperCase()+r.slice(1).toLowerCase().replace('year ','Year ');
  // Bare number: 9 → Year 9
  if(/^\d+$/.test(r))return 'Year '+r;

}

// v71: shared helper for display-only chronological ordering. Parses
// d.full in DD/MM/YYYY form into [year, month, day] for safe comparison.
// Returns NaN-equivalent fallback so malformed dates sort to the end
// rather than throwing or scattering randomly.
function parseDateDmy(full){
  if(!full||typeof full!=="string")return [9999,99,99];
  const m=full.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!m)return [9999,99,99];
  return [parseInt(m[3],10),parseInt(m[2],10),parseInt(m[1],10)];
}
// v71: returns indices into dates[] ordered chronologically, preserving
// insertion order as a stable tiebreaker. The returned indices are the
// REAL di values — safe to pass anywhere that expects a date index.
function sortedDateIndices(){
  return dates.map((d,i)=>i).sort((a,b)=>{
    const pa=parseDateDmy(dates[a]&&dates[a].full);
    const pb=parseDateDmy(dates[b]&&dates[b].full);
    if(pa[0]!==pb[0])return pa[0]-pb[0];
    if(pa[1]!==pb[1])return pa[1]-pb[1];
    if(pa[2]!==pb[2])return pa[2]-pb[2];
    return a-b; // stable
  });
}
// v72 / C3: one-time chronological sort of dates[] with full di-remap.
// Runs once per system (marker key <prefix>-sortmigration-v72). After it
// runs, dates[] is in chronological storage order, and every reference
// to a date by integer index has been updated to point to its new slot.
//
// SAFETY:
//  - If the per-row Supabase tables hold ANY rows, we don't touch them
//    automatically — instead we report and ABORT, so the admin can
//    decide what to do. For an empty/near-empty system this never fires.
//  - The marker is only written on SUCCESS, so a partial run can re-try.
//  - If dates[] is already sorted, the function no-ops and sets the marker.
async function sortDatesAndRemap(){
  const MARKER=PREF_KEY.replace(/prefs$/,"sortmigration-v72");
  if(localStorage.getItem(MARKER)==="1")return;
  if(!dates||dates.length<2){localStorage.setItem(MARKER,"1");return;}

  // Compute the chronologically-sorted index order.
  const newOrder=sortedDateIndices(); // returns OLD indices in new order
  const isSorted=newOrder.every((oi,ni)=>oi===ni);
  if(isSorted){
    localStorage.setItem(MARKER,"1");
    console.log("[v72/C3] dates already in chronological order — marker set, no-op");
    return;
  }

  // SAFETY CHECK — per-row Supabase tables. If they have rows under our
  // pfx, abort and tell the admin rather than risk a partial cloud remap.
  if(supaClient){
    try{
      const attSum=await tableSummary("lex_attendance");
      const ovrSum=await tableSummary("lex_date_overrides");
      const attCount=attSum?attSum.count:0;
      const ovrCount=ovrSum?ovrSum.count:0;
      if(attCount>0||ovrCount>0){
        const msg="[v72/C3] cannot auto-sort dates: per-row Supabase tables hold "+
          attCount+" attendance + "+ovrCount+" override rows for pfx="+PFX+". "+
          "Sorting dates would invalidate their `di` integer references. "+
          "Either clear those rows (low-stakes during planning) and reload, "+
          "or contact dev support for a guided cloud-side remap.";
        console.warn(msg);
        try{toast("Date-sort migration skipped — see browser console","warn");}catch(_){}
        // Don't set marker — leave it to retry next load when state may differ.
        return;
      }
    }catch(e){
      console.warn("[v72/C3] safety-check failed; deferring sort migration",e&&(e.message||e));
      return;
    }
  }

  // Build oldIdx -> newIdx mapping.
  const oldToNew={};
  newOrder.forEach((oldIdx,newIdx)=>{oldToNew[oldIdx]=newIdx;});

  // 1. Sort dates[] itself.
  dates=newOrder.map(oi=>dates[oi]);

  // 2. Remap acts[i].di arrays.
  let actsTouched=0;
  acts.forEach(a=>{
    if(!Array.isArray(a.di))return;
    const remapped=a.di.map(oi=>oldToNew.hasOwnProperty(oi)?oldToNew[oi]:oi);
    if(remapped.some((v,k)=>v!==a.di[k])){a.di=remapped;actsTouched++;}
  });

  // 3. Remap sa keys ("di|code" or "di|code|A"/"|B").
  const newSA={};
  Object.entries(sa).forEach(([k,v])=>{
    const parts=k.split("|");
    const oldIdx=parseInt(parts[0],10);
    if(isNaN(oldIdx)||!oldToNew.hasOwnProperty(oldIdx)){newSA[k]=v;return;}
    parts[0]=String(oldToNew[oldIdx]);
    newSA[parts.join("|")]=v;
  });
  sa=newSA;

  // 4. Remap allocDateOverrides keys ("di|email").
  const newOvr={};
  Object.entries(allocDateOverrides).forEach(([k,v])=>{
    const parts=k.split("|");
    const oldIdx=parseInt(parts[0],10);
    if(isNaN(oldIdx)||!oldToNew.hasOwnProperty(oldIdx)){newOvr[k]=v;return;}
    parts[0]=String(oldToNew[oldIdx]);
    newOvr[parts.join("|")]=v;
  });
  allocDateOverrides=newOvr;

  // 5. Persist locally + push to cloud, then mark complete.
  invalidateCaches();
  saveAll();
  localStorage.setItem(MARKER,"1");
  console.log("[v72/C3] dates sorted chronologically; remapped "+actsTouched+" activities, "+
    Object.keys(newSA).length+" sa keys, "+Object.keys(newOvr).length+" override keys");
  try{toast("Dates sorted chronologically ✓");}catch(_){}
}

function _resolveDateHeaderToDi(hdr){

  const MM={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  function parse(s){
    s=s.toLowerCase().replace(/(\d+)(st|nd|rd|th)/g,"$1"); let m;
    if(m=s.match(/\b(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})\b/))return{d:+m[3],mo:+m[2],y:+m[1]};
    if(m=s.match(/\b(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?\b/))return{d:+m[1],mo:+m[2],y:m[3]?(+m[3]<100?2000+(+m[3]):+m[3]):null};
    if(m=s.match(/\b(\d{1,2})\s*[-\s]\s*([a-z]{3,})\.?\s*(\d{2,4})?\b/)){const mo=MM[m[2].slice(0,3)];if(mo)return{d:+m[1],mo:mo,y:m[3]?(+m[3]<100?2000+(+m[3]):+m[3]):null};}
    if(m=s.match(/\b([a-z]{3,})\.?\s*(\d{1,2})\s*,?\s*(\d{2,4})?\b/)){const mo=MM[m[1].slice(0,3)];if(mo)return{d:+m[2],mo:mo,y:m[3]?(+m[3]<100?2000+(+m[3]):+m[3]):null};}
    return null;

// Auto-generate staff email: first char of code (lowercase) + surname (lowercase, no spaces/hyphens) @ clayesmore.com
// Handles edge cases: "Dorey E" → edorey, "du Plessis" → mplessis, "Hugo Shale" → hshale
function guessStaffEmail(code,name){
  if(!code||!name)return"";
  const initial=code.charAt(0).toLowerCase();
  const words=name.trim().split(/\s+/);
  let namePart=words[words.length-1];
  if(namePart.length===1&&words.length>1)namePart=words[words.length-2];
  const surname=namePart.toLowerCase().replace(/[^a-z]/g,"");

}

let sa={}; // staff allocations: "di|code" -> {act:actName, role:"lead"|"support"} (or legacy string)

// ── sa helper functions ── always use these to read/write sa ──
// Key formats: "di|code" (both sessions / A+B), "di|code|A" (session A), "di|code|B" (session B)
function saGet(key){const v=sa[key];if(!v)return null;return typeof v==="string"?v:v.act||null;}
function saRole(key){const v=sa[key];if(!v)return"support";if(typeof v==="string"){
  const parts=key.split("|");const code=parts[1];const act=findActByName_exact(v);
  if(!act)return"support";
  return(act.lead===code||act.sessALead===code||act.sessBLead===code)?"lead":"support";
}return v.role||"support";}
function saSet(key,actName,role){
  if(!actName){delete sa[key];return;}
  if(role===undefined){
    const parts=key.split("|");const code=parts[1];
    const act=findActByName_exact(actName);
    role=(act&&(act.lead===code||act.sessALead===code||act.sessBLead===code))?"lead":"support";
  }
  sa[key]={act:actName,role};
}
// Extract staff code from any sa key format ("di|code" or "di|code|A")
function saCode(key){return key.split("|")[1];}
// Rename a staff code everywhere: sa map, activity lead/staff/sessALead/sessBLead, priorYTD
function renameStaffCode(oldCode, newCode){
  if(!oldCode||!newCode||oldCode===newCode)return 0;
  let changes=0;
  // 1. sa map keys: "di|oldCode" -> "di|newCode", "di|oldCode|A" -> "di|newCode|A", etc.
  Object.keys(sa).forEach(k=>{
    const parts=k.split("|");
    if(parts[1]===oldCode){
      const newKey=parts[0]+"|"+newCode+(parts[2]?"|"+parts[2]:"");
      sa[newKey]=sa[k];delete sa[k];changes++;
    }
  });
  // 2. Activity records: lead, sessALead, sessBLead, staff[]
  acts.forEach(a=>{
    if(a.lead===oldCode){a.lead=newCode;changes++;}
    if(a.sessALead===oldCode){a.sessALead=newCode;changes++;}
    if(a.sessBLead===oldCode){a.sessBLead=newCode;changes++;}
    if(Array.isArray(a.staff)){
      a.staff=a.staff.map(sc=>sc===oldCode?(changes++,newCode):sc);
    }
  });
  // 3. priorYTD map
  if(priorYTD[oldCode]!==undefined){priorYTD[newCode]=priorYTD[oldCode];delete priorYTD[oldCode];changes++;}
  return changes;
}
// Get full session picture for a staff member on a date (Option C)
// Returns null if no assignment, or {a:{act,role}|null, b:{act,role}|null, split:bool}
function saGetDate(di,code){
  const base=di+"|"+code;
  const keyA=base+"|A";const keyB=base+"|B";
  const hasBase=!!sa[base];const hasA=!!sa[keyA];const hasB=!!sa[keyB];
  if(!hasBase&&!hasA&&!hasB)return null;
  if(hasA||hasB){
    return{
      a:hasA?{act:saGet(keyA),role:saRole(keyA)}:null,
      b:hasB?{act:saGet(keyB),role:saRole(keyB)}:null,
      split:true
    };
  }
  const act=saGet(base);const role=saRole(base);
  return{a:{act,role},b:{act,role},split:false};
}

function saKeysForDate(di){

}
// Get all sa keys for a staff code (handles 2 and 3 part keys)
function saKeysForStaff(code){

}
function migrateSA(){
  // Convert any remaining string values to object format
  Object.keys(sa).forEach(k=>{
    const v=sa[k];
    if(typeof v==="string"){
      const parts=k.split("|");const code=parts[1];
      const act=findActByName_exact(v);
      const role=(act&&(act.lead===code||act.sessALead===code||act.sessBLead===code))?"lead":"support";
      sa[k]={act:v,role};
    }
  });
  // Migrate legacy DB code: DB→DBa (Baker), leaving DBl (Blackburn) unchanged
  Object.keys(sa).forEach(k=>{
    const parts=k.split("|");
    if(parts.length>=2&&parts[1]==="DB"){
      const newKey=parts[0]+"|DBa"+(parts[2]?"|"+parts[2]:"");
      sa[newKey]=sa[k];
      delete sa[k];
    }
  });
  // B1 component migration (v49): convert compound activity names to component names
  // and split base keys on split-session activities into session-specific keys
  Object.keys(sa).forEach(k=>{
    const parts=k.split("|");
    const di=parts[0];const code=parts[1];const sess=parts[2]||null; // "A","B", or null
    const actName=saGet(k);if(!actName)return;
    const act=findActByName_exact(actName);
    if(!act||!isSplitAct(act)){
      // Not a split activity OR act not found (might already be a component name) — leave as-is
      return;
    }
    // This sa value points to a compound (pairing) name on a split activity
    if(sess==="A"){
      // Session A key → convert value to sessA component name
      sa[k]={act:act.sessA,role:saRole(k)};
    } else if(sess==="B"){
      // Session B key → convert value to sessB component name
      sa[k]={act:act.sessB,role:saRole(k)};
    } else {
      // Base key "di|code" on a split activity → split into session-specific component keys
      const role=saRole(k);
      const isLeadA=act.sessALead===code||act.lead===code;
      const isLeadB=act.sessBLead===code;
      sa[di+"|"+code+"|A"]={act:act.sessA,role:isLeadA?"lead":role};
      sa[di+"|"+code+"|B"]={act:act.sessB,role:isLeadB?"lead":role};
      delete sa[k];
    }
  });
}

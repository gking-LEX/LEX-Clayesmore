function runAllocEngineV12(){
  const log=[];if(!formData.length){allocLog=["ERROR: No form data loaded. Go to Paste Responses first."];return;}
  const allRes=[];
  waitingList={};

  // Step 0: Build fuzzy name map for all form choices
  const nameFixLog=[];
  function resolveActName(rawName,halfLbl){
    if(!rawName)return null;
    const exact=findActByName_exact(rawName);
    if(exact)return exact.n;
    const fuzzy=findActByName(rawName);
    if(fuzzy){
      nameFixLog.push("  AUTO-MATCHED: \""+rawName+"\" → \""+fuzzy.n+"\" in "+halfLbl);
      return fuzzy.n;
    }
    return null; // truly not found
  }

  ["S1","S2"].forEach(half=>{
    const halfLbl=halfLabel(half);
    log.push("═══════════════════════════════════════════");
    log.push("ALLOCATING: "+halfLbl+" ("+formData.length+" pupils)");
    log.push("═══════════════════════════════════════════");

    const halfDi=dates.map((_,i)=>i).filter(i=>dates[i].half===half);
    // Include ALL activities running this half — cap=0 means TBC, excluded from engine but warned
    const allHalfActs=acts.filter(a=>a.di.some(d=>halfDi.includes(d)));
    const capU={},capM={};
    allHalfActs.forEach(a=>{if(a.cap>0){capU[a.n]=0;capM[a.n]=a.cap;}});
    const hActs=allHalfActs.filter(a=>a.cap>0);
    const vn=new Set(hActs.map(a=>a.n));
    allHalfActs.filter(a=>!a.cap).forEach(a=>log.push("WARNING: "+a.n+" skipped (capacity TBC)"));

    // Step 1: Apply manual overrides (including "Out of school")
    const overrides=allocOverrides[half.toLowerCase()]||{};
    const overriddenEmails=new Set();
    Object.entries(overrides).forEach(([email,activity])=>{
      if(activity){
        const origFd=formData.find(f=>normEmail(f.email)===normEmail(email));
        allRes.push({email:origFd?origFd.email:email,alloc:activity,lvl:0,st:"OVERRIDE",half,isOverride:true,
          s1c1:"",s1c2:"",s1c3:"",s2c1:"",s2c2:"",s2c3:"",...(origFd||{})});
        if(capU[activity]!==undefined)capU[activity]=(capU[activity]||0)+1;
        overriddenEmails.add(normEmail(email));
        log.push("  OVERRIDE: "+email+" → "+activity);
      }
    });

    // Log any fuzzy matches found
    if(nameFixLog.length>0){nameFixLog.forEach(l=>log.push(l));nameFixLog.length=0;}

    // Step 2: Score and sort remaining pupils
    const remaining=formData.filter(p=>!overriddenEmails.has(normEmail(p.email))).map(p=>{
      const tsScore=new Date(p.timestamp||0).getTime()||0;
      let disappointmentCount=0;
      allocHistory.forEach(h2=>{
        if(normEmail(h2.email)!==normEmail(p.email))return;
        // v65: allocHistory carries two record shapes — {activity,choiceIndex} from CSV
        // import, and full allocRes rows {alloc,lvl,...} from the in-app save buttons.
        // Normalise both so cross-year fairness counts history written by either path.
        const ci=(h2.choiceIndex!=null)?h2.choiceIndex:((h2.lvl||1)-1);
        if(ci>0)disappointmentCount++;
      });
      const otherHalfRes=allRes.find(r=>normEmail(r.email)===normEmail(p.email)&&r.half!==half);
      if(otherHalfRes&&otherHalfRes.lvl>1)disappointmentCount++;
      const actHistoryCount={};
      allocHistory.forEach(h2=>{
        if(normEmail(h2.email)!==normEmail(p.email))return;
        const act=h2.activity||h2.alloc;
        if(act)actHistoryCount[act]=(actHistoryCount[act]||0)+1;
      });
      // FIX Bug 4: Only count other-half result in history if it would actually cause oversubscription
      // — don't add it unconditionally as it incorrectly penalises S2 for S1 allocations
      // (handled at allocation time below instead)
      return{...p,tsScore,disappointmentCount,actHistoryCount,otherHalfAlloc:otherHalfRes?otherHalfRes.alloc:null};
    });

    remaining.sort((a,b)=>{
      if(b.disappointmentCount!==a.disappointmentCount)return b.disappointmentCount-a.disappointmentCount;
      return a.tsScore-b.tsScore;
    });

    // Step 3: Allocate with fuzzy matching
    remaining.forEach(p=>{
      // FIX Bug 2: only use half-specific choices — do NOT fall back to c1/c2/c3 (which are S1 fields)
      // If a pupil has no S2 choices, they should be unmatched, not given their S1 choices
      const rawC1=half==="S1"?(p.s1c1||p.c1||""):(p.s2c1||"");
      const rawC2=half==="S1"?(p.s1c2||p.c2||""):(p.s2c2||"");
      const rawC3=half==="S1"?(p.s1c3||p.c3||""):(p.s2c3||"");
      const ch=[rawC1,rawC2,rawC3].map(c=>{
        if(!c)return null;
        const resolved=resolveActName(c,halfLbl);
        if(!resolved&&c)log.push("  "+p.email+": \""+c+"\" NOT FOUND in "+halfLbl+" (not in activity list)");
        return resolved;
      }).filter(Boolean);
      let alloc=null,lvl=null;

      for(let i=0;i<ch.length;i++){
        if(!vn.has(ch[i]))continue; // not running this half
        const cap=capM[ch[i]],used=capU[ch[i]]||0;
        if(used>=cap){
          log.push("  "+p.email+": "+ch[i]+" FULL ("+used+"/"+cap+")");
          // Add to waiting list
          if(!waitingList[ch[i]])waitingList[ch[i]]=[];
          waitingList[ch[i]].push({email:p.email,choiceIndex:i,half});
          continue;
        }
        if(i===0&&(p.actHistoryCount[ch[i]]||0)>0){
          // FIX Bug 4: also count other-half alloc for same activity in oversubscription check
          const otherHalfCount=(p.otherHalfAlloc===ch[i])?1:0;
          const histCount=(p.actHistoryCount[ch[i]]||0)+otherHalfCount;
          if(histCount>0){
            const demand=remaining.filter(r=>{const rc=half==="S1"?(r.s1c1||r.c1):(r.s2c1||"");return resolveActName(rc,halfLbl)===ch[i];}).length;
            if(demand>cap){
              // FIX Bug 3: don't skip to unmatched — fall through to 2nd/3rd choice instead
              log.push("  "+p.email+": REPEAT PENALTY on "+ch[i]+" (done before, oversubscribed "+demand+"/"+cap+") — trying next choice");
              if(!waitingList[ch[i]])waitingList[ch[i]]=[];
              waitingList[ch[i]].push({email:p.email,choiceIndex:i,half});
              continue; // try next choice in the loop
            }
          }
        }
        alloc=ch[i];lvl=i+1;capU[ch[i]]=used+1;break;
      }
      if(alloc){
        log.push("  "+p.email+" → "+alloc+" (choice "+lvl+(p.disappointmentCount>0?" · fairness boost":"")+")");
        allRes.push({...p,alloc,lvl,st:lvl===1?"1ST":lvl===2?"2ND":"3RD",half,isOverride:false});
      }else{
        const choicesStr=ch.length>0?ch.join(", "):"no valid choices";
        log.push("  "+p.email+": UNMATCHED (wanted: "+choicesStr+")");
        allRes.push({...p,alloc:null,lvl:null,st:"UNMATCHED",half,isOverride:false});
      }
    });

    log.push("");
    const s1c=allRes.filter(r=>r.half===half&&r.lvl===1).length;
    const s2c=allRes.filter(r=>r.half===half&&r.lvl===2).length;
    const s3c=allRes.filter(r=>r.half===half&&r.lvl===3).length;
    const um=allRes.filter(r=>r.half===half&&!r.alloc).length;
    const ov=allRes.filter(r=>r.half===half&&r.isOverride).length;
    log.push("SUMMARY ("+halfLbl+"): "+s1c+" 1st | "+s2c+" 2nd | "+s3c+" 3rd | "+ov+" overrides | "+um+" unmatched");
    log.push("CAPACITY: "+Object.entries(capU).filter(([,v])=>v>0).map(([k,v])=>k+": "+v+"/"+capM[k]).join(" | "));
    // Demand report
    const demand={};formData.forEach(p=>{
      const c=half==="S1"?(p.s1c1||p.c1||""):(p.s2c1||p.c1||"");
      const resolved=resolveActName(c,halfLbl);if(resolved){demand[resolved]=(demand[resolved]||0)+1;}
    });
    const hotActs=Object.entries(demand).filter(([k,v])=>v>(capM[k]||0)).sort((a,b)=>b[1]-a[1]);
    if(hotActs.length>0){
      log.push("OVERSUBSCRIBED: "+hotActs.map(([k,v])=>k+" ("+v+" wanted, "+capM[k]+" places)").join(" | "));
    }
    log.push("");
  });

  allocRes=allRes;
  allocLog=log;
  const s1tot=allRes.filter(r=>r.half==="S1"&&r.alloc).length;
  const s2tot=allRes.filter(r=>r.half==="S2"&&r.alloc).length;
  logAction("ALLOCATION_RUN","S1: "+s1tot+" allocated, S2: "+s2tot+" allocated");
  takeSnapshot("Pre-run backup");
  saveAll();
}

// Silent re-run triggered automatically when overrides change
// Only runs if formData exists; debounced 800ms to batch rapid changes
let _allocDbc=null;
function autoRealloc(msg){
  if(!formData||!formData.length)return;
  clearTimeout(_allocDbc);
  _allocDbc=setTimeout(()=>{
    runAllocEngineV12();
    toast(msg||"Allocation updated ✓");
    // Re-render to reflect updated allocRes and capacity counts
    if(currentTab==="alloc"){const m=document.querySelector(".main");if(m){m.innerHTML="";renderAlloc(m);}}
  },800);
}

  el.appendChild(h("div",{className:"page-header"},h("h2",null,"Parent Contacts"),h("p",null,"Import and view parental contact data from iSAMS. Click any cell to edit.")));

  // Import card
  const importCard=h("div",{className:"card card-pad mb-16"});

function renderRegisters(el){
  el.appendChild(h("div",{className:"page-header",style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between"}},
    h("div",null,h("h2",null,"Registers"),h("p",null,"Attendance by activity, whole-school summary, or full-term overview."))
  ));

  // View mode selector
  if(!window._regMode)window._regMode="activity";
  const modeBar=h("div",{style:{display:"flex",gap:"6px",marginBottom:"16px",flexWrap:"wrap"}});
  [["activity","📝 By Activity"],["wholeschool","🏫 Whole School"],["termsummary","📊 Term Summary"]].forEach(([id,lbl])=>{
    modeBar.appendChild(h("button",{
      className:"btn "+(window._regMode===id?"btn-primary":"btn-ghost"),
      onClick:()=>{window._regMode=id;const m=document.querySelector(".main");if(m){m.innerHTML="";renderRegisters(m);}}
    },lbl));
  });
  el.appendChild(modeBar);

  if(window._regMode==="wholeschool"){renderWholeSchoolRegisters(el);return;}
  if(window._regMode==="termsummary"){renderTermSummary(el);return;}

  if(!allocRes&&Object.keys(allocDateOverrides).length===0){
    el.appendChild(h("div",{className:"alert alert-warn"},"Run allocation first (Allocate tab)."));return;
  }

  // Date tabs
  if(!window._regDate)window._regDate=0;
  const dateTabBar=h("div",{style:{display:"flex",gap:"4px",flexWrap:"wrap",marginBottom:"16px"}});
  sortedDateIndices().forEach(di=>{ const d=dates[di];
    const isActive=window._regDate===di;
    dateTabBar.appendChild(h("button",{
      className:"btn "+(isActive?"btn-primary":"btn-ghost"),
      style:{fontSize:"11px"},
      onClick:()=>{window._regDate=di;const m=document.querySelector(".main");if(m){const sy=m.scrollTop||window.scrollY;m.innerHTML="";renderRegisters(m);requestAnimationFrame(()=>{m.scrollTop=0;window.scrollTo(0,0);});}}
    },d.label.replace("Sat ","")+" "+halfLabelShort(d.half)+(d.note?" ⚠":""))
    );
  });
  el.appendChild(dateTabBar);

  const di=window._regDate;
  const d=dates[di];
  if(!d){el.appendChild(h("div",{className:"alert alert-info"},"No dates configured."));return;}
  const dateHalf=d.half||"S1";

  // Get all activities for this date — ONLY include activities scheduled on this specific date
  const engineActsForDate=new Set();

  // Build set of activity names scheduled on this specific date index
  const actsOnThisDate=new Set(acts.filter(a=>a.di.includes(di)).map(a=>a.n));

  // From per-date overrides — only include if the activity is scheduled on this date
  // (bulk year-group reassignments can leave orphan overrides on dates where the activity doesn't run)
  Object.entries(allocDateOverrides).filter(([k])=>k.startsWith(di+"|")).forEach(([,v])=>{
    if(v&&v!=="__UNASSIGNED__"){
      if(actsOnThisDate.has(v)||SPECIAL_ALLOCS.has(v))engineActsForDate.add(v);
    }
  });
  // From engine/half-term allocation — ONLY if the activity actually runs on this date
  if(allocRes)allocRes.filter(r=>r.half===dateHalf&&r.alloc&&r.alloc!=="__UNASSIGNED__"&&actsOnThisDate.has(r.alloc)).forEach(r=>engineActsForDate.add(r.alloc));
  // From half-term overrides — only include if the activity actually exists AND runs on this date.
  // Fixes ghost registers from typos or deleted activities (the !htAct clause in v58 was wrong).
  Object.values(allocOverrides[dateHalf.toLowerCase()]||{}).forEach(v=>{
    if(v&&v!=="__UNASSIGNED__"){
      if(SPECIAL_ALLOCS.has(v)){engineActsForDate.add(v);return;}
      const htAct=findActByName_exact(v);
      if(htAct&&htAct.di.includes(di))engineActsForDate.add(v);
    }
  });
  // All acts scheduled on this date (includes compulsory/designation) — the primary source
  actsOnThisDate.forEach(n=>engineActsForDate.add(n));

  const actNames=[...engineActsForDate].filter(Boolean)
    .filter(n=>n.toLowerCase()!=="prep")  // Prep is not a senior-school activity; no register needed
    .sort((a,b)=>a.localeCompare(b));

  if(!actNames.length){el.appendChild(h("div",{className:"alert alert-info"},"No activities on "+d.label+". Check activity dates in Settings."));return;}

  // Activity selector — with pupil counts so anomalies are immediately visible
  if(!window._regAct||!actNames.includes(window._regAct))window._regAct=actNames[0];
  const engMapReg=buildEngMap();
  const allNeReg=getAllAllocEmails();
  const regCounts={};
  actNames.forEach(an=>{regCounts[an]=0;});
  allNeReg.forEach(ne=>{
    const eff=getEffectiveAllocOnDate(ne,di,engMapReg);
    if(eff&&regCounts[eff]!==undefined)regCounts[eff]++;
  });

  // v64: Remove activities with zero allocated pupils — these are ghost entries
  // (activity is scheduled on this date but nobody is assigned to it)
  const visibleActs=actNames.filter(an=>regCounts[an]>0);
  if(!visibleActs.length){el.appendChild(h("div",{className:"alert alert-info"},"No pupils allocated to any activity on "+d.label+". Check allocations or per-date overrides."));return;}
  if(!window._regAct||!visibleActs.includes(window._regAct))window._regAct=visibleActs[0];

  const actTabBar=h("div",{style:{display:"flex",gap:"4px",flexWrap:"wrap",marginBottom:"16px",paddingBottom:"12px",borderBottom:"1px solid var(--border)"}});
  visibleActs.forEach(an=>{
    const col=gc(an);
    const cnt=regCounts[an]||0;
    actTabBar.appendChild(h("button",{
      className:"btn "+(window._regAct===an?"btn-primary":"btn-ghost"),
      style:{fontSize:"11px",borderLeft:"3px solid "+col},
      onClick:()=>{window._regAct=an;const m=document.querySelector(".main");if(m){const sy=m.scrollTop||window.scrollY;m.innerHTML="";renderRegisters(m);requestAnimationFrame(()=>{const tw=m.querySelector(".table-wrap");if(tw)tw.scrollTop=0;window.scrollTo(0,sy);});}}
    },an+" ("+cnt+")"));
  });
  el.appendChild(actTabBar);

  const actName=window._regAct;
  const act=findActByName_exact(actName);
  const raReq=act?(act.ra==="needed"||act.ra==="done"||act.ra==="existing"):false;

  // Build pupil list for this date+activity
  // Priority: per-date override > half-term override > engine result
  const pupilsForList=[];
  const seen=new Set();

  function addPupil(email){
    const ne=normEmail(email);
    if(seen.has(ne))return;
    seen.add(ne);
    const p=findPupilByEmail(email)||{};
    const attKey=di+"|"+actName+"|"+ne;
    const att=getAtt(attKey);
    pupilsForList.push({
      email:ne,
      surname:p.surname||"",
      forename:p.pref||p.forename||"",
      tutor:p.tutor||"",
      house:p.house||"",

  const ta=h("textarea",{rows:6,placeholder:"Tutor\tForename\tPreferred Forename\tSurname\tYear Group\tHouse\tStatus\tEmail\nSMITH\tJames\tJamie\tBrown\tYear 10\tSomerset\tBoarding\tjbrown@clayesmore.com",style:{marginBottom:"10px"}});
  importCard.appendChild(ta);
  importCard.appendChild(h("p",{style:{fontSize:"11px",color:"var(--text2)",marginBottom:"8px",padding:"8px 10px",background:"var(--surface2)",borderLeft:"3px solid var(--accent)",borderRadius:"4px"}},
    h("strong",null,"Two import modes: "),
    h("strong",{style:{color:"var(--accent)"}},"Add / Update (safe)"),
    " adds new pupils and updates existing ones — nobody gets removed. ",
    h("strong",{style:{color:"var(--amber)"}},"Full Sync"),
    " replaces the entire list with the paste, deleting anyone not in it — use only when pasting a complete MIS export."
  ));

  const btnRow=h("div",{className:"flex",style:{gap:"8px",flexWrap:"wrap"}});

  // Shared import logic — mode is "merge" (add/update only) or "sync" (replace whole list)
  function doPupilImport(mode){
    const raw=ta.value.trim();
    if(!raw){toast("Nothing to import","err");return;}
    const lines=raw.split("\n").filter(l=>l.trim());
    if(lines.length<2){toast("Need at least a header row and one data row","err");return;}
    const sep=lines[0].includes("\t")?"\t":",";
    // Detect column order from header
    const header=lines[0].split(sep).map(x=>x.replace(/^"|"$/g,"").trim().toLowerCase());
    const colMap={
      tutor:["tutor","form","form tutor","tutor group","reg","registration","pastoral tutor","form teacher"],
      forename:["forename","first name","firstname","given name","christian name","preferred forename","first"],
      pref:["preferred forename","preferred name","preferred","pref","known as","goes by","nickname","preferred first name"],
      surname:["surname","last name","lastname","family name","last"],
      yg:["year group","year","form year","yeargroup","nc year","yr group","yr grp","year grp","reg group","registration group","form group","academic year","year of entry","yg","yr","y group"],
      house:["house","boarding house","house group","pastoral house"],
      status:["status","boarding status","day/boarding","board/day","type","pupil type"],
      email:["email","email address","e-mail","e mail","school email","pupil email"],
      acctCode:["account code","account","billing code","acct code","acct","isams code","mis code"]
    };
    function findCol(keys){
      for(const k of keys){const idx=header.indexOf(k);if(idx>=0)return idx;}
      return -1;
    }
    const ci={
      tutor:findCol(colMap.tutor),
      forename:findCol(colMap.forename),
      pref:findCol(colMap.pref),
      surname:findCol(colMap.surname),
      yg:findCol(colMap.yg),
      house:findCol(colMap.house),
      status:findCol(colMap.status),
      email:findCol(colMap.email),
      acctCode:findCol(colMap.acctCode)
    };

    // Fallback: assume positional order if no headers match
    // Order: Tutor(0) Forename(1) Preferred(2) Surname(3) YG(4) House(5) Status(6) Email(7)
    if(ci.email<0&&ci.surname<0){
      ci.tutor=0;ci.forename=1;ci.pref=2;ci.surname=3;ci.yg=4;ci.house=5;ci.status=6;ci.email=7;
    }

    const imported=[];
    lines.slice(1).forEach(l=>{
      const c=l.split(sep).map(x=>x.replace(/^"|"$/g,"").trim());
      if(c.length<2)return;

      if(!choosers.length){
        reportDiv.appendChild(h("div",{className:"alert alert-info mb-8"},half+": No pupils chose "+actName+" as 1st choice."));

      }
      const card=h("div",{className:"card mb-16"});
      card.appendChild(h("div",{className:"card-header flex-between"},

        const acctCode=p.acctCode||"";
        if(!acctCode)missingCodes.push(name);

        const actDateMap={};
        activeDates.forEach(({d,di})=>{
          const eff=_disbCache.get(ne+"|"+di);
          if(!eff)return;
          const act=findActByName_exact(eff);
          if(!act)return;
          const cost=parseFloat(String(act.cost||"0").replace(/[\xa3$,]/g,""))||0;
          if(cost<=0)return;
          // External providers (staff role "ext") invoice the school separately — never disbursed to pupils
          const leadStaff=staff.find(s=>s.c===act.lead);
          if(leadStaff&&leadStaff.r==="ext")return;
          const att=getAtt(di+"|"+eff+"|"+ne);
          if(!actDateMap[eff])actDateMap[eff]={act,dates:[]};
          actDateMap[eff].dates.push({di,d,att});
        });

        Object.entries(actDateMap).forEach(([actName,info])=>{
          const act=info.act,actDates=info.dates;
          const cost=parseFloat(String(act.cost||"0").replace(/[\xa3$,]/g,""))||0;
          const scope=act.billingScope||"per_date";
          const mode=effectiveMode(act);
          const actSess=act.sess||"A+B";

          function dateBillable(att){
            if(mode==="enrolled")return true;
            const checkA=actSess==="A+B"||actSess==="A";
            const checkB=actSess==="A+B"||actSess==="B";
            if(checkA&&isAttended(att.a))return true;
            if(checkB&&isAttended(att.b))return true;
            return false;
          }

          let amount=0,billableDates=0;
          const totalDates=actDates.length;

          if(scope==="per_block"){
            const anyBillable=actDates.some(({att})=>dateBillable(att));
            if(mode==="enrolled"||anyBillable){
              amount=cost;
              billableDates=mode==="enrolled"?totalDates:actDates.filter(({att})=>dateBillable(att)).length;
            }
          } else {
            billableDates=actDates.filter(({att})=>dateBillable(att)).length;
            amount=cost*billableDates;
          }

          if(amount<=0)return;
          const iSAMSDesc=buildDesc(actName,halfFilter,scope,billableDates,actDates);
          disbRows.push({acctCode,name,iSAMSDesc,actName,amount,billableDates,totalDates,costUnit:cost,scope,mode,halfFilter,modeAuto:!act.billingMode});
        });
      });

      disbRows.sort((a,b)=>a.name.localeCompare(b.name)||a.actName.localeCompare(b.actName));

      if(missingCodes.length>0){
        const warnCard=h("div",{className:"alert alert-warn mb-12",style:{fontSize:"11px"}});
        warnCard.appendChild(h("strong",null,"\u26A0 "+missingCodes.length+" pupils included with no account code \u2014 manual entry or re-import of codes required:"));
        warnCard.appendChild(h("div",{style:{marginTop:"4px",color:"var(--text2)"}},missingCodes.slice(0,12).join(", ")+(missingCodes.length>12?" + "+(missingCodes.length-12)+" more":"")));
        disbDiv.appendChild(warnCard);
      }

      if(!disbRows.length){disbDiv.appendChild(h("div",{className:"alert alert-info"},"No billable activities for "+halfFilter+"."));return;}

      const totalAmount=disbRows.reduce((s,r)=>s+r.amount,0);
      const missingTotal=disbRows.filter(r=>!r.acctCode).reduce((s,r)=>s+r.amount,0);
      disbDiv.appendChild(h("div",{className:"alert alert-success mb-12",style:{fontSize:"12px"}},
        "💰 "+disbRows.length+" line items \u00b7 total: \xa3"+totalAmount.toFixed(2)
        +(missingTotal>0?"  (\xa3"+missingTotal.toFixed(2)+" needs account code)":"")));

      const card=h("div",{className:"card"});
      const tw=h("div",{style:{overflow:"auto",maxHeight:"45vh"}});
      const t=h("table",{style:{fontSize:"11px"}});
      t.appendChild(h("thead",null,h("tr",null,...["Code","Pupil","iSAMS Description","Billing","Mode","Dates","\xa3/unit","Total"].map(x=>h("th",null,x)))));
      const tb=h("tbody",null);
      disbRows.forEach(r=>{
        const noCode=!r.acctCode;
        const modeCol=r.mode==="enrolled"?"var(--purple)":"var(--text3)";
        const modeLabel=(r.mode==="enrolled"?"Enrolled":"Attendance")+(r.modeAuto?" (auto)":"");
        const datesLabel=r.scope==="per_block"?"flat ("+r.totalDates+" days)":r.billableDates+"/"+r.totalDates+" Sat";
        tb.appendChild(h("tr",{style:{background:noCode?"var(--red-soft)":""}},
          h("td",{style:{fontFamily:"var(--mono)",fontSize:"10px",color:noCode?"var(--red)":"",fontWeight:noCode?"700":""}},r.acctCode||"MISSING"),
          h("td",{style:{fontWeight:500}},r.name),
          h("td",{style:{fontSize:"10px"}},r.iSAMSDesc),
          h("td",{style:{fontSize:"10px",color:"var(--text3)"}},r.scope==="per_block"?"Block":"Per date"),
          h("td",{style:{fontSize:"10px",color:modeCol}},modeLabel),
          h("td",{style:{textAlign:"center",fontSize:"10px"}},datesLabel),
          h("td",{style:{textAlign:"right"}},"\xa3"+r.costUnit.toFixed(2)),
          h("td",{style:{textAlign:"right",fontWeight:600,color:noCode?"var(--red)":""}},"\xa3"+r.amount.toFixed(2))
        ));
      });
      t.appendChild(tb);tw.appendChild(t);card.appendChild(tw);
      card.appendChild(h("div",{style:{padding:"8px 14px",borderTop:"1px solid var(--border)",display:"flex",gap:"8px",flexWrap:"wrap"}},
        h("button",{className:"btn btn-primary btn-sm",onClick:()=>{
          const hdr="Account Code\tPupil Name\tDescription\tAmount";
          const rows=disbRows.map(r=>[r.acctCode||"",r.name,r.iSAMSDesc,r.amount.toFixed(2)].join("\t"));
          navigator.clipboard.writeText(hdr+"\n"+rows.join("\n")).then(()=>toast("Copied "+disbRows.length+" rows"+(missingCodes.length?" — "+missingCodes.length+" blank codes need manual entry":"")));
        }},"📋 Copy 4-col (iSAMS)"),
        h("button",{className:"btn btn-ghost btn-sm",onClick:()=>{
          const hdr="Account Code\tPupil Name\tActivity\tiSAMS Description\tBilling\tMode\tBillable Dates\tTotal Dates\tUnit \xa3\tTotal \xa3\tHalf";
          const rows=disbRows.map(r=>[r.acctCode||"MISSING",r.name,r.actName,r.iSAMSDesc,r.scope,r.mode,r.billableDates,r.totalDates,r.costUnit.toFixed(2),r.amount.toFixed(2),r.halfFilter].join("\t"));
          navigator.clipboard.writeText(hdr+"\n"+rows.join("\n")).then(()=>toast("Audit export copied"));
        }},"📋 Audit export"),
        h("span",{style:{fontSize:"11px",color:"var(--text3)",marginLeft:"auto"}},"Total: \xa3"+totalAmount.toFixed(2))
      ));
      disbDiv.appendChild(card);
    }});
    disbBtn.textContent="Generate Disbursement";
    el.appendChild(disbBtn);
    el.appendChild(disbDiv);
  }
}

function generateRASheet(actName,dateIdx){
  const out=document.getElementById("ra-output");if(!out)return;out.innerHTML="";
  const act=findActByName_exact(actName);if(!act)return;
  // Get allocated pupils
  if(!allocRes){out.appendChild(h("div",{className:"alert alert-warn"},"Run allocation first."));return;}
  // Determine which half-terms this activity runs in
  let relevantHalves=[];
  if(dateIdx!==""){
    relevantHalves=[dates[Number(dateIdx)]?.half];
  }else{
    relevantHalves=[...new Set(act.di.map(i=>dates[i]?.half).filter(Boolean))];
  }
  const matchedEmails=new Set();
  // Use shared allocation helpers to respect per-date and half-term overrides
  const raEngMap=buildEngMap();
  const raAllNe=getAllAllocEmails();
  if(dateIdx!==""){
    // Specific date: use getEffectiveAllocOnDate
    const di=Number(dateIdx);
    raAllNe.forEach(ne=>{
      const eff=getEffectiveAllocOnDate(ne,di,raEngMap);
      if(eff===actName)matchedEmails.add(ne);
    });
  } else {
    // All dates: check each date the activity runs on
    act.di.forEach(di=>{
      raAllNe.forEach(ne=>{
        const eff=getEffectiveAllocOnDate(ne,di,raEngMap);
        if(eff===actName)matchedEmails.add(ne);
      });
    });
  }
  const pupilList=[...matchedEmails].map(ne=>{
    const p=findPupilByEmail(ne);
    return{email:ne,forename:p?(p.pref||p.forename||""):"",surname:p?(p.surname||""):"",yg:p?(p.yg||""):"",house:p?(p.house||""):"",med:p?(p.med||""):"",diet:p?(p.diet||""):"",status:p?(p.status||""):""};
  }).sort(cmpPupilYgSurname);

  const leader=act.lead?staff.find(s=>s.c===act.lead):null;
  // Header info
  const info=h("div",{className:"card card-pad mb-12"});
  info.appendChild(h("div",{style:{fontWeight:700,fontSize:"15px",color:gc(actName),marginBottom:"8px"}},actName));
  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"auto 1fr",gap:"4px 12px",fontSize:"12px"}});
  [["Venue:",act.v||"TBC"],["Group Leader:",leader?(leader.n+" ("+leader.c+")"):"TBC"],["Dates:",dateIdx!==""?dates[Number(dateIdx)]?.label:act.di.map(i=>dates[i]?.label).join(", ")],
   ["Session:",act.sess||"A+B"],["Transport:",act.mb?"Minibus":"N/A"],["RA Status:",act.ra||"—"],["Provider RA:",act.provRA||"N/A"]
  ].forEach(([l,v])=>{grid.appendChild(h("div",{style:{color:"var(--text3)",fontWeight:500}},l));grid.appendChild(h("div",null,v));});
  info.appendChild(grid);out.appendChild(info);

  // Pupil table
  const card=h("div",{className:"card"});
  const hdr=h("div",{className:"card-header flex-between"});
  hdr.appendChild(h("span",{className:"card-title"},pupilList.length+" pupils"));
  hdr.appendChild(h("button",{className:"btn btn-ghost btn-sm",onClick:()=>{
    const header="Surname\tForename\tYear\tHouse\tDay/Boarder\tMedical\tDietary";
    const rows=pupilList.map(p=>[p.surname,p.forename,p.yg,p.house,p.status,p.med,p.diet].join("\t"));
    navigator.clipboard.writeText(actName+" — Pupil List for RA\n"+header+"\n"+rows.join("\n")).then(()=>toast("Pupil list copied"));
  }},"📋 Copy for RA"));
  card.appendChild(hdr);
  const tw=h("div",{style:{overflow:"auto"}});
  const t=h("table",null);
  t.appendChild(h("thead",null,h("tr",null,...["Surname","Forename","Year","House","Day/Board","Medical","Dietary"].map(x=>h("th",null,x)))));
  const tb=h("tbody",null);
  pupilList.forEach(p=>{
    tb.appendChild(h("tr",null,
      h("td",{style:{fontWeight:600}},p.surname),h("td",null,p.forename),h("td",null,displayYg(p.yg)),h("td",null,p.house),h("td",null,p.status),
      h("td",{style:{fontSize:"11px",color:p.med?"var(--red)":"var(--text3)",maxWidth:"200px",whiteSpace:"normal"}},p.med||"—"),
      h("td",{style:{fontSize:"11px",color:p.diet?"var(--amber)":"var(--text3)",maxWidth:"200px",whiteSpace:"normal"}},p.diet||"—")
    ));
  });
  t.appendChild(tb);tw.appendChild(t);card.appendChild(tw);out.appendChild(card);
}

  const allYgsForUrl=ygSort([...new Set(pupils.map(p=>p.yg).filter(Boolean))]);

  } else {

      row.appendChild(inp);
      ygGrid.appendChild(row);
    });

  el.appendChild(urlCard);

  const allocatedEmails=new Set([
    ...formData.map(f=>normEmail(f.email)),
    ...Object.keys(allocOverrides.s1||{}).map(normEmail),
    ...Object.keys(allocOverrides.s2||{}).map(normEmail),
    ...Object.keys(allocDateOverrides).map(k=>k.split("|")[1]).filter(Boolean),

  // Build set of emails that have a manual override (for missing submissions exclusion)
  const overriddenEmails=new Set([
    ...Object.keys(allocOverrides.s1||{}).map(normEmail),
    ...Object.keys(allocOverrides.s2||{}).map(normEmail),

  }else if(formData.length===0){
    el.appendChild(h("div",{className:"alert alert-warn mb-12"},"No form data loaded yet — paste responses in the Allocate tab first."));
  }else{
    const missByYg={};
    missingPupils.forEach(p=>{const yg=p.yg||"Unknown";if(!missByYg[yg])missByYg[yg]=[];missByYg[yg].push(p);});
    ygSort(Object.keys(missByYg)).forEach(yg=>{
      const ygPupils=missByYg[yg].sort((a,b)=>(a.surname||"").localeCompare(b.surname||""));
      const formUrl=localStorage.getItem(formUrlBaseKey+"-"+yg.replace(/\s+/g,""))||localStorage.getItem(formUrlBaseKey)||"";

      const btnRow=h("div",{className:"flex mb-8",style:{gap:"6px",flexWrap:"wrap",alignItems:"center"}});

      btnRow.appendChild(h("button",{className:"btn btn-ghost btn-sm",onClick:()=>{
        const emails=ygPupils.map(p=>p.email).filter(Boolean).join(", ");
        let msg="Dear pupil,\n\nYou have not yet submitted your LEX activity choices for Summer Term. Please complete the form as soon as possible.";
        if(formUrl)msg+="\n\nForm link: "+formUrl;
        if(guidanceUrl)msg+="\nGuidance booklet: "+guidanceUrl;
        msg+="\n\nThank you.";
        navigator.clipboard.writeText(emails+"\n\n"+msg).then(()=>toast(ygPupils.length+" emails + message copied"));
      }},"📋 Copy Pupil Emails + Message"));
      // Tutor email button — look up full staff email from staff records
      const tutorCodes=[...new Set(ygPupils.map(p=>p.tutor).filter(Boolean))];
      if(tutorCodes.length>0){
        btnRow.appendChild(h("button",{className:"btn btn-ghost btn-sm",onClick:()=>{
          // Look up full email from staff records (staff.email field), fall back to code

          }).join(", ");
          const names=ygPupils.map(p=>((p.pref||p.forename||"")+" "+(p.surname||"")).trim()+" (Tutor: "+(p.tutor||"?")+" / "+displayYg(yg)+")").join(", ");

          if(formUrl)msg+="\n\nForm: "+formUrl;
          navigator.clipboard.writeText(tEmails+"\n\n"+msg).then(()=>toast("Tutor emails copied for "+displayYg(yg)));
        }},"📋 Copy Tutor Emails"));

      const pupilList=h("div",{style:{fontSize:"11px",color:"var(--text2)",lineHeight:"1.8"}});
      ygPupils.forEach(p=>{
        const name=((p.pref||p.forename||"")+" "+(p.surname||"")).trim();

        pupilList.appendChild(h("span",{style:{marginRight:"12px",display:"inline-block"}},name+tutorStr));
      });
      card.appendChild(pupilList);
      el.appendChild(card);
    });
    // Copy all missing
    el.appendChild(h("button",{className:"btn btn-primary mb-16",onClick:()=>{
      const allEmails=missingPupils.map(p=>p.email).filter(Boolean).join(", ");
      const guidanceUrl=localStorage.getItem(guidanceUrlKey)||"";
      // Use generic form URL (no per-YG for "all")
      const formUrl=localStorage.getItem(formUrlBaseKey)||"";
      let msg="Dear pupil,\n\nYou have not yet submitted your LEX activity choices for Summer Term. Please complete the form as soon as possible so we can allocate you to your preferred activities.";
      if(formUrl)msg+="\n\nForm link: "+formUrl;
      if(guidanceUrl)msg+="\nGuidance booklet: "+guidanceUrl;
      msg+="\n\nThank you.";
      navigator.clipboard.writeText(allEmails+"\n\n"+msg).then(()=>toast("All "+missingPupils.length+" emails + message copied"));
    }},"📋 Copy All Missing Emails + Reminder Message"));
  }

  // ── Missing / Unassigned Allocations ──────────────────────────────────────
  el.appendChild(h("hr",{className:"section-divider"}));
  el.appendChild(h("div",{style:{fontWeight:700,fontSize:"14px",marginBottom:"4px"}},"Missing or Unassigned Allocations"));
  el.appendChild(h("p",{style:{fontSize:"11px",color:"var(--text3)",marginBottom:"12px"}},"Pupils who have at least one LEX date where they have no effective allocation (no engine result, no override, or explicitly unassigned). Each row shows the specific dates affected and gives three one-click copy buttons."));

  // House → HP mapping (persisted to localStorage, editable inline)
  const hpMapKey="lex12-hp-map";
  let hpMap={};try{hpMap=JSON.parse(localStorage.getItem(hpMapKey)||"{}");}catch(e){hpMap={};}
  const houseNames=["M","G","D","K","W"];
  const hpCard=h("div",{className:"card card-pad mb-16"});

  hpCard.appendChild(h("p",{style:{fontSize:"11px",color:"var(--text3)",marginBottom:"8px"}},"Enter HP and AHP email addresses, separated by commas. All will be included in the linked-staff copy button below. Leave blank to omit."));

    row.appendChild(inp);hpGrid.appendChild(row);
  });
  hpCard.appendChild(hpGrid);
  el.appendChild(hpCard);

  // Build per-pupil missing allocation detail
  (()=>{
    if(!allocRes&&Object.keys(allocDateOverrides).length===0){
      el.appendChild(h("div",{className:"alert alert-info mb-16",style:{fontSize:"11px"}},"Run allocation first before checking for missing assignments."));
      return;
    }
    const guidanceUrl=localStorage.getItem("lex12-guidanceurl")||"";
    // LEX dates only (S1/S2/LEX Week — not half-terms with no activities)
    const lexDates=dates.map((d,i)=>({...d,di:i})).filter(d=>HALF_TERMS.includes(d.half));
    if(lexDates.length===0){el.appendChild(h("div",{className:"alert alert-info mb-16",style:{fontSize:"11px"}},"No LEX dates configured."));return;}

    // For each pupil, find which dates have no effective allocation
    // Pre-compute allocations once for all pupils × dates (collapses ~3,800 calls to one batch)
    const _missCache=buildAllocCache(pupils.filter(p=>p.email).map(p=>normEmail(p.email)),lexDates.map(d=>d.di));
    const missingMap=[]; // [{pupil, missingDates:[{date,half}], missingHalves:Set}]
    pupils.forEach(p=>{
      if(!p.email)return;
      const ne=normEmail(p.email);
      const missingDates=[];
      lexDates.forEach(d=>{
        const eff=_missCache.get(ne+"|"+d.di);
        if(!eff)missingDates.push({label:d.label,half:d.half,di:d.di});
      });
      if(missingDates.length>0){
        const missingHalves=new Set(missingDates.map(d=>d.half));
        missingMap.push({pupil:p,ne,missingDates,missingHalves});
      }

    const engMap=buildEngMap();
    const changes=[]; // {name, email, yg, house, half, engineAct, currentAct}
    // Check each half-term
    const halfOrder=[];const seenH=new Set();
    sortedDateIndices().forEach(di=>{const d=dates[di];const hv=d.half||"S1";if(!seenH.has(hv)){seenH.add(hv);halfOrder.push(hv);}});
    halfOrder.forEach(half=>{
      const halfDi=dates.map((_,i)=>i).filter(i=>(dates[i].half||"S1")===half);
      if(!halfDi.length)return;
      const di0=halfDi[0]; // representative date for the half
      const allNe=getAllAllocEmails();
      allNe.forEach(ne=>{
        const engineAct=engMap[ne+"|"+half]||null;
        const currentAct=getEffectiveAllocOnDate(ne,di0,engMap);
        if(engineAct!==currentAct&&(engineAct||currentAct)){
          const p=findPupilByEmail(ne)||{};
          changes.push({name:((p.pref||p.forename||"")+" "+(p.surname||"")).trim()||ne,email:p.email||ne,
            yg:p.yg||"",house:p.house||"",half,from:engineAct||"(unallocated)",to:currentAct||"(unassigned)"});
        }
      });
    });
    if(!changes.length){notifyOutput.appendChild(h("div",{className:"alert alert-success"},"No changes detected — all allocations match engine results."));return;}
    // Group by destination activity
    const byDest={};
    changes.forEach(c=>{const k=c.to+"|"+c.half;if(!byDest[k])byDest[k]={act:c.to,half:c.half,pupils:[]};byDest[k].pupils.push(c);});
    // Display
    const summary=h("div",{className:"card card-pad mb-12"});
    summary.appendChild(h("div",{style:{fontWeight:700,marginBottom:"8px"}},changes.length+" allocation change"+(changes.length>1?"s":"")+" detected"));
    Object.values(byDest).sort((a,b)=>a.act.localeCompare(b.act)).forEach(group=>{
      const sec=h("div",{style:{marginBottom:"12px",padding:"8px 10px",background:gc(group.act)+"10",borderLeft:"3px solid "+gc(group.act),borderRadius:"4px"}});
      sec.appendChild(h("div",{style:{fontWeight:600,color:gc(group.act),marginBottom:"4px"}},group.act+" — "+halfLabel(group.half)+" ("+group.pupils.length+" pupils)"));
      group.pupils.sort((a,b)=>a.name.localeCompare(b.name)).forEach(p=>{
        sec.appendChild(h("div",{style:{fontSize:"11px",marginLeft:"8px"}},p.name+" — was: "+p.from));
      });
      summary.appendChild(sec);
    });
    notifyOutput.appendChild(summary);
    // Generate email text
    let emailText="LEX Allocation Changes — "+new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})+"\n\n";
    Object.values(byDest).sort((a,b)=>a.act.localeCompare(b.act)).forEach(group=>{
      emailText+=group.act+" ("+halfLabel(group.half)+"):\n";
      group.pupils.forEach(p=>{emailText+="  • "+p.name+" (was: "+p.from+")\n";});
      emailText+="\n";
    });
    // Email addresses
    const allEmails=changes.map(c=>c.email).filter(Boolean);
    const uniqueEmails=[...new Set(allEmails)];
    emailText+="Affected pupil email addresses ("+uniqueEmails.length+"):\n"+uniqueEmails.join("; ")+"\n";
    notifyOutput.appendChild(h("div",{className:"flex",style:{gap:"8px",flexWrap:"wrap"}},
      h("button",{className:"btn btn-primary btn-sm",onClick:()=>{
        navigator.clipboard.writeText(emailText).then(()=>toast("Change report copied to clipboard"));
      }},"📋 Copy Report"),
      h("button",{className:"btn btn-ghost btn-sm",onClick:()=>{
        navigator.clipboard.writeText(uniqueEmails.join("; ")).then(()=>toast(uniqueEmails.length+" email addresses copied"));
      }},"📧 Copy Email Addresses"),
      h("button",{className:"btn btn-ghost btn-sm",onClick:()=>{
        const mailto="mailto:?bcc="+encodeURIComponent(uniqueEmails.join(","))+"&subject="+encodeURIComponent("LEX Allocation Update")+"&body="+encodeURIComponent("Dear pupil,\n\nYour LEX activity allocation has been updated. Please check your timetable at:\nhttps://gking-lex.github.io/LEX-Clayesmore/?view=timetable\n\nPlease speak to Mr King if you have any questions.\n\nBest wishes,\nLEX Team");
        window.open(mailto);
      }},"✉ Open Email Draft")
    ));
  }},"Generate Change Report"));
  el.appendChild(notifyOutput);
}

function generateFridayNotice(di){
  const out=document.getElementById("notice-output");if(!out)return;out.innerHTML="";
  const d=dates[di];if(!d)return;
  const abd=actsByDate();
  const dayActs=(abd[di]||[]).sort();
  if(!dayActs.length){out.appendChild(h("div",{className:"alert alert-info"},"No activities on this date."));return;}

  // Build engMap once — used by both the activity email cards and missing allocations
  const engMap=buildEngMap();

  // Resolve all pupil allocations for this date
  const pupilsByAct={};
  pupils.forEach(p=>{
    if(!p.email)return;
    const ne=normEmail(p.email);
    const eff=getEffectiveAllocOnDate(ne,di,engMap);
    if(eff){if(!pupilsByAct[eff])pupilsByAct[eff]=[];pupilsByAct[eff].push(p);}
  });

  const lines=[];
  lines.push("LEX — "+d.label+" ("+halfLabel(d.half||"S1")+")");
  if(d.note)lines.push("Note: "+d.note);
  lines.push("");
  dayActs.forEach(actName=>{
    const act=findActByName_exact(actName);
    if(!act)return;
    const venue=act.v&&act.v!=="TBC"?act.v:"venue TBC";
    const leader=act.lead?staff.find(s=>s.c===act.lead):null;
    const leaderStr=leader?leader.n:"staff TBC";
    const note=act.notes||"";
    let line=act.n+" — "+venue+" ("+leaderStr+")";
    if(note)line+=" — "+note;
    lines.push(line);
  });

  const preview=h("div",{style:{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"14px",fontFamily:"var(--mono)",fontSize:"12px",lineHeight:"1.8",whiteSpace:"pre-wrap"}});
  preview.textContent=lines.join("\n");
  out.appendChild(preview);
  out.appendChild(h("button",{className:"btn btn-primary mt-8",onClick:()=>{
    navigator.clipboard.writeText(lines.join("\n")).then(()=>toast("Friday notice copied"));
  }},"📋 Copy Notice"));

  // ── Per-activity email cards ──
  const emailCard=h("div",{className:"card card-pad mt-12"});
  emailCard.appendChild(h("div",{style:{fontWeight:700,fontSize:"13px",marginBottom:"4px"}},"📧 Email Pupils by Activity — "+d.label));
  emailCard.appendChild(h("p",{style:{fontSize:"11px",color:"var(--text3)",marginBottom:"10px"}},"Click to open your mail client with all pupils BCC'd, or copy the email list."));
  const emailGrid=h("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}});
  dayActs.forEach(actName=>{
    const act=findActByName_exact(actName);
    if(!act)return;
    const actPupils=(pupilsByAct[actName]||[]).sort((a,b)=>(a.surname||"").localeCompare(b.surname||""));
    const emails=actPupils.map(p=>p.email).filter(Boolean);
    const venue=act.v&&act.v!=="TBC"?act.v:"";
    const leader=act.lead?staff.find(s=>s.c===act.lead):null;
    const row=h("div",{style:{display:"flex",alignItems:"center",gap:"8px",padding:"6px 8px",background:"var(--surface2)",borderRadius:"6px",flexWrap:"wrap"}});
    row.appendChild(h("span",{style:{fontWeight:600,fontSize:"12px",color:gc(actName),minWidth:"140px"}},actName));
    if(venue)row.appendChild(h("span",{style:{fontSize:"10px",color:"var(--text3)"}},venue));
    row.appendChild(h("span",{style:{fontSize:"11px",color:"var(--text2)",marginLeft:"auto",whiteSpace:"nowrap"}},emails.length+" pupil"+(emails.length!==1?"s":"")));
    if(emails.length>0){
      row.appendChild(h("a",{href:"mailto:?bcc="+encodeURIComponent(emails.join(",")),
        className:"btn btn-primary btn-xs",style:{textDecoration:"none",whiteSpace:"nowrap"}},"📧 Email"));
      row.appendChild(h("button",{className:"btn btn-ghost btn-xs",style:{whiteSpace:"nowrap"},onClick:()=>{
        navigator.clipboard.writeText(emails.join(", ")).then(()=>toast(emails.length+" emails copied for "+actName));
      }},"📋 Copy"));
      // Also copy names list
      row.appendChild(h("button",{className:"btn btn-ghost btn-xs",style:{whiteSpace:"nowrap"},onClick:()=>{
        const nameList=actPupils.map(p=>(p.pref||p.forename||"")+" "+(p.surname||"")).join("\n");
        navigator.clipboard.writeText(actName+" — "+d.label+"\n"+nameList).then(()=>toast(actPupils.length+" names copied"));
      }},"👤 Names"));
    } else {
      row.appendChild(h("span",{style:{fontSize:"10px",color:"var(--amber)"}},"No pupils allocated"));
    }
    emailGrid.appendChild(row);
  });
  emailCard.appendChild(emailGrid);
  out.appendChild(emailCard);

  // ── Missing allocations on this specific date ──
  const missingOnDate=[];
  pupils.forEach(p=>{
    if(!p.email)return;
    const ne=normEmail(p.email);
    const eff=getEffectiveAllocOnDate(ne,di,engMap);
    if(!eff)missingOnDate.push(p);
  });
  if(missingOnDate.length===0){
    out.appendChild(h("div",{className:"alert alert-success mt-12",style:{fontSize:"12px"}},"✓ All "+pupils.length+" pupils have an allocation on "+d.label+"."));
  } else {
    const missCard=h("div",{className:"card card-pad mt-12"});
    missCard.appendChild(h("div",{style:{fontWeight:700,fontSize:"13px",color:"var(--red)",marginBottom:"6px"}},"⚠ "+missingOnDate.length+" pupil"+(missingOnDate.length!==1?"s":"")+" missing an allocation on "+d.label));
    const byYg={};
    missingOnDate.forEach(p=>{const yg=p.yg||"Unknown";if(!byYg[yg])byYg[yg]=[];byYg[yg].push(p);});
    ygSort(Object.keys(byYg)).forEach(yg=>{
      const yps=byYg[yg].sort((a,b)=>(a.surname||"").localeCompare(b.surname||""));
      missCard.appendChild(h("div",{style:{fontWeight:600,fontSize:"12px",marginTop:"8px",marginBottom:"4px",color:"var(--text2)"}},displayYg(yg)+" ("+yps.length+")"));
      const tbl=h("table",{style:{width:"100%",fontSize:"11px"}});
      tbl.appendChild(h("thead",null,h("tr",null,
        h("th",{style:{padding:"2px 6px"}},"Name"),
        h("th",{style:{padding:"2px 6px"}},"House"),
        h("th",{style:{padding:"2px 6px"}},"Tutor"),
        h("th",{style:{padding:"2px 6px"}},"Override?"))));
      const tb=h("tbody",null);
      yps.forEach(p=>{
        const ne=normEmail(p.email);
        const half=(d.half||"S1").toLowerCase();
        const hasHalfOvr=!!(allocOverrides[half]||{})[ne];
        const hasDateOvr=!!allocDateOverrides[di+"|"+ne];
        const hasEngine=!!(engMap[ne+"|"+(d.half||"S1")]);
        let source="No allocation";
        if(hasDateOvr)source="Date ovr (act not on this date)";
        else if(hasHalfOvr)source="Half ovr (act not on this date)";
        else if(hasEngine)source="Engine (act not on this date)";
        tb.appendChild(h("tr",null,
          h("td",{style:{padding:"2px 6px",fontWeight:500}},(p.pref||p.forename||"")+" "+(p.surname||"")),
          h("td",{style:{padding:"2px 6px"}},(p.house||"").toUpperCase()),
          h("td",{style:{padding:"2px 6px",fontFamily:"var(--mono)"}},p.tutor||"—"),
          h("td",{style:{padding:"2px 6px",fontSize:"10px",color:"var(--text3)"}},source)));
      });
      tbl.appendChild(tb);missCard.appendChild(tbl);
    });
    // Bulk copy emails
    missCard.appendChild(h("button",{className:"btn btn-ghost btn-sm mt-8",onClick:()=>{
      const emails=missingOnDate.map(p=>p.email).filter(Boolean).join(", ");
      navigator.clipboard.writeText(emails).then(()=>toast(missingOnDate.length+" missing pupil emails copied"));
    }},"📧 Copy all missing pupil emails"));
    out.appendChild(missCard);
  }
}

function renderVenues(el){
  el.appendChild(h("div",{className:"page-header"},h("h2",null,"Venues"),h("p",null,"Venue directory and booking calendar with session details.")));
  if(!window._venuesSub)window._venuesSub="calendar";
  const subNav=h("div",{className:"flex mb-16",style:{gap:"4px"}});
  const vContent=h("div",null);
  function rebuildVenues(){
    vContent.innerHTML="";
    Array.from(subNav.children).forEach(b=>{b.className="btn "+(b.getAttribute("data-sub")===window._venuesSub?"btn-primary":"btn-ghost");});
    if(window._venuesSub==="calendar")renderVenueCalendar(vContent);
    else renderVenueDirectory(vContent);
  }
  [["calendar","📅 Booking Calendar"],["directory","🏫 Venue Directory"]].forEach(([id,label])=>{
    const b=h("button",{className:"btn "+(window._venuesSub===id?"btn-primary":"btn-ghost"),onClick:()=>{window._venuesSub=id;rebuildVenues();}},label);
    b.setAttribute("data-sub",id);subNav.appendChild(b);
  });
  el.appendChild(subNav);el.appendChild(vContent);rebuildVenues();
}
function renderVenueCalendar(el){
  const usedVenueNames=[...new Set(acts.flatMap(a=>getActVenues(a)))].sort();
  const unset=acts.filter(a=>(!a.v||a.v==="TBC")&&a.di.length>0);
  if(unset.length>0)el.appendChild(h("div",{className:"alert alert-warn mb-12"},"Venue TBC: "+unset.map(a=>a.n).join(", ")));
  const wrap=h("div",{className:"table-wrap scroll-table"});
  const tbl=h("table",null);
  const hr=h("tr",null,h("th",{className:"sticky-lt",style:{minWidth:"150px"}},"Venue"));
  sortedDateIndices().forEach(di=>{ const d=dates[di];
    const th2=h("th",{style:{minWidth:"160px",textAlign:"center",verticalAlign:"top"}});
    th2.appendChild(h("div",{style:{fontWeight:600}},d.label.replace("Sat ","")));
    th2.appendChild(h("div",{style:{fontSize:"10px",color:"var(--text3)"}},halfLabelShort(d.half)));
    if(d.note)th2.appendChild(h("div",{style:{fontSize:"9px",color:"var(--amber)"}},d.note));
    hr.appendChild(th2);
  });
  tbl.appendChild(h("thead",null,hr));
  const tbody=h("tbody",null);
  const allocByActHalf=getAllocByActHalf();
  usedVenueNames.forEach(venue=>{
    const vRec=getVenue(venue);
    const tr=h("tr",null);
    const nameTd=h("td",{className:"sticky-l",style:{verticalAlign:"top",padding:"7px 10px"}});
    nameTd.appendChild(h("div",{style:{fontWeight:600,fontSize:"12px"}},venue));
    if(vRec){
      if(vRec.staff)nameTd.appendChild(h("div",{style:{fontSize:"10px",color:"var(--text3)",fontFamily:"var(--mono)"}},vRec.staff));
      if(vRec.dept)nameTd.appendChild(h("div",{style:{fontSize:"10px",color:"var(--text3)"}},vRec.dept));
    }
    tr.appendChild(nameTd);
    sortedDateIndices().forEach(di=>{
      const actsHere=acts.filter(a=>getActVenues(a).includes(venue)&&a.di.includes(di));
      const td=h("td",{style:{padding:"5px 6px",verticalAlign:"top",
        background:actsHere.length>1?"var(--red-soft)":actsHere.length===1?gc(actsHere[0].n)+"12":"transparent"}});
      if(actsHere.length>1){
        td.appendChild(h("div",{style:{color:"var(--red)",fontWeight:700,fontSize:"10px"}},"⚠ CLASH"));
        actsHere.forEach(a=>{
          const allS=[a.lead,...(a.staff||[])].filter(Boolean);
          td.appendChild(h("div",{style:{fontSize:"10px",color:gc(a.n),fontWeight:600,marginTop:"2px"}},a.n));
          if(allS.length)td.appendChild(h("div",{style:{fontSize:"9px",color:"var(--text3)"}},allS.join(", ")));
        });
      } else if(actsHere.length===1){
        const a=actsHere[0];
        const allS=[a.lead,...(a.staff||[])].filter(Boolean);
        const allocHere=allocByActHalf[a.n+"|"+(dates[di]?dates[di].half:"")]||0;
        td.appendChild(h("div",{style:{color:gc(a.n),fontWeight:600,fontSize:"11px"}},a.n));
        td.appendChild(h("div",{style:{fontSize:"9px",color:"var(--text3)",marginTop:"1px"}},a.sess||"A+B"));
        if(allS.length)td.appendChild(h("div",{style:{fontSize:"9px",color:"var(--text2)",marginTop:"2px",fontFamily:"var(--mono)"}},allS.join(", ")));
        else td.appendChild(h("div",{style:{fontSize:"9px",color:"var(--amber)"}},"No staff"));
        if(a.cap){
          const capStr=allocHere+"/"+a.cap;const full=allocHere>=a.cap;
          td.appendChild(h("div",{style:{fontSize:"9px",color:full?"var(--red)":"var(--text3)",marginTop:"2px",fontWeight:full?700:400}},capStr));
        }
        // Venue dropdown to reassign (replaces this venue in multi-venue list)
        const vSel=h("select",{style:{width:"100%",fontSize:"9px",marginTop:"4px",color:"var(--text3)"},
          onChange:e=>{
            const cur=getActVenues(a);const ni=cur.indexOf(venue);
            if(ni>=0){cur[ni]=e.target.value;}else{cur.push(e.target.value);}
            a.v=[...new Set(cur)].join(", ");saveAll();
          }});
        allVenueNames().forEach(n=>{const o=h("option",{value:n},n);if(n===venue)o.selected=true;vSel.appendChild(o);});
        td.appendChild(vSel);
      } else {
        td.appendChild(h("span",{style:{color:"var(--green)",fontSize:"10px"}},"Free"));
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);wrap.appendChild(tbl);el.appendChild(wrap);
  el.appendChild(h("button",{className:"btn btn-ghost mt-8",onClick:()=>{
    const header="Venue\tStaff\tDept\t"+dates.map(d=>d.label.replace("Sat ","")).join("\t");
    const rows=usedVenueNames.map(v=>{
      const vRec=getVenue(v);
      const cells=dates.map((_,di)=>{const here=acts.filter(a=>getActVenues(a).includes(v)&&a.di.includes(di));return here.length?here.map(a=>a.n).join(" / "):"Free";});
      return v+"\t"+(vRec?vRec.staff:"")+"\t"+(vRec?vRec.dept:"")+"\t"+cells.join("\t");
    });
    navigator.clipboard.writeText("Venues Calendar\n"+header+"\n"+rows.join("\n")).then(()=>toast("Venues calendar copied"));
  }},"📋 Copy Venues Calendar"));
}
function renderVenueDirectory(el){
  el.appendChild(h("div",{style:{fontWeight:600,fontSize:"13px",marginBottom:"4px"}},venues.length+" venues in directory"));
  el.appendChild(h("p",{style:{fontSize:"11px",color:"var(--text3)",marginBottom:"12px"}},"Edit venue names (must exactly match what is typed in Activities), responsible staff, and department."));
  const btnRow=h("div",{className:"flex mb-12",style:{gap:"8px",flexWrap:"wrap",alignItems:"flex-start"}});
  btnRow.appendChild(h("button",{className:"btn btn-primary btn-sm",onClick:()=>{
    venues.push({id:"V"+Date.now().toString(36).toUpperCase(),name:"New Venue",staff:"",dept:""});
    saveAll();render();
  }},"+ Add Venue"));
  // CSV upload card
  const csvCard=h("div",{className:"card card-pad",style:{maxWidth:"500px"}});
  csvCard.appendChild(h("div",{style:{fontWeight:600,fontSize:"12px",marginBottom:"4px"}},"Import Venues from CSV / paste"));
  csvCard.appendChild(h("p",{style:{fontSize:"11px",color:"var(--text3)",marginBottom:"6px"}},"Columns: Name, Staff Code, Department. Existing venues with matching names are updated."));
  const vTa=h("textarea",{rows:4,placeholder:"Art\tDRP\tCreative Arts\nCricket Nets\tDOC\tSport",style:{marginBottom:"6px"}});
  csvCard.appendChild(vTa);
  csvCard.appendChild(h("button",{className:"btn btn-primary btn-sm",onClick:()=>{
    const raw=vTa.value.trim();if(!raw){toast("Nothing to import","err");return;}
    const lines=raw.split("\n").filter(l=>l.trim());
    const sep=lines[0].includes("\t")?"\t":",";
    let added=0,updated=0;
    // Skip header if first row looks like a header
    const startLine=lines[0].toLowerCase().includes("name")?1:0;
    lines.slice(startLine).forEach(l=>{
      const c=l.split(sep).map(x=>x.replace(/^"|"$/g,"").trim());
      if(!c[0])return;
      const name=c[0],staff=c[1]||"",dept=c[2]||"";
      const existing=venues.find(v=>v.name.trim().toLowerCase()===name.trim().toLowerCase());
      if(existing){existing.staff=staff||existing.staff;existing.dept=dept||existing.dept;updated++;}
      else{venues.push({id:"V"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,staff,dept});added++;}
    });
    saveAll();toast(added+" added, "+updated+" updated");render();
  }},"Import"));
  btnRow.appendChild(csvCard);
  el.appendChild(btnRow);
  const wrap=h("div",{className:"table-wrap scroll-table",style:{maxHeight:"65vh"}});
  const tbl=h("table",null);
  tbl.appendChild(h("thead",null,h("tr",null,...["Venue Name","Staff","Department / Owner","Used in Activities",""].map(x=>h("th",null,x)))));
  const tbody=h("tbody",null);
  const sorted=[...venues].sort((a,b)=>{const da=a.dept||"",db=b.dept||"";return da!==db?da.localeCompare(db):a.name.localeCompare(b.name);});
  let lastDept=null;
  sorted.forEach(v=>{
    const realIdx=venues.indexOf(v);
    const dept=v.dept||"";
    if(dept!==lastDept){
      tbody.appendChild(h("tr",null,h("td",{colSpan:5,style:{background:"var(--surface2)",fontWeight:700,fontSize:"11px",color:"var(--text2)",padding:"5px 10px"}},dept||"Uncategorised")));
      lastDept=dept;
    }
    const usedIn=acts.filter(a=>getActVenues(a).some(vn=>vn.trim().toLowerCase()===v.name.trim().toLowerCase())).map(a=>a.n);
    tbody.appendChild(h("tr",null,
      h("td",null,h("input",{value:v.name,style:{width:"150px",fontWeight:600},onInput:e=>{v.name=e.target.value;saveAll();}})),
      h("td",null,h("input",{value:v.staff||"",style:{width:"65px",fontFamily:"var(--mono)"},onInput:e=>{v.staff=e.target.value;saveAll();}})),
      h("td",null,h("input",{value:v.dept||"",style:{width:"145px"},onInput:e=>{v.dept=e.target.value;saveAll();}})),
      h("td",{style:{fontSize:"10px",color:"var(--text3)",maxWidth:"200px",whiteSpace:"normal"}},usedIn.length?usedIn.join(", "):h("span",{style:{color:"var(--border2)"}},"—")),
      h("td",null,h("button",{className:"btn btn-danger btn-xs",onClick:()=>{if(!confirm("Remove "+v.name+"?"))return;venues.splice(realIdx,1);saveAll();render();}},"✕"))
    ));
  });
  tbl.appendChild(tbody);wrap.appendChild(tbl);el.appendChild(wrap);
  el.appendChild(h("div",{className:"alert alert-info mt-12",style:{fontSize:"11px"}},"Venue names must match exactly what is typed in activity records."));
}

function getAdminReminders(){
  const now=new Date();const reminders=[];
  const daysBefore=(target,days)=>{const diff=Math.floor((target-now)/(86400000));return diff>=0&&diff<=days;};
  if(daysBefore(TERM_DATES.s1End,7))reminders.push({t:"warn",m:"Summer 1 ends in "+Math.floor((TERM_DATES.s1End-now)/86400000)+" days — update pupil lists and medical/dietary data before half-term."});
  if(daysBefore(TERM_DATES.s2Start,3))reminders.push({t:"info",m:"Summer 2 starts soon — check pupil lists and medical/dietary data are up to date."});
  if(daysBefore(TERM_DATES.s2End,7))reminders.push({t:"warn",m:"Summer 2 ends in "+Math.floor((TERM_DATES.s2End-now)/86400000)+" days — final check on pupil data and allocations."});
  if(daysBefore(TERM_DATES.springEnd,7))reminders.push({t:"info",m:"Spring term ending soon — archive term data in Settings > New Term if needed."});
  return reminders;
}

function renderChecks(el){
  const us=getUnstaffed();const cl=getClashes();const issues=[];
  acts.forEach(a=>{
    if(!a.cap&&a.di.length>0)issues.push({t:"warn",m:a.n+": Capacity TBC"});
    if(!a.lead&&a.di.length>0)issues.push({t:"warn",m:a.n+": Staff lead TBC"});
    if(a.di.length>0&&(!a.ra||a.ra==="needed"))issues.push({t:"warn",m:a.n+": Risk assessment "+(a.ra==="needed"?"additional RA needed":"status not set")});
    if(a.di.length>0&&a.provRA==="requested")issues.push({t:"info",m:a.n+": Provider RA requested but not yet received"});
  });
  Object.entries(us).forEach(([di,al])=>{al.forEach(a=>issues.push({t:"info",m:a+" on "+dates[di]?.label+": no staff assigned"}));});
  cl.forEach(k=>{const p=k.split("|");issues.push({t:"error",m:"CLASH: "+p[1]+" double-booked on "+dates[Number(p[0])]?.label});});
  if(pupils.length===0)issues.push({t:"warn",m:"No pupils imported yet"});
  if(!allocRes)issues.push({t:"info",m:"Allocation not yet run"});

  // ── v50 data-integrity scans ──────────────────────────────────
  // 1. Per-date overrides referencing activities that don't run on that date
  Object.keys(allocDateOverrides||{}).forEach(k=>{
    const val=allocDateOverrides[k];
    if(!val||val==="__UNASSIGNED__")return;
    const parts=k.split("|");
    const di=Number(parts[0]);const email=parts.slice(1).join("|");
    const d=dates[di];if(!d)return;
    const act=findActByName_exact(val);
    if(!act){
      issues.push({t:"error",m:"Stale override: "+email+" on "+(d.label||("#"+di))+" → \""+val+"\" (activity not found)"});
      return;
    }
    if(!act.di.includes(di)){
      issues.push({t:"error",m:"Stale override: "+email+" on "+(d.label||("#"+di))+" → \""+val+"\" (activity does not run that date)"});
    }
  });

  // 2. Dates with a blank half-term value
  sortedDateIndices().forEach(di=>{ const d=dates[di];
    if(!d.half||!String(d.half).trim()){
      issues.push({t:"warn",m:"Date "+(d.label||("#"+di))+": no half-term value set (pupils can't be allocated)"});
    }
    // v77.1: also check the `full` field is parseable DMY. Anything else sorts
    // to the end via the parseDateDmy sentinel and would appear visibly out of
    // order on every display tab.
    const full=d.full;
    if(!full||typeof full!=="string"||!/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(full.trim())){
      issues.push({t:"error",m:"Date "+(d.label||("#"+di))+": 'full' value \""+(full||"")+"\" is not DD/MM/YYYY — will sort to end of every tab. Delete and re-add via Settings → Dates."});
    }
  });
  // Informational: show date counts per half so anomalies are eyeball-detectable
  const halfCounts={};
  dates.forEach(d=>{if(d.half){halfCounts[d.half]=(halfCounts[d.half]||0)+1;}});

  // 3. sa entries keyed "di|code" where the activity is split (should be "di|code|A" or "di|code|B")
  Object.keys(sa).forEach(k=>{
    const parts=k.split("|");
    if(parts.length!==2)return; // only check 2-part keys
    const actName=saGet(k);
    if(!actName)return;
    const act=findActByName_exact(actName);
    if(!act)return;
    if(isSplitAct(act)){
      const di=Number(parts[0]);const code=parts[1];
      issues.push({t:"warn",m:"Staff "+code+" on "+(dates[di]?.label||("#"+di))+": assigned to split activity \""+actName+"\" without session letter — reassign via Staff Calendar"});
    }
  });

  // 4. Duplicate pupil records (same normalised email appears twice)
  const emailCounts={};
  pupils.forEach(p=>{const ne=normEmail(p.email);if(ne){emailCounts[ne]=(emailCounts[ne]||0)+1;}});
  Object.entries(emailCounts).forEach(([ne,n])=>{
    if(n>1)issues.push({t:"error",m:"Duplicate pupil record: "+ne+" appears "+n+" times"});
  });

  // 5. Pupils with no email
  const noEmail=pupils.filter(p=>!normEmail(p.email));
  if(noEmail.length){
    noEmail.slice(0,5).forEach(p=>{
      const n=((p.pref||p.forename||"")+" "+(p.surname||"")).trim()||"(blank name)";
      issues.push({t:"warn",m:"Pupil \""+n+"\" has no email (cannot be allocated)"});
    });
    if(noEmail.length>5)issues.push({t:"warn",m:"… and "+(noEmail.length-5)+" more pupil(s) with no email"});
  }

  // 6. Consent-required activities with allocated pupils but no consent recorded
  if(allocRes&&allocRes.length){
    const engMap=buildEngMap();
    const allNe=getAllAllocEmails();
    const missingByAct={}; // actName → [pupil names]
    acts.forEach(a=>{
      if(!a.consentReq)return;
      if(!a.di||!a.di.length)return;
      const allocatedNe=new Set();
      a.di.forEach(di=>{
        allNe.forEach(ne=>{
          if(getEffectiveAllocOnDate(ne,di,engMap)===a.n)allocatedNe.add(ne);
        });
      });
      allocatedNe.forEach(ne=>{
        const cm=consentMap[ne]||{};
        if(!cm[a.n]){
          if(!missingByAct[a.n])missingByAct[a.n]=[];
          const p=findPupilByEmail(ne);
          const name=p?((p.pref||p.forename||"")+" "+(p.surname||"")).trim():ne;
          missingByAct[a.n].push(name||ne);
        }
      });
    });
    Object.entries(missingByAct).forEach(([actName,names])=>{
      issues.push({t:"warn",m:actName+" (consent required): "+names.length+" pupil(s) allocated without consent recorded — "+names.slice(0,3).join(", ")+(names.length>3?" …":"")});
    });
  }

  el.appendChild(h("div",{className:"page-header"},h("h2",null,"Pre-Flight Checks")));

  const errs=issues.filter(i=>i.t==="error").length;
  const warns=issues.filter(i=>i.t==="warn").length;
  const infos=issues.filter(i=>i.t==="info").length;

  el.appendChild(h("div",{className:"stats-row mb-16"},
    h("div",{className:"stat-card"},h("div",{className:"stat-val",style:{color:errs>0?"var(--red)":"var(--green)"}},errs),h("div",{className:"stat-label"},"Errors")),
    h("div",{className:"stat-card"},h("div",{className:"stat-val",style:{color:warns>0?"var(--amber)":"var(--green)"}},warns),h("div",{className:"stat-label"},"Warnings")),
    h("div",{className:"stat-card"},h("div",{className:"stat-val",style:{color:"var(--text3)"}},infos),h("div",{className:"stat-label"},"Info"))
  ));

  // Half-term date distribution (visual check for LEX Week / custom mislabelling)
  if(Object.keys(halfCounts).length){
    const halfRow=h("div",{className:"card card-pad mb-16",style:{fontSize:"11px"}});
    halfRow.appendChild(h("div",{style:{fontWeight:600,marginBottom:"6px",color:"var(--text2)"}},"Dates per half-term"));
    const row=h("div",{style:{display:"flex",flexWrap:"wrap",gap:"8px"}});
    Object.entries(halfCounts).sort().forEach(([hv,n])=>{
      row.appendChild(h("span",{style:{padding:"2px 8px",background:halfColorSoft(hv),color:halfColor(hv),borderRadius:"4px",fontWeight:600}},hv+": "+n+(n===1?" date":" dates")));
    });
    halfRow.appendChild(row);
    el.appendChild(halfRow);
  }

  if(issues.length===0){el.appendChild(h("div",{className:"alert alert-success",style:{fontSize:"14px",fontWeight:600}},"✓ All checks passed — ready to go!"));return;}
  // Sort: errors first, then warnings, then info
  const sortOrder={error:0,warn:1,info:2};
  issues.sort((a,b)=>(sortOrder[a.t]||9)-(sortOrder[b.t]||9));
  issues.forEach(x=>{el.appendChild(h("div",{className:"alert alert-"+(x.t==="error"?"error":x.t==="warn"?"warn":"info")},x.m));});
}

  const _MON3=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const _DOW3=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  function _autoLabelFromDate(v){

    const raw=di.value.trim();

// v77.2: Consent Audit report. Read-only; no mutations to consentMap or any
// other state. Walks current allocations + historical _autoSnapshots to surface
// shrinkage that would otherwise go unnoticed until a parent complaint arrives.
function renderConsentAudit(el){
  const engMap=buildEngMap();
  el.appendChild(h("div",{className:"page-header"},h("h2",null,"✓ Consent Audit"),h("p",null,"Read-only report. No data is changed by viewing this page.")));

  // ----- Compute current state -----
  // Build map of pupil-email -> {needed:[actName], held:[actName], missing:[actName]}
  const pupilState={};
  const allEmails=new Set();
  if(allocRes&&allocRes.length){
    allocRes.forEach(r=>{const ne=normEmail(r.email);if(ne)allEmails.add(ne);});
  }
  pupils.forEach(p=>{const ne=normEmail(p.email);if(ne)allEmails.add(ne);});

  let totalNeeded=0,totalHeld=0,pupilsWithMissing=0;
  allEmails.forEach(ne=>{
    const needed=getConsentActivitiesForPupil(ne,engMap);
    if(!needed.length){pupilState[ne]={needed:[],held:[],missing:[]};return;}
    const cm=consentMap[ne]||{};
    const held=needed.filter(a=>!!cm[a]);
    const missing=needed.filter(a=>!cm[a]);
    pupilState[ne]={needed,held,missing};
    totalNeeded+=needed.length;totalHeld+=held.length;
    if(missing.length)pupilsWithMissing++;
  });
  const pupilsWithNeed=Object.values(pupilState).filter(s=>s.needed.length).length;
  const pctHeld=totalNeeded?Math.round((totalHeld/totalNeeded)*100):100;

  // ----- Section A: summary cards -----
  const summary=h("div",{className:"flex mb-16",style:{gap:"10px",flexWrap:"wrap"}});
  function statCard(label,val,col){
    return h("div",{className:"card card-pad",style:{minWidth:"140px",borderLeft:"4px solid "+(col||"var(--accent)")}},
      h("div",{style:{fontSize:"22px",fontWeight:700,color:col||"var(--text)"}},String(val)),
      h("div",{style:{fontSize:"11px",color:"var(--text3)"}},label)
    );
  }
  summary.appendChild(statCard("Pupils with consent needs",pupilsWithNeed,"var(--accent)"));
  summary.appendChild(statCard("Total ticks needed",totalNeeded,"var(--accent)"));
  summary.appendChild(statCard("Total ticks held",totalHeld,"var(--green)"));
  summary.appendChild(statCard("Coverage",pctHeld+"%",pctHeld>=95?"var(--green)":(pctHeld>=80?"var(--amber)":"var(--red)")));
  summary.appendChild(statCard("Pupils missing ≥1",pupilsWithMissing,pupilsWithMissing>0?"var(--amber)":"var(--green)"));
  el.appendChild(summary);

  // ----- Section B: shrinkage detection vs auto-snapshots -----
  const shrinkCard=h("div",{className:"card card-pad mb-16"});
  shrinkCard.appendChild(h("div",{className:"card-header",style:{marginBottom:"8px"}},h("span",{className:"card-title"},"Shrinkage detection")));
  shrinkCard.appendChild(h("p",{style:{fontSize:"11px",color:"var(--text3)",marginBottom:"10px"}},
    "Compares current ticks against historical auto-snapshots. Any tick that existed in a past snapshot but is missing now (for an activity still consent-required and a pupil still in the relevant allocation) is flagged. This is the data-loss signal the v69 fix was designed to make impossible — it should be empty in normal operation."));
  const snaps=(typeof _autoSnapshots!=="undefined"&&Array.isArray(_autoSnapshots))?_autoSnapshots:[];
  if(!snaps.length){
    shrinkCard.appendChild(h("div",{className:"alert alert-info"},"No auto-snapshots available yet. Snapshots accumulate as you use the system; check back after a few sessions of activity."));
  } else {
    // Build "tick should still exist" predicate: pupil currently has activity in needed AND tick exists in some historical snap but missing now.
    const lostTicks=[]; // [{email, act, lastSeenTs}]
    Object.keys(pupilState).forEach(ne=>{
      const needed=pupilState[ne].needed;
      if(!needed.length)return;
      const cmNow=consentMap[ne]||{};
      needed.forEach(act=>{
        if(cmNow[act])return; // currently held, nothing to flag
        // Walk snapshots (newest first), find if any held it
        for(let i=0;i<snaps.length;i++){
          const s=snaps[i];
          const histCm=(s.consentMap||{})[ne]||{};
          if(histCm[act]){
            lostTicks.push({email:ne,act,lastSeenTs:s.ts});
            break;
          }
        }
      });
    });
    if(!lostTicks.length){
      shrinkCard.appendChild(h("div",{className:"alert alert-success"},"✓ No shrinkage detected across "+snaps.length+" snapshots. Current state matches or exceeds every historical point."));
    } else {
      shrinkCard.appendChild(h("div",{className:"alert alert-warn"},"⚠ "+lostTicks.length+" tick"+(lostTicks.length===1?"":"s")+" present in a past snapshot but missing now. Review below — these may indicate data loss."));
      const lostTbl=h("table",{style:{width:"100%",fontSize:"12px",marginTop:"8px",borderCollapse:"collapse"}});
      const lthead=h("thead",null,h("tr",null,h("th",null,"Pupil email"),h("th",null,"Activity"),h("th",null,"Last seen (snapshot)")));
      lostTbl.appendChild(lthead);
      const ltbody=h("tbody");
      lostTicks.slice(0,200).forEach(lt=>{
        const when=lt.lastSeenTs?new Date(lt.lastSeenTs).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"—";
        ltbody.appendChild(h("tr",null,h("td",null,lt.email),h("td",null,lt.act),h("td",{style:{color:"var(--text3)",fontSize:"11px"}},when)));
      });
      lostTbl.appendChild(ltbody);
      shrinkCard.appendChild(lostTbl);
      if(lostTicks.length>200)shrinkCard.appendChild(h("div",{style:{fontSize:"11px",color:"var(--text3)",marginTop:"8px"}},"Showing first 200 of "+lostTicks.length+"."));
    }
  }
  el.appendChild(shrinkCard);

  // ----- Section C: per-activity breakdown -----
  const actStats={}; // actName -> {needed, held}
  Object.values(pupilState).forEach(s=>{
    s.needed.forEach(a=>{
      if(!actStats[a])actStats[a]={needed:0,held:0};
      actStats[a].needed++;
      if(s.held.includes(a))actStats[a].held++;
    });
  });
  const actRows=Object.entries(actStats).map(([a,v])=>({
    act:a,needed:v.needed,held:v.held,missing:v.needed-v.held,
    pct:v.needed?Math.round((v.held/v.needed)*100):100

      if(reqName<0){toast("CSV must have a 'Name' column","err");return;}
      // v87: detect per-date Y/N columns (header = exact date label); flag headers matching neither a field nor a date
      const _knownFields=new Set(["name","year groups","yg","capacity","cap","lead","support","venue","cost","session","sess","notes","offsite","sessa","sessb","sessavenue","sessbvenue"]);
      const dateCols=[];const unknownHeaders=[];
      headers.forEach((hdr,i)=>{

        if(di>=0)dateCols.push({i,di});
        else if(!_knownFields.has(hdr))unknownHeaders.push(hdr);
      });
      const hasDateCols=dateCols.length>0;
      let added=0,updated=0;
      lines.slice(1).forEach(l=>{
        const c=l.split(sep).map(x=>x.replace(/^"|"$/g,"").trim());

        const data={
          n:name,

          lead:get("lead")||"",
          staff:(get("support")||"").split(",").map(s=>s.trim()).filter(Boolean),
          v:get("venue")||"TBC",
          cost:get("cost")||"FOC",
          sess:get("session")||get("sess")||"A+B",
          notes:get("notes")||"",

          sessA:get("sessa")||"",

          sessAVenue:get("sessavenue")||"",

        if(hasDateCols){
          // scope-aware: the imported date columns define what this file governs; dates outside the
          // imported scope are preserved on existing activities (so a single-term file is per-term safe)
          const _scope=new Set(dateCols.map(dc=>dc.di));
          const _on=dateCols.filter(dc=>/^(y|yes|true|1|x|✓)$/i.test(c[dc.i]||"")).map(dc=>dc.di);
          const _kept=existing?(existing.di||[]).filter(di=>!_scope.has(di)):[];
          data.di=[...new Set([..._kept,..._on])].sort((x,y)=>x-y);

        else{const na={id:"I"+Date.now().toString(36).slice(-4)+(added+updated),mb:0,...data};if(!na.di)na.di=[];acts.push(na);added++;}
      });

      if(unknownHeaders.length)alert("These column headers were not recognised as fields or dates, so they were ignored: "+unknownHeaders.join(", ")+". Date columns must match a date label exactly (export first to get them), and any new date must be added in Settings \u2192 Dates before it can be imported.");
      render();

    h("button",{className:"btn btn-ghost btn-sm",onClick:()=>{

      const cols=["Name","Year Groups","Capacity","Lead","Support","Venue","Cost","Session","Notes","Offsite","SessA","SessB","SessAVenue","SessBVenue",..._dis.map(di=>dates[di].label)];
      const rows=[cols.join("\t")];

          a.offsite?"yes":"",a.sessA||"",a.sessB||"",a.sessAVenue||"",a.sessBVenue||"",
          ..._dis.map(di=>a.di&&a.di.includes(di)?"Y":"N")
        ].join("\t"));
      });
      const tsv=rows.join("\n");
      const blob=new Blob([tsv],{type:"text/tab-separated-values"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");a.href=url;a.download="LEX-"+SYSTEM_YEAR_LABEL+"-activities"+(_term==="__all__"?"":"-"+_term)+".tsv";a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);

  ));
  el.appendChild(csvActCard);

  [[
    "Import Staff","Columns: Code, Name, Role\nCode\tName\tRole\nABC\tSmith\tHoD",
    (csv,sep)=>{
      const lines=csv.split("\n");let count=0;
      lines.slice(1).forEach(l=>{const c=l.split(sep).map(x=>x.replace(/^"|"$/g,"").trim());if(!c[0])return;if(!staff.some(s=>s.c===c[0])){staff.push({c:c[0],n:c[1]||"",r:c[2]||"",email:c[3]||guessStaffEmail(c[0],c[1]||"")});count++;}});

    ["acts","staff","sa","pupils","dates"].map(k=>"lex12-"+k)
      .concat([_ARCH_KEY]).forEach(k=>localStorage.removeItem(k));

function renderPublicTimetable(){

  }

  // ── My Timetable tab ──
  function buildMyTab(){
    // Show loading state if no data yet

        h("div",{style:{fontSize:"12px",color:"var(--text3)"}},"Connecting to Supabase. This usually takes a few seconds.")
      ));
      // v66: single self-healing retry — guard prevents stacked timers when
      // the user tab-hops while data is still loading.
      if(!window._pubMyRetry){window._pubMyRetry=true;
        setTimeout(()=>{window._pubMyRetry=false;if(window._pubTab==="mine"){tabContent.innerHTML="";buildMyTab();}},3000);}
      return;
    }
    if(!allocRes||!allocRes.length){

    tabContent.appendChild(h("p",{style:{fontSize:"13px",color:"var(--text2)",marginBottom:"12px"}},"Type your name to see your personal timetable and how your choices compared to your allocation."));

    const myResult=h("div",null);
    tabContent.appendChild(myResult);

    function buildMyResult(query){
      myResult.innerHTML="";
      if(!query||query.length<2)return;
      const q=query.toLowerCase();
      const found=pupils.filter(p=>
        (p.surname||"").toLowerCase().includes(q)||
        (p.forename||"").toLowerCase().includes(q)||
        (p.pref||"").toLowerCase().includes(q)
